# Imatge privada en lloc de la compilació local. No es carrega sol: al .env,
# COMPOSE_FILE=docker-compose.yml:docker-compose.image.yml
# i BACKEND_IMAGE=el nom de la imatge.
# Treu el build perquè `up --build` no reconstrueixi ni reetiqueti aquesta imatge.
services:
  backend:
    image: ${BACKEND_IMAGE:?Cal BACKEND_IMAGE}
    build: !reset null
  celery-worker:
    image: ${BACKEND_IMAGE:?Cal BACKEND_IMAGE}
    build: !reset null
  celery-beat:
    image: ${BACKEND_IMAGE:?Cal BACKEND_IMAGE}
    build: !reset null
  gmao-consumer:
    image: ${BACKEND_IMAGE:?Cal BACKEND_IMAGE}
    build: !reset null
