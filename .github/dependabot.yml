version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Totes les actualitzacions d'accions en una sola PR, per revisar-les i fusionar-les juntes
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
