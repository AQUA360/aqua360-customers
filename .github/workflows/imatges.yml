# Construeix les imatges del backend i del frontend un sol cop per release i les puja al registre de
# GitHub (ghcr.io) amb l'etiqueta de la versió i la del commit. Els servidors dels clients només les
# baixen.
#
# També a cada commit de main i de develop, amb l'etiqueta de la branca i la del commit: una
# instal·lació que segueix una branca rep els canvis sense esperar cap release i sense construir les
# imatges al seu servidor. Cada imatge porta el commit, i per això main i develop no es trepitgen.
#
# Seguretat: el registre és públic, igual que aquest repositori. Aquí només es construeix el codi
# del repositori: cap .env, servidor, domini ni contrasenya. La configuració de cada client es posa
# en engegar el contenidor, al seu servidor.
#
# Dues plataformes: Intel (linux/amd64) i ARM (linux/arm64). Cada una es construeix en una màquina
# de GitHub de la seva arquitectura, sense emulació, i es puja sense etiqueta; després, el job
# `etiquetes` les ajunta en una sola imatge amb les etiquetes de sempre (la versió i el commit).
# Cada servidor baixa la de la seva arquitectura.
#
# A les PR que toquen aquest fitxer o un Dockerfile, només es construeix (sense pujar res) per
# comprovar que les dues plataformes surten.

name: Imatges

on:
  release:
    types: [published]
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    paths:
      - .github/workflows/imatges.yml
      - backend/Dockerfile
      - frontend/Dockerfile
  workflow_dispatch:
    inputs:
      versio:
        description: "Etiqueta de la versió (per exemple, v1.135.00)"
        required: true

permissions:
  contents: read
  packages: write

# En una branca, només compta l'últim commit: si n'entra un altre, el d'abans es deixa de construir.
concurrency:
  group: imatges-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.versio || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  VERSIO: ${{ github.event.release.tag_name || inputs.versio || github.ref_name }}
  # El codi que es construeix: la release, la versió demanada o el commit exacte de la branca
  # (a una PR, el de la branca de la PR).
  CODI: ${{ github.event.release.tag_name || inputs.versio || github.event.pull_request.head.sha || github.sha }}
  # A una PR no es puja res.
  PUJAR: ${{ github.event_name != 'pull_request' }}

jobs:
  # El commit exacte es fixa un sol cop: si una branca avança mentre es construeix, totes les
  # plataformes i l'etiqueta del commit són del mateix.
  codi:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.CODI }}

      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  imatge:
    needs: codi
    runs-on: ${{ matrix.plataforma.runner }}
    strategy:
      matrix:
        part: [backend, frontend]
        plataforma:
          - { nom: linux/amd64, arq: amd64, runner: ubuntu-24.04 }
          - { nom: linux/arm64, arq: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.codi.outputs.sha }}
          # Historial i etiquetes complets: `git describe --tags` dona la darrera release de les
          # imatges de branca.
          fetch-depth: 0

      # Etiqueta també amb el commit: HelpAsset, en actualitzar, busca la imatge del commit que
      # posa i, si no hi és, la construeix al servidor.
      #
      # La resta és la informació del deploy que es mostra al NavSidebar (es passa com a build
      # args: el context del build no porta .git). La data del deploy és la del build: la imatge
      # és immutable i reiniciar el contenidor no la canvia.
      - id: commit
        env:
          ESDEVENIMENT: ${{ github.event_name }}
          BRANCA: ${{ github.ref_name }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "$ESDEVENIMENT" = "push" ]; then
            # Imatge de branca: la darrera release i la branca (el NavSidebar mostra
            # «v1.152.01 + develop (abcdef12)»).
            echo "version=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCA" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSIO" >> "$GITHUB_OUTPUT"
            echo "branch=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - if: env.PUJAR == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.part }}
          platforms: ${{ matrix.plataforma.nom }}
          build-args: |
            APP_VERSION=${{ steps.commit.outputs.version }}
            GIT_COMMIT=${{ steps.commit.outputs.sha }}
            GIT_COMMIT_DATE=${{ steps.commit.outputs.date }}
            GIT_BRANCH=${{ steps.commit.outputs.branch }}
            BUILD_DATE=${{ steps.commit.outputs.built }}
          # Sense etiqueta: el job `etiquetes` posa la de la versió i la del commit a la imatge de
          # les dues plataformes.
          outputs: type=image,name=ghcr.io/aqua360/aqua360-customers-${{ matrix.part }},push-by-digest=true,name-canonical=true,push=${{ env.PUJAR }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSIO }}
          cache-from: type=gha,scope=${{ matrix.part }}-${{ matrix.plataforma.arq }}
          cache-to: type=gha,mode=max,scope=${{ matrix.part }}-${{ matrix.plataforma.arq }}

      - name: Desar el digest
        if: env.PUJAR == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - if: env.PUJAR == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.part }}-${{ matrix.plataforma.arq }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Ajunta les dues plataformes de cada part en una sola imatge amb les etiquetes de sempre: la
  # versió (o la branca) i el commit. HelpAsset busca la del commit.
  etiquetes:
    if: github.event_name != 'pull_request'
    needs: [codi, imatge]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [backend, frontend]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.part }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetar la imatge de les dues plataformes
        working-directory: /tmp/digests
        env:
          IMATGE: ghcr.io/aqua360/aqua360-customers-${{ matrix.part }}
          SHA: ${{ needs.codi.outputs.sha }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "$IMATGE:$VERSIO" \
            -t "$IMATGE:$SHA" \
            $(printf "$IMATGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMATGE:$SHA"
