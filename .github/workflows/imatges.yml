# Construeix les imatges del backend i del frontend un sol cop per release i les puja al registre de
# GitHub (ghcr.io) amb l'etiqueta de la versió i la del commit. Els servidors dels clients només les
# baixen.
#
# També a cada commit de develop, amb l'etiqueta `develop` i la del commit: els clients que segueixen
# develop reben els canvis sense esperar cap release i sense construir les imatges al seu servidor.
#
# Seguretat: el registre és públic, igual que aquest repositori. Aquí només es construeix el codi
# del repositori: cap .env, servidor, domini ni contrasenya. La configuració de cada client es posa
# en engegar el contenidor, al seu servidor.
name: Imatges

on:
  release:
    types: [published]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      versio:
        description: "Etiqueta de la versió (per exemple, v1.135.00)"
        required: true

permissions:
  contents: read
  packages: write

# A develop, només compta l'últim commit: si n'entra un altre, el d'abans es deixa de construir.
concurrency:
  group: imatges-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  VERSIO: ${{ github.event.release.tag_name || inputs.versio || 'develop' }}
  # El codi que es construeix: la release, la versió demanada o el commit exacte de develop.
  CODI: ${{ github.event.release.tag_name || inputs.versio || github.sha }}

jobs:
  imatge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CODI }}

      # Etiqueta també amb el commit: HelpAsset, en actualitzar, busca la imatge del commit que
      # posa i, si no hi és, la construeix al servidor.
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.part }}
          push: true
          tags: |
            ghcr.io/aqua360/aqua360-customers-${{ matrix.part }}:${{ env.VERSIO }}
            ghcr.io/aqua360/aqua360-customers-${{ matrix.part }}:${{ steps.commit.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSIO }}
          cache-from: type=gha,scope=${{ matrix.part }}
          cache-to: type=gha,mode=max,scope=${{ matrix.part }}
