# Construeix les imatges del backend i del frontend un sol cop per release i les puja al registre de
# GitHub (ghcr.io) amb l'etiqueta de la versió i la del commit. Els servidors dels clients només les
# baixen.
#
# També a cada commit de main i de develop, amb l'etiqueta de la branca i la del commit: una
# instal·lació que segueix una branca rep els canvis sense esperar cap release i sense construir les
# imatges al seu servidor. Cada imatge porta el commit, i per això main i develop no es trepitgen.
#
# Seguretat: el registre és públic, igual que aquest repositori. Aquí només es construeix el codi
# del repositori: cap .env, servidor, domini ni contrasenya. La configuració de cada client es posa
# en engegar el contenidor, al seu servidor.
name: Imatges

on:
  release:
    types: [published]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      versio:
        description: "Etiqueta de la versió (per exemple, v1.135.00)"
        required: true

permissions:
  contents: read
  packages: write

# En una branca, només compta l'últim commit: si n'entra un altre, el d'abans es deixa de construir.
concurrency:
  group: imatges-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.versio || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  VERSIO: ${{ github.event.release.tag_name || inputs.versio || github.ref_name }}
  # El codi que es construeix: la release, la versió demanada o el commit exacte de la branca.
  CODI: ${{ github.event.release.tag_name || inputs.versio || github.sha }}

jobs:
  imatge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CODI }}
          # Historial i etiquetes complets: `git describe --tags` dona la versió de les imatges
          # de branca (per exemple, v1.152.01-5-gabcdef12).
          fetch-depth: 0

      # Etiqueta també amb el commit: HelpAsset, en actualitzar, busca la imatge del commit que
      # posa i, si no hi és, la construeix al servidor.
      #
      # La resta és la informació del deploy que es mostra al NavSidebar (es passa com a build
      # args: el context del build no porta .git). La data del deploy és la del build: la imatge
      # és immutable i reiniciar el contenidor no la canvia.
      - id: commit
        env:
          ESDEVENIMENT: ${{ github.event_name }}
          BRANCA: ${{ github.ref_name }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "$ESDEVENIMENT" = "push" ]; then
            echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCA" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSIO" >> "$GITHUB_OUTPUT"
            echo "branch=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.part }}
          push: true
          build-args: |
            APP_VERSION=${{ steps.commit.outputs.version }}
            GIT_COMMIT=${{ steps.commit.outputs.sha }}
            GIT_COMMIT_DATE=${{ steps.commit.outputs.date }}
            GIT_BRANCH=${{ steps.commit.outputs.branch }}
            BUILD_DATE=${{ steps.commit.outputs.built }}
          tags: |
            ghcr.io/aqua360/aqua360-customers-${{ matrix.part }}:${{ env.VERSIO }}
            ghcr.io/aqua360/aqua360-customers-${{ matrix.part }}:${{ steps.commit.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSIO }}
          cache-from: type=gha,scope=${{ matrix.part }}
          cache-to: type=gha,mode=max,scope=${{ matrix.part }}
