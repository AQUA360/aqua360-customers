# Passa les proves del backend i construeix el frontend a cada PR cap a main o develop.
#
# Seguretat: el repositori és públic. Aquí no hi ha cap secret ni cap dada real: la base de dades
# és buida i la crea l'acció mateixa.
name: Proves

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: proves-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: user_test
          POSTGRES_PASSWORD: password_test
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user_test" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: customers.settings_test
      SECRET_KEY: proves
      ALLOWED_HOSTS: localhost
      DATABASE_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.ubuntu.txt
      - name: Llibreries del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev libcairo2-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev libffi-dev pkg-config gettext
      - name: Dependències
        run: pip install -r requirements.ubuntu.txt
      - name: Proves
        run: python manage.py test --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
