# Passa les proves del backend i construeix el frontend a cada PR cap a main o develop, i a la cua
# de fusió (merge_group), on es proven les PR juntes amb el develop més nou abans de fusionar-les.
#
# La base de test es restaura des d'un abocament SQL ja migrat. La clau és el hash de les
# migracions, del generador de l'abocament i de les dependències: un canvi de settings que no
# toca l'esquema no l'invalida. Si la clau no coincideix, es restaura l'abocament més recent
# (el de develop, visible per totes les PR) i només s'apliquen les migracions que hi falten.
# L'històric sencer es torna a aplicar només quan aquest abocament no encaixa amb el codi.
# La cache que desa una PR no la veuen les altres; per això cada PR parteix de develop.
#
# Seguretat: el repositori és públic. Aquí no hi ha cap secret ni cap dada real: la base de dades
# és buida i la crea l'acció mateixa. L'abocament només conté l'esquema i les dades de les migracions.
name: Proves

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  merge_group:

permissions:
  contents: read

concurrency:
  group: proves-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: user_test
          POSTGRES_PASSWORD: password_test
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user_test" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: customers.settings_test
      SECRET_KEY: proves
      ALLOWED_HOSTS: localhost
      DATABASE_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.ubuntu.txt
      - name: Llibreries del sistema
        # Si els miralls d'apt no responen, que falli aviat en lloc de quedar-se penjat
        timeout-minutes: 15
        run: |
          apt_opts=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          apt_llest=""
          # Actualitza l'índex un sol cop. Si el DNS del runner no resol els miralls
          # d'Ubuntu, es fan servir DNS públics; si tot i així falla, s'atura de seguida.
          resol_miralls() {
            timeout 10 getent hosts azure.archive.ubuntu.com >/dev/null \
              && timeout 10 getent hosts archive.ubuntu.com >/dev/null
          }
          prepara_apt() {
            [ -n "$apt_llest" ] && return 0
            if ! resol_miralls; then
              echo "::warning::El DNS del runner no resol els miralls d'Ubuntu; es fan servir DNS públics"
              interficie=$(ip route show default | awk '{print $5; exit}')
              sudo resolvectl dns "$interficie" 1.1.1.1 8.8.8.8
              sudo resolvectl flush-caches
              resol_miralls || echo "::warning::Tampoc es resolen amb DNS públics"
            fi
            if ! sudo apt-get "${apt_opts[@]}" update --error-on=any; then
              echo "::error::No es pot actualitzar l'índex d'apt: els miralls d'Ubuntu no responen"
              return 1
            fi
            apt_llest=1
          }
          instal_la() {
            prepara_apt && sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends "$@"
          }
          # Només s'instal·la el que la imatge del runner no porta
          paquets=(libpq-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev libffi-dev
                   pkg-config gettext postgresql-client)
          falten=()
          for paquet in "${paquets[@]}"; do
            dpkg -s "$paquet" >/dev/null 2>&1 || falten+=("$paquet")
          done
          if [ ${#falten[@]} -gt 0 ]; then
            instal_la "${falten[@]}"
          fi
          # El servidor de proves és PostgreSQL 16. Si el runner porta un client
          # més nou i el paquet del 16 existeix, el posem davant al PATH.
          if ! pg_dump --version | grep -q ' 16\.'; then
            instal_la postgresql-client-16 \
              && echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH" \
              && export PATH="/usr/lib/postgresql/16/bin:$PATH" \
              || echo "Segueix el client ja instal·lat: $(pg_dump --version)"
          fi
          pg_dump --version
      - name: Dependències
        run: pip install -r requirements.ubuntu.txt
      - name: Restaura l'esquema de test
        id: esquema
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/.ci/test_schema.sql
          key: esquema-proves-pg16-${{ hashFiles('backend/**/migrations/*.py', 'backend/customers/test_db/**', 'backend/coredata/management/commands/build_test_schema.py', 'backend/customers/settings.py', 'backend/customers/settings_test.py', 'backend/requirements.in', 'backend/requirements.ubuntu.txt') }}
          restore-keys: |
            esquema-proves-pg16-
      - name: Genera l'esquema de test
        if: steps.esquema.outputs.cache-hit != 'true'
        run: |
          args=(--output .ci/test_schema.sql)
          if [ -s .ci/test_schema.sql ]; then
            args+=(--from-dump .ci/test_schema.sql)
          fi
          python manage.py build_test_schema "${args[@]}"
      - name: Desa l'esquema de test
        if: steps.esquema.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/.ci/test_schema.sql
          key: ${{ steps.esquema.outputs.cache-primary-key }}
      - name: Proves
        env:
          TEST_SCHEMA_FILE: .ci/test_schema.sql
        run: python manage.py test --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
