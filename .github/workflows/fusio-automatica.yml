# Activa la fusió automàtica a cada PR cap a develop: GitHub la fusiona sola quan passen totes les
# validacions obligatòries (backend, frontend, CodeQL i CodeRabbit). No s'aplica a main: les
# releases es fusionen a mà. Les PR en esborrany i les que vénen d'un fork no la tenen. Es pot
# desactivar a cada PR amb «Disable auto-merge».
#
# Seguretat: el repositori és públic. Cap secret: només el GITHUB_TOKEN de l'acció.
name: Fusió automàtica

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  activa:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Activar la fusió automàtica
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
