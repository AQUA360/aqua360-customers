# Versió en català de la documentació OpenAPI de l'Oficina Virtual.
# La versió en castellà és openapi.yaml. Qualsevol canvi a l'API s'ha de fer a les
# dues versions (ho comprova test_openapi_consistency.py). Vegeu README.md.
openapi: 3.0.3
info:
  title: Programa d'Abonats — API Oficina Virtual (OV)
  description: |
    API de consulta i modificació de dades d'abonats per a Oficines Virtuals (OV)
    i altres aplicacions de tercers integrades amb Aqua360 — Customers (Programa d'Abonats).

    ## Resum d'endpoints

    | Endpoint | Mètode | Descripció |
    |---|---|---|
    | `/auth/login/` | POST | Obtenció del token (usuari del grup `ov`) |
    | `/ov/contract-detail/` | GET | Detall del contracte |
    | `/ov/billing-data/` | GET / POST | Consulta i actualització de dades de facturació |
    | `/ov/billing-data/update-iban/` | POST | Actualització de l'IBAN i pas del contracte a domiciliació |
    | `/ov/contact-data/` | GET | Consulta de la configuració del perfil (dades de facturació + adreça del titular) |
    | `/ov/person-data/` | GET | Dades de contacte de la persona per DNI (telèfons, correus i adreces, incloses les inactives) |
    | `/ov/person-invoices/` | GET | Factures d'una persona per DNI com a titular o pagadora, agrupades per contracte (inclou contractes de baixa i factures sense contracte) |
    | `/ov/person-contracts/` | GET | Contractes actuals i antics d'una persona per DNI, amb el seu paper (titular o pagadora) i si està vinculada avui |
    | `/ov/invoices/` | GET | Llistat de factures (exclou prefactures) |
    | `/ov/invoices/download/` | POST | Baixada en lot de factures seleccionades (ZIP) |
    | `/ov/invoice/` | GET | Detall d'una factura |
    | `/ov/invoice/{token}/detail/` | GET | Detall complet d'una factura (tarifes i desglossament fiscal) |
    | `/ov/invoice/paid/` | POST | Marcar factura com a pagada (TPV en línia) |
    | `/ov/invoice/quick-pay/` | POST | Resoldre factura per número de contracte, número de factura i import exacte per al pagament ràpid (només lectura) |
    | `/ov/invoice/return-request/` | POST | Sol·licitar la devolució d'una factura (obre una incidència; no canvia l'estat) |
    | `/ov/payment-receipt/` | GET | Justificant de pagament en PDF codificat en base64 (pagaments en efectiu o amb targeta en TPV físic) |
    | `/ov/unpayed-invoices/` | GET | Factures impagades filtrades per estat |
    | `/ov/billed-consumptions/` | GET | Consums facturats |
    | `/ov/consumptions/` | GET | Historial de consums paginat amb filtre per dates |
    | `/ov/consumption/{id}/download/` | GET | Baixar fitxer d'un consum individual (PDF/CSV) |
    | `/ov/consumptions/download/` | POST | Baixar historial de consums en lot (selecció o tots els filtrats) |
    | `/ov/billing-periods/` | GET | Períodes de facturació disponibles del contracte |
    | `/ov/invoice-pdf/` | GET | PDF de factura en Base64 |
    | `/ov/create-reading/` | POST | Registrar lectura de comptador |
    | `/ov/contracts/` | GET | Llistat de contractes per titular o pagador (DNI) |
    | `/ov/contract/{token}/` | GET | Detall del contracte per token (inclou dades del compte) |
    | `/ov/contract/by-nic/{nic}/` | GET | Cerca de contracte per NIC (referència de mandat de 12 xifres) |
    | `/ov/meter/{contract_token}/` | GET | Detall del comptador del contracte per token |
    | `/ov/procedures/contract/` | POST | Sol·licitar l'alta d'un contracte (crea una sol·licitud; no crea contracte) |
    | `/ov/procedures/contract/{contract_request_token}/` | GET | Consultar l'estat d'una sol·licitud d'alta de contracte |
    | `/ov/procedures/contract/{contract_request_token}/pdf/` | GET | Baixar el PDF del contracte d'una sol·licitud d'alta per signar-lo fora d'Aqua360 |
    | `/ov/procedures/contract/{contract_request_token}/signed/` | POST | Pujar el contracte d'una sol·licitud d'alta signat fora d'Aqua360 |
    | `/ov/procedures/contract-termination/` | POST | Sol·licitar la baixa d'un contracte (crea una sol·licitud de baixa; no dona de baixa el contracte) |
    | `/ov/procedures/contract-change/` | POST | Sol·licitar un canvi de nom (crea la baixa del contracte actual i la sol·licitud d'alta del nou titular, enllaçades) |
    | `/ov/procedures/{contract_token}/upload-sepa-signed/` | POST | Pujar i arxivar el mandat SEPA signat del contracte |
    | `/ov/procedures/{contract_token}/sepa-signed/` | GET | Baixar el mandat SEPA signat arxivat |
    | `/ov/procedures/{contract_token}/cancel-direct-debit/` | POST | Cancel·lar la domiciliació (revocació del mandat SEPA) i canviar el tipus de pagament |
    | `/ov/dictionary/contract-statuses/` | GET | Diccionari d'estats de contracte (`token`, `name`) |
    | `/ov/dictionary/payment-types/` | GET | Diccionari de formes de pagament (`token`, `name`) |
    | `/ov/dictionary/invoice-statuses/` | GET | Diccionari d'estats de factura (`token`, `name`) |
    | `/ov/dictionary/contract-request-types/` | GET | Diccionari de tipus de sol·licitud de contracte actius amb les seves tarifes i el preu de contractació i de canvi de nom |
    | `/ov/dictionary/procedure-tariffs/` | GET | Diccionari de tarifes actives de tràmits amb preu fix o taula per calibre/consum |
    | `/ov/properties/` | GET | Autocompletat de propietats per adreça (resultats paginats) |
    | `/ov/addresses/` | GET | Autocompletat d'adreces de punts de subministrament amb escala, pis i porta (resultats paginats) |

    ## Autenticació

    1. Obtenir un token amb `POST /auth/login/` (usuari Django del grup `ov`, creat per l'administrador del PA).
    2. Incloure el token en cada crida: `Authorization: Token <token>`.

    L'usuari OV només pot accedir a rutes sota el prefix `/ov/`. Qualsevol altra ruta retorna `403 Forbidden`.

    ## Prefix d'URL

    Si el desplegament té `API_URL_PREFIX=True`, afegir el prefix `/api` a totes les rutes
    (p. ex. `/api/ov/contract-detail/`).

    ## Identificadors

    La majoria d'endpoints requereixen el paràmetre de consulta `contract_token`, que correspon
    al camp `Contract.token` del contracte al PA.

    ## Notes generals

    - Els IBAN retornats a les respostes apareixen emmascarats (8 primers caràcters + asteriscs + 8 últims). Excepció: `/ov/contract/{token}/` i `/ov/contract-detail/` retornen l'IBAN sense emmascarar quan s'envia el paràmetre de consulta `dni` i aquest coincideix amb el titular del compte de domiciliació (en aquest cas `is_account_holder` és `true`); sense `dni`, les claus `is_account_holder`, `is_holder` i `is_payer` no apareixen a la resposta.
    - Els camps booleans exposats com a text (`smart_metering`, `paper_invoice`) fan servir els valors `"true"` o `"false"`.
    - DNI bloquejats: els DNI genèrics que comparteixen moltes persones (de moment `99999999R`) no s'accepten a cap endpoint. Un cop normalitzats (sense espais, punts ni guions i en majúscules), el paràmetre de consulta `dni` respon `400` amb `{"error": "DNI not allowed"}` abans de cap consulta, també on és opcional; als cossos dels tràmits i del canvi d'IBAN (`holder_dni`, `iban_holder_dni`, `nif`, `dni`) respon `400` amb l'error `DNI not allowed.` al camp corresponent.
    - El llistat de factures (`/ov/invoices/`) exclou les prefactures (estat amb token `1`).
    - Les factures amb data d'emissió (`issue_date`) posterior a avui no es retornen en cap
      endpoint de factures (llistat, impagades, detall, PDF, baixada, pagament i devolució) fins
      que arriba aquesta data: es responen com si no existissin. Les factures sense data es retornen.
  version: 1.0.0
  contact:
    name: Aqua360 — Programa d'Abonats

servers:
  - url: https://customers.example.com
    description: Entorn de producció (substituir pel domini real)
  - url: http://localhost:8000
    description: Entorn local de desenvolupament

tags:
  - name: Autenticació
    description: Obtenció del token d'accés
  - name: Contracte
    description: Consulta de dades del contracte
  - name: Comptador
    description: Consulta de les dades del comptador del contracte
  - name: Dades de facturació
    description: Consulta i actualització de dades de facturació de l'abonat
  - name: Factures
    description: Consulta, pagament i baixada de factures
  - name: Consums
    description: Consulta de consums facturats
  - name: Lectures
    description: Registre de lectures de comptador
  - name: Tràmits
    description: Tràmits de l'abonat (alta, domiciliació, etc.) i documents adjunts
  - name: Perfil
    description: Configuració del perfil de l'abonat
  - name: Diccionaris
    description: Catàlegs de valors de referència per omplir selectors sense codificar tokens a mà

paths:
  /auth/login/:
    post:
      tags:
        - Autenticació
      summary: Obtenir el token d'accés
      description: |
        Autentica un usuari Django i retorna el token per a les crides següents.
        L'usuari ha de pertànyer al grup `ov` i ha d'haver estat creat prèviament per l'administrador del PA.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: ov_user
              password: "********"
      responses:
        "200":
          description: Autenticació correcta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                username: ov_user
                token: 7b21d0b21ac28cd8721688b5db7d484adc32101f
        "400":
          description: Dades de login invàlides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /ov/contract-detail/:
    get:
      tags:
        - Contracte
      summary: Detall del contracte per contract_token de consulta
      description: |
        Rep l'identificador com a paràmetre de consulta `contract_token`
        i retorna directament les dades completes del contracte (el mateix
        esquema `ContractFullDetail` que `GET /ov/contract/{token}/`), sense
        redirigir. El token pot contenir barra (`/`, p. ex.
        `12345678/001`), cosa que un paràmetre de ruta `<str:token>` no
        podria resoldre, per això es cerca per consulta a la base de dades.

        `400` si falta `contract_token`; `404` si el contracte no existeix.

        Igual que a `/ov/contract/{token}/`, el paràmetre opcional `dni`
        desemmascara l'IBAN quan coincideix amb el titular del compte de
        domiciliació i exposa `is_account_holder`, `is_holder` i `is_payer`
        quan s'envia.
      operationId: getContractDetail
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
        - $ref: "#/components/parameters/dniOptional"
      responses:
        "200":
          description: Dades del contracte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractFullDetail"
              example:
                token: CTR-001
                status_token: "1"
                status_name: Activo
                holder_token: "12345678A"
                payment_type: DOM
                use_type: Doméstico
                last_invoice_date: "2026-01-15T10:30:00Z"
                supply_point_address: "C/ Barcelona, 31, 08000 Barcelona"
                meter_serial_number: MTR-001
                meter_caliber: "15"
                smart_metering: "false"
                registration_date: "15/03/2020"
                termination_date: null
                nif: "12345678A"
                tenant_name: Anna Garcia
                holder_name: Anna Garcia
                city: Barcelona
                postal_code: "08110"
                paper_invoice: "false"
                email: anna.garcia@example.com
                invoice_language: es
                phone1: "600000000"
                iban: "ES12***************7890"
                holder_address: "C/ de Mallorca, 45, 2-1, 08013 Barcelona"
                status:
                  token: "1"
                  name: Activo
                has_sepa_document: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/billing-data/:
    get:
      tags:
        - Dades de facturació
      summary: Consultar dades de facturació
      description: |
        Retorna les dades de facturació i de contacte del titular associades al contracte.
      operationId: getBillingData
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
      responses:
        "200":
          description: Dades de facturació del contracte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingData"
              example:
                nif: "12345678A"
                tenant_name: Anna Garcia
                supply_point_address: "C/ Barcelona, 31, 08000 Barcelona"
                city: Barcelona
                postal_code: "08110"
                paper_invoice: "false"
                email: anna.garcia@example.com
                invoice_language: es
                phone1: "600123456"
                phone2: ""
                payment_type: DOM
                iban: "ES123456********56789012"
                holder_name: Anna Garcia
                has_sepa_document: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags:
        - Dades de facturació
      summary: Actualitzar dades de facturació
      description: |
        Actualitza les dades de contacte i el tipus de comunicació (factura en paper o digital)
        del contracte. Els canvis queden registrats a l'historial del contracte.

        El camp `paper_invoice` és obligatori. Els altres camps són opcionals;
        només s'actualitzen si s'envien al cos de la petició.
      operationId: updateBillingData
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBillingDataRequest"
            example:
              email: anna.garcia@example.com
              phone1: "600123456"
              phone2: "600654321"
              paper_invoice: false
      responses:
        "200":
          description: Dades actualitzades correctament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateBillingDataResponse"
              example:
                message: Billing data updated successfully
                data:
                  nif: "12345678A"
                  tenant_name: Anna Garcia
                  supply_point_address: "C/ Barcelona, 31, 08000 Barcelona"
                  city: Barcelona
                  postal_code: "08110"
                  paper_invoice: "false"
                  email: anna.garcia@example.com
                  invoice_language: es
                  phone1: "600123456"
                  phone2: "600654321"
                  payment_type: DOM
                  iban: "ES123456********56789012"
                  holder_name: Anna Garcia
                  has_sepa_document: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /ov/billing-data/update-iban/:
    post:
      tags:
        - Dades de facturació
      summary: Actualitzar l'IBAN i domiciliar el contracte
      description: |
        Actualitza el compte bancari (IBAN) del mètode de pagament del contracte i
        el passa a domiciliació bancària (la forma de pagament configurada com a
        domiciliació al PA, `payment_type` del diccionari
        `/ov/dictionary/payment-types/`).

        El `nif` enviat ha de coincidir amb el NIF del titular del contracte (`holder.token`).
        L'IBAN es normalitza eliminant espais i convertint-lo a majúscules.

        - Si el contracte pagava d'una altra forma (efectiu, transferència...), passa
          a domiciliació. Les factures ja emeses mantenen la seva forma de pagament;
          la domiciliació s'aplica a partir de les properes factures.
        - Si l'IBAN canvia, es genera una nova referència de mandat i el
          mandat SEPA signat de l'IBAN anterior deixa de ser vigent
          (`has_sepa_document` passa a `false`): cal pujar el nou mandat
          signat amb `POST /ov/procedures/{contract_token}/upload-sepa-signed/`.
        - Si l'IBAN és el mateix i el contracte ja està domiciliat, no es canvia
          res (la crida es pot repetir).
        - El canvi només afecta el contracte indicat, encara que el titular tingui
          altres contractes amb el mateix compte.

        Respostes d'error: `400` si falten camps o el `nif` no coincideix amb
        el titular; `404` si el contracte no existeix; `500` si el PA no té
        configurada la forma de pagament de domiciliació.
      operationId: updateIban
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIbanRequest"
            example:
              iban: ES1234567890123456789012
              nif: "12345678A"
              iban_holder_name: Anna Garcia
              iban_holder_dni: "12345678A"
      responses:
        "200":
          description: IBAN actualitzat correctament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateIbanResponse"
              example:
                message: "IBAN updated successfully "
                data:
                  nif: "12345678A"
                  tenant_name: Anna Garcia
                  supply_point_address: "C/ Barcelona, 31, 08000 Barcelona"
                  city: Barcelona
                  postal_code: "08110"
                  paper_invoice: "false"
                  email: anna.garcia@example.com
                  invoice_language: es
                  phone1: "600123456"
                  phone2: ""
                  payment_type: DOM
                  iban: "ES123456********56789012"
                  holder_name: Anna Garcia
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /ov/contact-data/:
    get:
      tags:
        - Perfil
      summary: Consultar la configuració del perfil
      description: |
        Retorna les dades de facturació i de contacte del contracte (els mateixos
        camps que `GET /ov/billing-data/`) més `holder_address`, l'adreça
        postal del titular del contracte (`PersonAddress` amb `is_billing`).

        Paràmetre obligatori `contract_token` a la query: respon `400` si
        falta i `404` si el contracte no existeix.
      operationId: getContactData
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
      responses:
        "200":
          description: Configuració del perfil del contracte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactData"
              example:
                nif: "12345678A"
                tenant_name: Anna Garcia
                supply_point_address: "C/ Barcelona, 31, 08000 Barcelona"
                city: Barcelona
                postal_code: "08110"
                paper_invoice: "false"
                email: anna.garcia@example.com
                invoice_language: es
                phone1: "600123456"
                phone2: ""
                payment_type: DOM
                iban: "ES123456********56789012"
                holder_name: Anna Garcia
                holder_address: "C/ de Mallorca, 45, 2-1, 08013 Barcelona"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/person-data/:
    get:
      tags:
        - Perfil
      summary: Consultar les dades de contacte d'una persona per DNI
      description: |
        Retorna els telèfons, els correus electrònics i les adreces de la
        persona identificada per `dni`, sense dependre de cap contracte. El
        frontal OV ho fa servir globalment per prellenar formularis i per a la
        verificació per SMS OTP.

        S'inclouen també les files històriques/inactives; cada telèfon,
        correu i adreça porta el seu propi `is_active`. Els telèfons i els
        correus provenen de les mateixes files `PersonContact`: una fila amb
        tots dos valors apareix a les dues llistes compartint `token`. Les
        files sense telèfon ni correu s'ometen.

        El `dni` és obligatori i es normalitza ignorant espais, guions i
        punts i passant a majúscules. La persona es resol primer per
        `Person.token` i, si no hi ha coincidència, pel DNI del seu compte
        bancari (`PersonBank.dni`), de manera que els pagadors també
        poden consultar les seves dades de contacte. També en aquesta cerca, el
        `Person.token` ha de coincidir amb el DNI normalitzat consultat.
        Si diverses persones comparteixen token (dades heretades), es retorna
        la que té més contactes i, en
        igualtat, la de menor `id`. Respon `400` si falta el DNI i `404` si
        no es troba la persona. L'endpoint està limitat a 35
        peticions per minut i compte.
      operationId: getPersonData
      security:
        - tokenAuth: []
      parameters:
        - name: dni
          in: query
          required: true
          description: |
            DNI/NIF de la persona. Es normalitza ignorant espais, guions i
            punts i passant a majúscules. Si no coincideix amb cap
            `Person.token`, es cerca a `PersonBank.dni` per localitzar el
            pagador, sempre que el seu `Person.token` coincideixi amb el DNI normalitzat.
          schema:
            type: string
          example: "12345678A"
      responses:
        "200":
          description: Dades de contacte de la persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonDataResponse"
              example:
                person:
                  token: "12345678A"
                  name: Anna
                  surname: Garcia
                  is_juridic: false
                phones:
                  - token: "12345678A_CONTACT_1"
                    phone: "600123456"
                    role: MÒBIL
                    is_default: true
                    is_active: true
                emails:
                  - token: "12345678A_CONTACT_1"
                    email: anna.garcia@example.com
                    role: PARTICULAR
                    is_default: true
                    is_active: true
                addresses:
                  - token: "12345678A_ADDRESS_1"
                    address: "C. Major, 123 2-B, Barcelona"
                    street: "C. Major"
                    street_number: "123"
                    postal_code: "08001"
                    city: Barcelona
                    floor: "2"
                    door: B
                    stair: null
                    building: null
                    attention_to: null
                    is_billing: true
                    is_active: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ov/person-invoices/:
    get:
      tags:
        - Factures
      summary: Llistar les factures d'una persona per DNI (titular i pagadora)
      description: |
        Retorna totes les factures en què la persona identificada per
        `dni` ha estat titular o pagadora, de contractes actius i de baixa, i
        també les factures sense contracte (escomeses, reclamacions, etc.).

        S'usen les dades congelades a la mateixa factura
        (`customer_token_final` i `payer_token_final`), no el titular o
        pagador actual del contracte: després d'un canvi de titular, cada persona
        només veu les factures del període en què va estar implicada. Si la
        factura no té pagador, el pagador és el titular. Una factura en
        la qual és titular i pagadora alhora apareix una sola vegada amb
        `is_holder` i `is_payer` a `true`. S'exclouen les prefactures
        (estat token `1`) i les factures amb data d'emissió futura, que no
        es mostren fins aquell dia.

        Les factures s'agrupen per contracte i, dins de cada grup, s'ordenen
        de la més recent a la més antiga. Els grups apareixen per ordre de la
        seva factura més recent. Les factures sense contracte van en un
        grup amb `contract_number`, `contract_status` i `supply_address` a
        `null`. Els contractes sense cap factura en el rang de dates no
        apareixen. La resposta no està paginada.

        A diferència de `GET /ov/invoices/`, `invoice_amount` és el total de
        la factura (`total_final`) i el pendent va a `pending_amount`
        (`left_to_pay`).

        Respon `400` si falta el DNI, si una data no té format
        `YYYY-MM-DD` o si `date_from` és posterior a `date_to`. Un DNI sense
        factures retorna `results` buit. L'endpoint està limitat a 35
        peticions per minut i compte.

        Només el pot cridar el compte de servei de l'OV (usuaris del
        grup `ov`) o un superusuari; qualsevol altre usuari autenticat
        rep `403`.
      operationId: listPersonInvoices
      security:
        - tokenAuth: []
      parameters:
        - name: dni
          in: query
          required: true
          description: |
            DNI/NIF de la persona. Es normalitza ignorant espais, guions i
            punts i passant a majúscules, i es compara amb el titular i el
            pagador desats a la factura.
          schema:
            type: string
          example: "12345678A"
        - name: date_from
          in: query
          required: false
          description: Data de factura (`issue_date`) mínima, inclusiva.
          schema:
            type: string
            format: date
          example: "2026-01-01"
        - name: date_to
          in: query
          required: false
          description: Data de factura (`issue_date`) màxima, inclusiva.
          schema:
            type: string
            format: date
          example: "2026-12-31"
      responses:
        "200":
          description: Factures de la persona agrupades per contracte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonInvoicesResponse"
              example:
                results:
                  - contract_number: CTR-001
                    contract_status:
                      token: "1"
                      name: Alta
                    supply_address: "C. Major, 123, Barcelona"
                    invoices:
                      - invoice_number: F-2026-0002
                        invoice_token: INV-002
                        invoice_date: "2026-02-15"
                        invoice_amount: 45.50
                        pending_amount: 0.0
                        invoice_status: Cobrada
                        status:
                          token: "0"
                          name: Cobrada
                        payment_type: CASH
                        pdf_available: true
                        is_holder: true
                        is_payer: true
                        is_returned: false
                        last_return:
                          date: "2026-03-10"
                          reason:
                            code: AM04
                            name: Fondos insuficientes
                  - contract_number: null
                    contract_status: null
                    supply_address: null
                    invoices:
                      - invoice_number: F-2026-0001
                        invoice_token: INV-001
                        invoice_date: "2026-01-10"
                        invoice_amount: 120.00
                        pending_amount: 120.00
                        invoice_status: Enviada
                        status:
                          token: "3"
                          name: Enviada
                        payment_type: DIRECT_DEBIT
                        pdf_available: true
                        is_holder: true
                        is_payer: true
                        is_returned: false
                        last_return: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: L'usuari autenticat no és el compte de servei de l'OV (grup `ov`) ni superusuari
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ov/person-contracts/:
    get:
      tags:
        - Contracte
      summary: Llistar els contractes actuals i antics d'una persona per DNI
      description: |
        Retorna els contractes en els quals la persona identificada per `dni`:

        - és avui titular del contracte o titular del compte de
          domiciliació, encara que el contracte no tingui factures; o
        - consta com a titular o pagadora en alguna factura del contracte
          (si la factura no té pagador, el pagador és el titular). S'han
          d'excloure les prefactures i les factures amb data d'emissió
          futura.

        Cada contracte apareix una sola vegada. `roles` indica si la persona és o
        ha estat titular (`holder`) i/o pagadora (`payer`) del contracte. Avui és
        pagadora la titular del compte de domiciliació (segons el DNI del
        compte) i, si el contracte no té compte o el compte no té DNI, la
        titular.

        `related_now` és `true` si avui la persona és la titular o la titular
        del compte de domiciliació i el contracte està d'alta; és `false`
        si només està vinculada per factures o si el contracte està de baixa.

        Els contractes vinculats avui apareixen primer i, després, per número
        de contracte. La resposta està paginada.

        Respon `400` si falta el DNI, si `role` o `related_now` no tenen
        un valor admès o si la pàgina no existeix. Un DNI sense contractes
        retorna `results` buit. L'endpoint està limitat a 35 peticions
        per minut i compte.

        Només el pot cridar el compte de servei de l'OV (usuaris del
        grup `ov`) o un superusuari; qualsevol altre usuari autenticat
        rep `403`.
      operationId: listPersonContracts
      security:
        - tokenAuth: []
      parameters:
        - name: dni
          in: query
          required: true
          description: |
            DNI/NIF de la persona. Es normalitza ignorant espais, guions i
            punts i passant a majúscules.
          schema:
            type: string
          example: "12345678A"
        - name: role
          in: query
          required: false
          description: Només els contractes en els quals la persona té aquest paper.
          schema:
            type: string
            enum: [holder, payer]
        - name: related_now
          in: query
          required: false
          description: Filtra per `related_now`.
          schema:
            type: boolean
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/limitParam"
      responses:
        "200":
          description: Llista paginada de contractes de la persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonContractsResponse"
              example:
                count: 2
                page: 1
                limit: 20
                total_pages: 1
                results:
                  - contract_token: CTR-002
                    contract_status:
                      token: "1"
                      name: Alta
                    supply_point: "12345/1"
                    address: "C. Major, 123, Barcelona"
                    roles:
                      - holder
                      - payer
                    related_now: true
                  - contract_token: CTR-001
                    contract_status:
                      token: "-1"
                      name: Baja
                    supply_point: "12345/1"
                    address: "C. Major, 123, Barcelona"
                    roles:
                      - holder
                      - payer
                    related_now: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: L'usuari autenticat no és el compte de servei de l'OV (grup `ov`) ni superusuari
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ov/invoices/:
    get:
      tags:
        - Factures
      summary: Llistar factures del contracte
      description: |
        Retorna totes les factures del contracte excepte les prefactures
        (factures amb estat token `1`) i les que tenen data d'emissió
        posterior a avui.

        L'import retornat a `invoice_amount` correspon al pendent de pagament (`left_to_pay`).

        `is_returned` i `last_return` indiquen si el banc ha retornat el rebut
        domiciliat de la factura. No existeix un estat de factura «retornada»:
        després de la devolució, la factura queda `Confirmada` o `Vençuda` (vegeu
        `InvoiceIsReturned`).

        `404` si el `contract_token` no correspon a cap contracte.
      operationId: listInvoices
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
      responses:
        "200":
          description: Llista de factures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceSummary"
              example:
                - contract_number: CTR-001
                  invoice_number: F-2026-0001
                  invoice_token: INV-001
                  invoice_date: "2026-01-15"
                  invoice_amount: 45.50
                  invoice_status: Vencida
                  status:
                    token: "-1"
                    name: Vencida
                  payment_type: DIRECT_DEBIT
                  pdf_available: true
                  is_returned: true
                  last_return:
                    date: "2026-02-10"
                    reason:
                      code: AM04
                      name: Fondos insuficientes
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/invoices/download/:
    post:
      tags:
        - Factures
      summary: Baixada en lot de factures (ZIP)
      description: |
        Baixa en un únic ZIP els PDF de les factures indicades. El
        `contract_token` va a la query i la llista de tokens de factura al cos
        JSON (`invoice_tokens`).

        Reutilitza el PDF emmagatzemat i finalitzat a `invoice_file` quan està
        disponible. Si no existeix o no es pot recuperar, genera el PDF amb
        el mateix servei que `GET /ov/invoice-pdf/`
        (`generate_report_invoice_pdf`) i `save_pdf=False`. La generació
        de reserva manté els bytes del PDF sense registrar un nou document
        des d'aquesta baixada en lot.

        Seguretat IDOR: totes les factures sol·licitades han de pertànyer al
        contracte indicat i ser definitives (`type_final`), el mateix filtre
        que la baixada individual; qualsevol factura desconeguda o d'un altre
        contracte respon `400` amb el detall per token (missatge genèric,
        no revela si la factura existeix en un altre contracte).

        Cada PDF es nomena `factura_<serie_final>.pdf` (o
        `factura_<invoice_token>.pdf` si no té número), amb les barres del
        número substituïdes per `-` perquè les entrades del ZIP no creïn
        subcarpetes; la resposta és un fitxer adjunt `facturas.zip`.
      operationId: downloadInvoicesZip
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchInvoiceDownloadRequest"
            example:
              invoice_tokens:
                - "INV-001"
                - "INV-002"
      responses:
        "200":
          description: ZIP amb un PDF per factura sol·licitada
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: |
            Falta `contract_token`, el cos no és vàlid, la llista està
            buida o alguna factura no pertany al contracte.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationErrors"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                missingContractToken:
                  summary: Falta contract_token a la query
                  value:
                    error: Contract token is required
                emptyList:
                  summary: Llista buida
                  value:
                    invoice_tokens:
                      - Esta lista no puede estar vacía.
                unknownTokens:
                  summary: Factura aliena al contracte o desconeguda
                  value:
                    invoice_tokens:
                      - "Invoice not found for this contract: FAKE-TOKEN"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: Error en generar algun dels PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: "Failed to retrieve invoice PDF: ..."

  /ov/invoice/:
    get:
      tags:
        - Factures
      summary: Detall d'una factura
      description: |
        Retorna el detall d'una factura concreta del contracte.
      operationId: getInvoice
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
        - $ref: "#/components/parameters/invoiceToken"
      responses:
        "200":
          description: Detall de la factura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceSummary"
              example:
                contract_number: CTR-001
                invoice_number: F-2026-0001
                invoice_token: INV-001
                invoice_date: "2026-01-15"
                invoice_amount: 45.50
                invoice_status: Enviada
                status:
                  token: "3"
                  name: Enviada
                payment_type: DIRECT_DEBIT
                pdf_available: true
                is_returned: false
                last_return: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ov/invoice/{token}/detail/:
    get:
      tags:
        - Factures
      summary: Detall complet d'una factura
      description: |
        Retorna el detall ampliat d'una factura identificada pel seu token, ampliant
        el llistat bàsic (`/ov/invoices/`) amb el període de facturació, la referència
        de l'habitatge, l'adreça tributària, les tarifes aplicades amb la seva normativa
        i el desglossament fiscal del rebut.

        Només retorna factures definitives (tipus `invoice_type_invoice_token`); les
        proformes, prefactures i pressupostos s'exclouen, igual que a `/ov/invoice-pdf/`.

        L'adreça tributària (`tax_address`) és condicional:

        - Si la factura **no** està domiciliada (el tipus de pagament no és `DIRECT_DEBIT`),
          el camp `tax_address` **no apareix** a la resposta.
        - Si està domiciliada i el pagador és el propi titular del contracte
          (`payer_token_final` coincideix amb `customer_token_final`), el camp apareix
          amb `is_anonymized: false` i l'adreça completa.
        - Si està domiciliada però el pagador és un tercer, el camp apareix amb
          `is_anonymized: true`, s'omet `address` i només s'exposen `postal_code`,
          `city`, `province` i `country`.
      operationId: getInvoiceDetailByToken
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/invoiceTokenPath"
      responses:
        "200":
          description: Detall complet de la factura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceFullDetail"
              example:
                contract_number: CTR-001
                invoice_token: INV-001
                invoice_number: F-2026-0001
                invoice_date: "2026-03-05"
                invoice_status: Enviada
                status:
                  token: "3"
                  name: Enviada
                due_date: "2026-03-25"
                invoice_amount: 45.50
                total_amount: 48.19
                subtotal_amount: 45.50
                payment_method: Domiciliació Bancària - SEPA
                payment_type: DIRECT_DEBIT
                pdf_available: true
                is_returned: false
                last_return: null
                billing_period:
                  year: 2026
                  month: 3
                  days: 31
                dwelling_code: VIV-000123
                tax_address:
                  is_anonymized: false
                  address: "C/ Barcelona, 31"
                  postal_code: "08110"
                  city: Barcelona
                  province: Barcelona
                  country: España
                direct_debit_account:
                  iban: "ES912100********00051332"
                  nombre: Maria Garcia
                  dni: "***4567**"
                tariffs:
                  - name: Subministrament d'aigua
                    description: Canalización y consumo de agua
                    units: 14
                    unit_price: 2.20
                    tax_percent: 10
                    total: 30.80
                    normativa:
                      reference: "BOE-A-2020-12345"
                      name: Tarifa del ciclo integral del agua
                fiscal_breakdown:
                  - organization: Empresa gestora
                    amount: 14.50
                  - organization: Ayuntamiento
                    amount: 8.00
                  - organization: EDAR
                    amount: 3.10
                  - organization: Consorcio
                    amount: 4.20
                  - organization: Agencia del agua
                    amount: 9.85
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Factura no trobada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Invoice not found

  /ov/invoice/paid/:
    post:
      tags:
        - Factures
      summary: Marcar factura com a pagada
      description: |
        Marca com a pagats tots els pagaments pendents d'una factura després d'un cobrament
        per TPV en línia. Només s'aplica a factures de tipus factura (no pressupostos).

        Els pagaments s'actualitzen amb tipus de pagament `TPV_ONLINE` i data de pagament actual.
        També s'accepten factures domiciliades amb rebuts pendents o retornats.

        Si algun rebut no cobrat està en una remesa pendent d'enviar, respon
        `409` (`reason: pending_remittance`) i no canvia res: el cobrarà el banc.
        Si la factura ja estava pagada respon `200` igualment, amb
        `already_paid: true`.
      operationId: markInvoicePaid
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoicePaidRequest"
            example:
              contract_token: CTR-001
              invoice_token: INV-001
      responses:
        "200":
          description: Factura marcada com a pagada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePaidResponse"
              example:
                success: true
                message: Invoice marked as paid successfully
                invoice_token: INV-001
                new_status: Pagada
                already_paid: false
        "400":
          description: Dades invàlides o factura no trobada
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationErrors"
                  - $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Algun rebut no cobrat està en una remesa pendent d'enviar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingRemittanceConflict"
              example:
                error: Invoice has a receipt in a pending remittance and will be collected by direct debit.
                reason: pending_remittance

  /ov/invoice/quick-pay/:
    post:
      tags:
        - Factures
      summary: Resoldre factura per al pagament ràpid
      description: |
        Resol una factura a partir de les tres dades que l'abonat té
        impreses al paper: número de contracte (`Contract.token`), número de
        factura (`Invoice.serie_final`) i import total exacte (`Invoice.total_final`).

        És una consulta de **només lectura**: no crea ni modifica pagaments. El frontal
        de l'OV ha de cobrar amb el seu propi TPV i, a continuació, confirmar el cobrament
        amb `POST /ov/invoice/paid/` fent servir els tokens retornats.

        Si qualsevol de les tres dades no coincideix, o el document no és una
        factura definitiva, la resposta és sempre el mateix `404` per no revelar
        coincidències parcials. Si les tres coincideixen però la factura no és
        pagable (estat de pagament, anul·lació, abonament, prefactura, impagat
        irrecuperable o import pendent zero), es retorna `409` amb l'estat
        actual. També es retorna `409` si falta la configuració
        `invoice_status_paid_token` o no existeix cap `Payment` per confirmar
        el cobrament mitjançant `POST /ov/invoice/paid/`, i si algun rebut no cobrat
        és en una remesa pendent d'enviar (`reason: pending_remittance`).
      operationId: quickPayInvoice
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickPayRequest"
            example:
              contract_number: "3451189"
              invoice_number: FC/202609/000001
              amount: 101.73
      responses:
        "200":
          description: Factura resolta i pagable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickPayResponse"
              example:
                contract_token: "3451189"
                invoice_token: INV-001
                invoice_number: FC/202609/000001
                issue_date: "2026-09-01"
                due_date: "2026-09-30"
                invoice_amount: 101.73
                left_to_pay: 101.73
                status:
                  token: "2"
                  name: Confirmada
                payable: true
        "400":
          description: Dades invàlides (camps obligatoris, import amb més de dos decimals o negatiu)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No existeix cap factura definitiva que coincideixi amb les tres dades.
            El missatge és idèntic per a qualsevol discrepància.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Invoice not found
        "409":
          description: La factura existeix però no és pagable en el seu estat actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickPayNotPayableResponse"
              examples:
                notPayable:
                  summary: Factura no pagable
                  value:
                    error: Invoice is not payable
                    status:
                      token: "0"
                      name: Pagada
                    left_to_pay: 101.73
                pendingRemittance:
                  summary: Rebut en una remesa pendent d'enviar
                  value:
                    error: Invoice has a receipt in a pending remittance and will be collected by direct debit.
                    reason: pending_remittance
                    status:
                      token: "3"
                      name: Enviada
                    left_to_pay: 101.73
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ov/invoice/return-request/:
    post:
      tags:
        - Factures
      summary: Sol·licitar la devolució d'una factura
      description: |
        Obre una incidència automàtica perquè atenció al client faci
        seguiment d'una devolució sol·licitada per l'abonat.

        **No canvia l'estat de la factura, el seu `left_to_pay` ni cap pagament.**
        La factura només torna a confirmada/vençuda dies després, quan el
        banc processa el fitxer de devolucions (flux extern a aquest endpoint).

        Només s'accepta una factura definitiva, del contracte indicat i amb
        estat pagat. El token d'estat pagat és la font de veritat; no es
        comprova `left_to_pay`, perquè el flux de pagaments actualitza l'estat
        sense tornar a sincronitzar aquest camp i pot quedar obsolet (o `NULL`) en
        factures realment pagades. La mateixa resposta `404` cobreix factura
        inexistent, prefactura i contracte erroni, per no revelar
        coincidències parcials. Si ja existeix una sol·licitud oberta per a la
        factura, o un pagament ja està retornat pel banc, es retorna `409`.
      operationId: requestInvoiceReturn
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnRequest"
            example:
              invoice_token: INV-001
              contract_token: "3451189"
              reason: Domiciliación devuelta por el banco
      responses:
        "201":
          description: Incidència de devolució creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnRequestResponse"
              example:
                incident_token: "20261023001"
                invoice_token: INV-001
                contract_token: "3451189"
                status:
                  token: "1"
                  name: Oberta
                type:
                  token: reclamacio
                  name: Reclamació
                created_at: "2026-10-23T09:30:00Z"
        "400":
          description: Camps obligatoris absents o invàlids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No existeix cap factura definitiva que coincideixi amb el token de
            factura i el de contracte, o la configuració d'estats no està
            disponible. El missatge és idèntic per a qualsevol discrepància.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Invoice not found
        "409":
          description: |
            La factura existeix però no es pot sol·licitar la devolució: no està
            pagada, ja l'ha retornat el banc o ja té una sol·licitud oberta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnRequestConflictResponse"
              examples:
                notPaid:
                  value:
                    error: Invoice is not paid
                    status:
                      token: "2"
                      name: Confirmada
                alreadyReturned:
                  value:
                    error: Invoice already returned
                    status:
                      token: "2"
                      name: Confirmada
                duplicate:
                  value:
                    error: Return request already exists
                    incident_token: "20261023001"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: No s'ha pogut crear la incidència (diccionaris d'incidències no configurats)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Return request could not be created

  /ov/payment-receipt/:
    get:
      tags:
        - Factures
      summary: Obtenir justificant de pagament (base64)
      description: |
        Retorna el justificant de pagament en PDF d'un pagament fet **en efectiu
        (`CASH`) o amb targeta al TPV físic (`CARD`)**. Els pagaments en línia
        (`TPV_ONLINE`) no se serveixen perquè l'OV emet el seu propi justificant, i
        els pagaments per domiciliació SEPA o transferència no tenen justificant.

        Només s'accepten pagaments cobrats (estat pagat) associats a una factura
        definitiva (`type_final`). El pagament ha de pertànyer al contracte indicat i
        el DNI ha de coincidir amb el pagador, el client, el titular del contracte
        o el titular del compte de domiciliació. Qualsevol discrepància
        retorna el mateix `404` per no revelar quins pagaments existeixen.

        El PDF es genera en memòria: no es desa cap document ni es modifica
        el pagament. El PDF es retorna codificat en base64 dins de
        `pdf_base64`, no com a baixada binària.

        L'idioma del justificant es tria amb `lang` (preferent) o amb la
        capçalera `Accept-Language`; si no s'indica cap, s'utilitza el català.
        Només afecta aquest endpoint de l'OV: la resta de consumidors del mateix
        servei (administració/ERP) continuen generant el PDF en català.
      operationId: getPaymentReceipt
      security:
        - tokenAuth: []
      parameters:
        - in: query
          name: contract_token
          required: true
          description: Token del contracte (`Contract.token`) al qual pertany el pagament
          schema:
            type: string
          example: "RECEIPT-CONTRACT-1"
        - in: query
          name: payment_token
          required: true
          description: Token del pagament (`Payment.token`)
          schema:
            type: string
          example: PAY-CASH-1
        - in: query
          name: dni
          required: true
          description: |
            DNI/NIF del pagador, client, titular del contracte o titular del
            compte de domiciliació. Es normalitza com a `/ov/person-data/`
            (ignora espais, guions i punts; no distingeix majúscules).
          schema:
            type: string
          example: 12345678A
        - in: query
          name: lang
          required: false
          description: |
            Idioma del justificant. Té prioritat sobre `Accept-Language`.
            Admet `ca`, `es`, `gl` i `en` (també amb regió o en majúscules,
            p. ex. `ES`, `es-ES`, `es_ES`). Un valor no suportat s'ignora i
            s'utilitza `Accept-Language` o, altrament, el català.
          schema:
            type: string
            enum: [ca, es, gl, en]
            default: ca
          example: es
      responses:
        "200":
          description: Justificant de pagament en PDF codificat en base64
          headers:
            Cache-Control:
              description: Sempre `no-store` (document sensible)
              schema:
                type: string
            Content-Language:
              description: Idioma efectiu del PDF (`ca`, `es`, `gl` o `en`)
              schema:
                type: string
              example: es
          content:
            application/json:
              schema:
                type: object
                required: [pdf_base64]
                properties:
                  pdf_base64:
                    type: string
                    format: byte
                    description: |
                      Contingut del PDF codificat en base64 (estàndard, sense
                      prefix `data:` ni salts de línia).
              example:
                pdf_base64: JVBERi0xLjQK...
        "400":
          description: Falten el token de contracte, el token de pagament o el DNI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: DNI is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No existeix cap pagament vàlid que coincideixi amb el contracte, el pagament i el
            DNI, o el pagament no és d'efectiu/TPV físic, no està cobrat, no
            té factura definitiva o no es pot generar el justificant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Payment receipt not found
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: Error en generar el PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: PDF generation failed

  /ov/unpayed-invoices/:
    get:
      tags:
        - Factures
      summary: Llistar factures impagades
      description: |
        Retorna les factures del contracte filtrades per un o més estats de factura.

        Aplica els mateixos filtres base que `/ov/invoices/`: mai retorna
        prefactures (estat amb token `1`), encara que el token `1` s'inclogui a
        `statuses` (en aquest cas la llista pot quedar buida). Sobre aquesta base,
        `statuses` afegeix el filtre d'estats impagats.

        Per compatibilitat, `statuses` continua acceptant tokens d'`InvoiceStatus`
        separats per comes i conserva la prioritat quan s'envia. Com a alternativa,
        `unpaid=true` activa el mode automatitzat, que resol des de `ConfigProject`
        els estats confirmats, enviats, vençuts, de morositat/impagament i de compromís,
        excloent-ne els estats terminals i les prefactures.

        Tokens d'estat habituals (poden variar segons la configuració del desplegament):
        - `0`: Pagada
        - `2`: Confirmada
        - `3`: Enviada
        - `-1`: Vençuda
        - `-3`: Morositat
        - `4`: En compromís

        Paràmetre opcional `exc_payment_type_token`: exclou factures el tipus de pagament final
        de les quals coincideixi amb algun dels tokens indicats (separats per comes).
      operationId: listUnpaidInvoices
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
        - name: statuses
          in: query
          required: false
          description: Tokens d'estat de factura (`InvoiceStatus.token`), separats per comes
          schema:
            type: string
          example: "-3,2"
        - name: unpaid
          in: query
          required: false
          description: |
            Si val `true` i no es proporciona `statuses`, activa la selecció
            automàtica d'estats impagats configurats. Si es proporciona
            `statuses`, aquest filtre explícit conserva la prioritat.
          schema:
            type: boolean
            default: false
        - name: exc_payment_type_token
          in: query
          required: false
          description: Tokens de tipus de pagament a excloure (`PaymentType.token`), separats per comes
          schema:
            type: string
          example: DOM
      responses:
        "200":
          description: Llista de factures filtrades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/billed-consumptions/:
    get:
      tags:
        - Consums
      summary: Consums facturats
      description: |
        Retorna l'historial de consums facturats del contracte, agrupats per data d'emissió
        de cada factura.
      operationId: listBilledConsumptions
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
      responses:
        "200":
          description: Llista de consums facturats per factura
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BilledConsumption"
              example:
                - timestamp: "2026-01-15"
                  consumptions:
                    - meter: MTR-001
                      reading: 1250.5
                      consumption: 12.0
                      origin: ""
                      contract_number: CTR-001
                      is_estimated: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ov/consumptions/:
    get:
      tags:
        - Consums
      summary: Historial de consums del contracte
      description: |
        Retorna l'historial de consums del contracte en nomenclatura HF
        (p. ex. `2025-3T`), una fila per període amb la lectura actual, la
        lectura anterior, el consum, la data de lectura i l'indicador de
        lectura estimada.

        A diferència de `/ov/billed-consumptions/`, que agrupa per la data
        d'emissió de la factura, la lectura anterior es resol al backend
        (cadena `Reading.previous_reading`), insensible a lectures estimades i
        canvis de comptador que trencarien l'ordre de la sèrie al BFF.

        **Abast per contracte (protecció de dades):** només s'inclouen
        lectures del propi contracte (`Reading.contract`) facturades en una
        factura del mateix contracte i, si el contracte té data d'alta o de
        baixa, amb `reading_date` dins d'aquest període. Mai es retornen
        lectures de contractes anteriors o posteriors del mateix punt de
        subministrament o comptador; un contracte sense lectures pròpies facturades
        retorna una llista buida. Les lectures d'un comptador substituït
        durant el contracte sí que s'inclouen.

        Paginació de servidor: `count` és el total de files que compleixen els
        filtres i `next`/`previous` són les URL de les pàgines contigües
        (`null` als extrems). `date_from` i `date_to` filtren per la data
        de lectura (`reading_date`, tots dos inclosos); si `date_from` és
        posterior a `date_to` respon `400`. Un `contract_token` desconegut
        respon `404`.

        Només es retornen els consums ja facturats: les lectures que no estan
        vinculades a cap factura s'exclouen de l'historial.

        **Filtre per persona (`dni`, opcional):** amb `dni`, només s'inclouen
        les lectures facturades en factures del contracte on aquella persona
        és titular o pagadora, amb el mateix criteri que `/ov/person-invoices/`
        (titular i pagador desats a la factura, sense prefactures ni factures
        amb data futura). Així una persona que ha deixat de ser titular o
        pagadora continua veient els seus consums, però no els d'altres
        persones. Un DNI sense factures al contracte retorna una llista buida.
        Sense `dni`, o buit, el comportament no canvia.
      operationId: listConsumptionHistory
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
        - $ref: "#/components/parameters/consumptionDni"
        - $ref: "#/components/parameters/dateFrom"
        - $ref: "#/components/parameters/dateTo"
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Pàgina de l'historial de consums
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumptionHistoryResponse"
              example:
                count: 100
                next: http://localhost:8000/ov/consumptions/?contract_token=CTR-001&page=2
                previous: null
                results:
                  - id: 42
                    period: "2025-3T"
                    reading: 1250.5
                    previous_reading: 1238.5
                    consumption: 12.0
                    reading_date: "2025-09-15"
                    is_estimated: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/consumption/{id}/download/:
    get:
      tags:
        - Consums
      summary: Baixar consum individual
      description: |
        Retorna el fitxer d'un únic consum de l'historial. L'`id` és el
        `Reading.id` exposat per `GET /ov/consumptions/` i `contract_token` el
        token del contracte al qual pertany la lectura.

        El format es tria amb `?format=` (`pdf` per defecte o `csv`).
        Respon `404` si el contracte no existeix o si la lectura no existeix, no
        pertany al contracte (encara que sigui del mateix comptador o punt de
        subministrament), és fora del seu període d'alta/baixa o no està
        facturada en una factura del contracte.

        Amb `dni`, també respon `404` si la lectura no està facturada en una
        factura del contracte on aquella persona és titular o pagadora
        (mateix criteri que `GET /ov/consumptions/`).
      operationId: downloadConsumption
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/consumptionIdPath"
        - $ref: "#/components/parameters/contractToken"
        - $ref: "#/components/parameters/consumptionDni"
        - $ref: "#/components/parameters/downloadFormat"
      responses:
        "200":
          description: Fitxer del consum
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/consumptions/download/:
    post:
      tags:
        - Consums
      summary: Baixar historial de consums (selecció o tots els filtrats)
      description: |
        Genera el fitxer de l'historial de consums. Si es passen `reading_ids`,
        es baixen únicament aquestes lectures (files marcades manualment). Si
        no, s'apliquen `date_from`/`date_to` i es retorna el conjunt complet
        filtrat, sense límit de pàgina, pensat per a «Seleccionar tot».

        Només s'inclouen els consums ja facturats del propi contracte, amb
        el mateix abast que `GET /ov/consumptions/` (mai lectures d'altres
        contractes del mateix punt de subministrament o comptador). Els `reading_ids`
        del contracte no facturats s'ometen del fitxer sense retornar error;
        un `reading_id` d'un altre contracte o fora del període del contracte
        respon `400` com a desconegut. Amb `dni` al cos, només s'inclouen
        les lectures facturades a aquella persona (mateix criteri que
        `GET /ov/consumptions/`); les altres lectures del contracte s'ometen
        sense error, com les no facturades.

        El format es tria amb `format` al cos (`pdf` per defecte,
        `csv` o `zip`). Respon `404` si el contracte no existeix i `400` amb
        errors de validació per camp si `date_from` és posterior a
        `date_to`, hi ha un `reading_id` desconegut o el cos és invàlid.
      operationId: downloadConsumptions
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumptionDownloadRequest"
            example:
              contract_token: CTR-001
              reading_ids: [42, 43, 44]
              date_from: "2025-01-01"
              date_to: "2025-12-31"
              format: pdf
      responses:
        "200":
          description: Fitxer amb l'historial sol·licitat
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ValidationErrors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/billing-periods/:
    get:
      tags:
        - Dades de facturació
      summary: Períodes de facturació disponibles del contracte
      description: |
        Retorna els períodes de facturació disponibles per al contracte.
        Els cicles de facturació (trimestral, bimestral, etc.) els defineix el
        facturador (`Biller`: `period_type` + `initial_month`) de la ruta del
        contracte i varien segons el contracte, per la qual cosa el frontal no pot
        fixar-los al codi. Retorna el cicle en curs (`is_current: true`, primer)
        i el següent, calculats amb la data actual, perquè el selector de
        «Primera domiciliació» del formulari de mitjà de pagament s'ompli
        dinàmicament. Si la ruta no té facturador s'apliquen els valors
        per defecte del model (trimestral des de gener).
      operationId: listBillingPeriods
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
      responses:
        "200":
          description: Períodes de facturació disponibles del contracte
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillingPeriodItem"
              example:
                - year: 2026
                  period_code: "4T"
                  months_label: "octubre-diciembre"
                  month_from: 10
                  year_from: 2026
                  month_to: 12
                  year_to: 2026
                  is_current: true
                - year: 2027
                  period_code: "1T"
                  months_label: "enero-marzo"
                  month_from: 1
                  year_from: 2027
                  month_to: 3
                  year_to: 2027
                  is_current: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/invoice-pdf/:
    get:
      tags:
        - Factures
      summary: Obtenir PDF de factura
      description: |
        Retorna en format Base64 el PDF emmagatzemat i finalitzat d'una
        factura quan està disponible. Si no existeix o no es pot recuperar,
        genera un PDF nou com a fallback.

        La factura s'identifica per `invoice_token` (camp `Invoice.token`) o, altrament,
        per `serie_final` si no es troba pel token. Només es consideren factures de tipus factura
        (segons la configuració `invoice_type_invoice_token` del projecte).
      operationId: getInvoicePdf
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
        - $ref: "#/components/parameters/invoiceToken"
      responses:
        "200":
          description: PDF de la factura codificat en Base64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePdfResponse"
              example:
                pdf: JVBERi0xLjQKJeLjz9MK...
                filename: invoice_F-2026-0001_42.pdf
                document_name: F-2026-0001.pdf
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /ov/create-reading/:
    post:
      tags:
        - Lectures
      summary: Registrar lectura de comptador
      description: |
        Crea una nova lectura de comptador associada al contracte.

        El comptador (`meter`) ha de coincidir amb el comptador del punt de subministrament
        per defecte del contracte (`supply_point_default`).

        La lectura es crea amb origen `OV`. Si la data no és dins del període de facturació
        permès, la lectura es marca com a lectura de control (`is_control=true`).
      operationId: createReading
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReadingRequest"
            example:
              reading_at: "2026-01-15"
              contract: CTR-001
              meter: MTR-001
              reading: 1250.5
      responses:
        "201":
          description: Lectura creada correctament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReadingResponse"
              example:
                success: true
                message: Reading created successfully
                reading_token: OV-123
                reading_value: "1250.5"
                reading_date: "2026-01-15"
                contract_token: CTR-001
                meter_token: MTR-001
                supply_point_token: SP-001
        "400":
          description: Dades invàlides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ov/contracts/:
    get:
      tags:
        - Contracte
      summary: Llistar contractes per DNI
      description: |
        Retorna els contractes en què el DNI indicat actua com a titular del contracte
        (`holder.token`) o com a titular del compte de domiciliació
        (`payment.IBAN.person.token` / `payment.IBAN.dni`).

        El DNI és obligatori i es compara després de normalitzar-lo (sense espais i en majúscules).
        Si el DNI coincideix en tots dos rols, el contracte apareix una sola vegada.

        `allowed_actions` es calcula per contracte segons el seu estat i el seu tipus de pagament,
        per la qual cosa el seu contingut pot variar entre elements d'una mateixa resposta.

        `is_account_holder` indica si el `dni` rebut coincideix amb el titular del
        compte de domiciliació; com que en aquest endpoint el `dni` és obligatori, la
        clau sempre hi és present.
      operationId: listContractsByDni
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/dni"
        - $ref: "#/components/parameters/contractStatus"
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/limitParam"
      responses:
        "200":
          description: Llista paginada de contractes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractListResponse"
              example:
                count: 2
                page: 1
                limit: 20
                total_pages: 1
                results:
                  - token: CTR-001
                    status_token: "1"
                    status_name: Alta
                    payment_type: DOM
                    contract_holder:
                      dni: "12345678A"
                      nombre: Anna Garcia
                    direct_debit_holder:
                      dni: "12345678A"
                      nombre: Anna Garcia
                      iban: "ES912345********45678901"
                    allowed_actions:
                      - consultar_datos_facturacion
                      - actualizar_iban
                      - registrar_lectura
                    is_account_holder: true
                  - token: CTR-002
                    status_token: "-1"
                    status_name: Baixa
                    payment_type: DOM
                    contract_holder:
                      dni: "12345678A"
                      nombre: Anna Garcia
                    direct_debit_holder: null
                    allowed_actions:
                      - consultar_datos_facturacion
                    is_account_holder: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ov/properties/:
    get:
      tags:
        - Contracte
      summary: Autocompletat de propietats per adreça
      description: |
        Retorna les propietats actives l'adreça, el nom o la referència
        cadastral de les quals coincideix amb `search`, perquè l'abonat pugui iniciar
        tràmits sobre una propietat existent des de l'Oficina Virtual. No
        permet crear ni modificar propietats.

        `search` és obligatori i ha de tenir almenys 3 caràcters (si no,
        `400`). La puntuació (espais, `,`, `.`, `;`, `/`) es tracta com a
        separador: cada terme ha de coincidir amb algun camp (nom de
        carrer, número, ciutat, codi postal, nom o referència cadastral)
        i tots els termes es combinen amb AND. Així `CR.` troba les
        propietats del tipus de carrer `CR` i `CR. Major 33` exigeix que es
        compleixin tots els termes. Un `search` compost només per
        puntuació retorna `400` (`Search must contain at least one valid
        term`). Els resultats es retornen paginats i `address` ja arriba
        formatada (`carrer, número, codi postal ciutat`).
      operationId: listProperties
      security:
        - tokenAuth: []
      parameters:
        - name: search
          in: query
          required: true
          description: Text a cercar (mínim 3 caràcters)
          schema:
            type: string
            minLength: 3
          example: Major
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/limitParam"
      responses:
        "200":
          description: Propietats coincidents, paginades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyListResponse"
              example:
                count: 1
                page: 1
                limit: 20
                total_pages: 1
                results:
                  - token: PR-001
                    address: C/ Major, 123, 08001 Barcelona
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ov/addresses/:
    get:
      tags:
        - Contracte
      summary: Autocompletat d'adreces de punts de subministrament
      description: |
        Retorna les adreces dels punts de subministrament que coincideixen amb
        `search`, amb el detall de l'habitatge o local (escala, pis i
        porta) que l'adreça de la finca de `/ov/properties/` no inclou.
        Només per a usuaris del grup `ov` (i superusuaris); un altre usuari
        autenticat rep `403`.

        Mateixes regles de cerca que `/ov/properties/`: `search` és
        obligatori i ha de tenir almenys 3 caràcters (si no, `400`). La
        puntuació (espais, `,`, `.`, `;`, `/`) es tracta com a separador i
        cada terme ha de coincidir amb algun camp (nom o tipus de carrer,
        número, sufix del número, ciutat, codi postal, escala, pis o
        porta); tots els termes es combinen amb AND. Només es cerca en allò
        que es mostra de l'adreça (`city_name` només compta si no hi ha
        municipi i el número d'un `S/N` no es cerca), així cada adreça
        coincideix sencera amb tots els seus punts. No distingeix
        accents (`Plaça` i `placa` donen el mateix). El número admet el sufix
        enganxat o amb guionet (`21A`, `21-A`). Així `Major 21 2n` afina fins a
        l'habitatge. Un `search` compost només per puntuació retorna `400`.

        No es filtra per l'estat del punt de subministrament: també apareixen
        les adreces de punts donats de baixa, per poder cercar-les i
        tornar-los a donar d'alta. Cada adreça apareix una sola vegada encara que
        la tinguin diversos punts (al mateix registre d'adreça o en
        registres diferents que es mostren igual: sense tipus de número, `N`
        i `S` són equivalents); els seus tokens (i el de la
        finca de cadascun) es retornen a `supply_points`. Ordre: carrer,
        número, sufix, escala, pis i porta.
      operationId: listSupplyPointAddresses
      security:
        - tokenAuth: []
      parameters:
        - name: search
          in: query
          required: true
          description: Text a cercar (mínim 3 caràcters)
          schema:
            type: string
            minLength: 3
          example: Major 21 2n
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/limitParam"
      responses:
        "200":
          description: Adreces coincidents, paginades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyPointAddressListResponse"
              example:
                count: 1
                page: 1
                limit: 20
                total_pages: 1
                results:
                  - address: C. Major, 21 Esc. A 2n-1a, Barcelona
                    street_type: C
                    street_name: Major
                    street_number: 21
                    street_number_suffix: null
                    stair: A
                    building: null
                    floor: 2n
                    door: 1a
                    address_extra: null
                    postal_code: "08001"
                    city: Barcelona
                    supply_points:
                      - token: SP-001
                        property_token: PR-001
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: L'usuari autenticat no pertany al grup `ov`

  /ov/contract/{token}/:
    get:
      tags:
        - Contracte
      summary: Detall del contracte per token
      description: |
        Retorna les dades del contracte identificat pel `token` inclòs a la
        pròpia ruta. Equivalent a `/ov/contract-detail/`, que rep
        l'identificador com a paràmetre de consulta `contract_token` (aquest admet
        tokens amb barra, que no caben en un paràmetre de ruta `<str:token>`).

        Expandeix les estructures de `/ov/contract-detail/` i `/ov/billing-data/`
        afegint-hi les dades del compte de domiciliació: el DNI del seu titular,
        l'adreça postal del titular i l'indicador `is_account_holder`.

        `is_account_holder` només s'avalua si s'envia el paràmetre opcional
        `dni`: coincideix amb `true` quan aquest `dni` (normalitzat) correspon al
        titular del compte de domiciliació. Si `dni` no s'envia, la clau
        `is_account_holder` **no apareix** a la resposta.

        `is_holder` i `is_payer` segueixen la mateixa regla: només s'avaluen si
        s'envia `dni` i s'ometen de la resposta si no s'envia. `is_holder`
        indica si el `dni` correspon al titular del contracte i `is_payer` si
        correspon al titular del compte de domiciliació (mateixa comprovació
        que `is_account_holder`).

        Excepció a la nota general sobre IBAN: en aquest endpoint el camp `iban`
        es retorna sense emmascarar només si s'envia `dni` i aquest coincideix amb el
        titular del compte; en qualsevol altre cas apareix emmascarat
        (8 primers caràcters + asteriscs + 8 darrers).
      operationId: getContractDetailByToken
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractTokenPath"
        - $ref: "#/components/parameters/dniOptional"
      responses:
        "200":
          description: Dades del contracte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractFullDetail"
              example:
                token: CTR-001
                status_token: "1"
                status_name: Activo
                holder_token: "12345678A"
                payment_type: DOM
                use_type: Doméstico
                last_invoice_date: "2026-01-15T10:30:00Z"
                supply_point_address: "C/ Barcelona, 31, 08000 Barcelona"
                meter_serial_number: MTR-001
                meter_caliber: "15"
                smart_metering: "false"
                registration_date: "15/03/2020"
                termination_date: null
                nif: "12345678A"
                tenant_name: Anna Garcia
                holder_name: Anna Garcia
                city: Barcelona
                postal_code: "08110"
                paper_invoice: "false"
                email: anna.garcia@example.com
                invoice_language: es
                phone1: "600000000"
                phone2: "600000001"
                account_holder_dni: "12345678A"
                is_account_holder: true
                is_holder: true
                is_payer: true
                holder_address: "C/ de Mallorca, 45, 2-1, 08013 Barcelona"
                iban: "ES12345678901234567890"
                status:
                  token: "1"
                  name: Activo
                has_sepa_document: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/contract/by-nic/{nic}/:
    get:
      tags:
        - Contracte
      summary: Cerca de contracte per NIC
      description: |
        Retorna el contracte associat a un NIC. Existeix per als fluxos d'accés
        directe on el frontal encara no disposa de `contract_token` i només
        coneix el NIC del client.

        El NIC és un codi de 12 xifres sense separadors (p. ex.
        `123456000001`): la referència del mandat SEPA de la forma de pagament
        del contracte (`GeneralPayment.mandate_id`). El format es valida amb
        l'expressió regular `^\d{12}$` **abans** de consultar la base de dades;
        el format antic amb «/» ja no s'accepta i respon `400`.

        Resolució del contracte: es cerquen els contractes amb el NIC com a
        referència de mandat vigent i els que l'havien tingut segons l'historial
        de mandats de la forma de pagament
        (`GeneralPaymentMandateLog.previous_mandate_id`), de manera que el NIC
        original continua trobant el contracte després d'un canvi de
        domiciliació. D'entre aquests es retorna primer el d'alta
        (`contract_active_token`), després el del mandat vigent i, per acabar,
        el més recent (`created_at` descendent).

        La càrrega útil del `200` és idèntica a la de `/ov/contract/{token}/` més la
        clau explícita `contract_token` (amb el mateix valor que `token`), que
        el frontal reutilitza a `?contract_token=` de la resta d'endpoints.
        Igual que a `/ov/contract/{token}/`, el paràmetre opcional `dni`
        desemmascara l'IBAN quan coincideix amb el titular del compte de
        domiciliació i exposa `is_account_holder`, `is_holder` i `is_payer`
        (només s'inclouen si s'envia `dni`), a més de l'objecte `status`.

        Un `404` significa que el NIC no existeix o no està associat a cap
        contracte: el frontal mostra el missatge «NIC inexistente».
      operationId: getContractByNic
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/nicPath"
        - $ref: "#/components/parameters/dniOptional"
      responses:
        "200":
          description: Dades del contracte associat al NIC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractByNic"
              example:
                token: CTR-001
                contract_token: CTR-001
                status_token: "1"
                status_name: Activo
                holder_token: "12345678A"
                payment_type: DOM
                use_type: Doméstico
                holder_name: Anna Garcia
                city: Barcelona
                postal_code: "08110"
                iban: "ES12***************7890"
                status:
                  token: "1"
                  name: Activo
                has_sepa_document: false
        "400":
          description: El NIC no compleix el format esperat (`^\d{12}$`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Invalid NIC format
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: NIC inexistent o sense contracte associat (el frontal mostra «NIC inexistente»)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Contract not found

  /ov/meter/{contract_token}/:
    get:
      tags:
        - Comptador
      summary: Detall del comptador per token de contracte
      description: |
        Retorna les cinc dades del comptador que l'Oficina Virtual mostra al
        seu bloc fix de lectura: número de sèrie, calibre, xifres, any de
        fabricació i data d'instal·lació.
        El `contract_token` de la ruta és el del contracte; el comptador es resol des del
        seu punt de subministrament per defecte (`supply_point_default.meter`), el
        mateix origen que `meter_serial_number` i `meter_caliber` de
        `/ov/contract/{token}/`. Aquest endpoint afegeix les tres metadades del
        dispositiu (xifres, fabricació i instal·lació) que no s'exposen al
        detall del contracte.

        Si el contracte existeix però no té comptador, respon `200` amb els
        cinc camps a `null`.
      operationId: getMeterDetailByToken
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractTokenMeterPath"
      responses:
        "200":
          description: Dades del comptador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterDetail"
              example:
                meter_serial_number: MTR-001
                meter_caliber: "15"
                digits: 5
                manufacture_year: 2019
                installation_date: "2020-03-15"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/procedures/contract/:
    post:
      tags:
        - Tràmits
      summary: Sol·licitar l'alta d'un contracte
      description: |
        Crea una **sol·licitud de contracte** (`ContractRequest`) per a un nou
        subministrament, que atenció al client finalitzarà posteriorment.

        **No crea cap contracte, ni ordres, ni aprova res.** La sol·licitud
        queda en l'estat per defecte (esborrany) perquè atenció al client
        completi les dades que falten (comptador, data d'alta, adreça de
        facturació, ...) i la finalitzi amb el flux existent.

        **Tarifes periòdiques.** Surten del tipus de tràmit (paquet,
        `procedure_type_token`), com a la pantalla d'atenció al client: la
        sol·licitud rep totes les tarifes periòdiques actives del paquet (les
        `water_tariffs` de `/ov/dictionary/contract-request-types/`), una per
        punt de subministrament, i el contracte que se'n creï les factura
        totes. Ja no hi ha camp de tarifa: si encara s'envia `tariff_token`,
        s'ignora.

        **Diversos paquets.** `procedure_type_token` és una llista de paquets
        (un token sol també s'accepta). La sol·licitud rep la unió de les
        tarifes periòdiques, de les de contractació i de les ordres de tots,
        sense repetir-ne cap, i el seu tipus és el primer paquet de la llista.
        Retorna `400` si entre tots no hi ha cap tarifa periòdica activa, o si
        dos paquets porten tarifes diferents d'un mateix producte (es
        facturaria dues vegades el mateix concepte; `products` en diu els
        productes). Un paquet desconegut o inactiu retorna `404`.

        Si el DNI correspon a una persona existent, n'hi ha prou d'enviar
        `holder_dni` i els camps `holder_*` s'ignoren. Si no existeix, es crea
        el titular (`Person`, amb un contacte amb el seu telèfon i correu) dins
        de la mateixa transacció, i llavors `holder_name`, `holder_surname`
        (tret de persona jurídica), `holder_phone` i `holder_email` són
        obligatoris. S'exigeix que la propietat existeixi i tingui un punt de
        subministrament, i que els paquets estiguin actius i que, entre tots, tinguin alguna tarifa
        periòdica activa (n'hi ha prou que en tingui un). Si el pagament és per domiciliació
        (`DIRECT_DEBIT`) s'exigeixen les dades bancàries. Si la propietat té
        més d'un punt de subministrament actiu s'ha d'enviar `supply_point_token`.

        **Mandat SEPA signat (opcional).** Amb domiciliació es pot adjuntar
        a la mateixa crida el mandat SEPA signat: el PDF codificat en base64
        a `sepa_signed` i, opcionalment, el seu nom a `sepa_signed_filename`.
        S'arxiva al gestor documental com a mandat de la forma de pagament de
        la sol·licitud, i el contracte que es creï a partir d'ella el conserva.
        Només PDF (capçalera `%PDF-`) i fins a 10 MB (uns 13,4 MB en base64);
        els salts de línia del base64 s'ignoren. El document es valida abans
        de crear res: si no és vàlid no es crea la sol·licitud (`400`, o `413`
        si supera la mida). Sense aquests camps, o amb `null`, l'endpoint es
        comporta igual que abans.
      operationId: requestContractProcedure
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractProcedureRequest"
            examples:
              sinMandato:
                summary: Alta sense mandat SEPA
                value:
                  holder_dni: "12345678A"
                  property_token: PROV-0001
                  supply_point_token: "1234/1234"
                  procedure_type_token: domestic
                  payment_type_token: DIRECT_DEBIT
                  iban: ES9121000418450200051332
                  iban_holder_name: Nombre Titular
                  iban_holder_dni: "12345678A"
                  iban_holder_swift: CAIXESBBXXX
                  language: ca
                  observation: Alta solicitada desde la OV
              conMandato:
                summary: Alta amb el mandat SEPA signat (PDF en base64, retallat)
                value:
                  holder_dni: "12345678A"
                  property_token: PROV-0001
                  supply_point_token: "1234/1234"
                  procedure_type_token: [domestic, sewer_connection]
                  payment_type_token: DIRECT_DEBIT
                  iban: ES9121000418450200051332
                  iban_holder_name: Nombre Titular
                  iban_holder_dni: "12345678A"
                  iban_holder_swift: CAIXESBBXXX
                  sepa_signed: JVBERi0xLjQKJcfsj6IKNSAwIG9iago8PC9MZW5ndGggNiAwIFI+PgpzdHJlYW0K...
                  sepa_signed_filename: mandato_sepa_firmado.pdf
      responses:
        "201":
          description: Sol·licitud de contracte creada (estat esborrany)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractProcedureResponse"
              example:
                contract_request_token: "20261026001"
                status:
                  token: "1"
                  name: Esborrany
                type:
                  token: domestic
                  name: Domèstic
                person:
                  token: "12345678A"
                  name: Anna
                supply_point:
                  token: "1234/1234"
                payment:
                  iban: ES912100********051332
                created_at: "2026-10-26T09:30:00Z"
        "400":
          description: |
            Camps obligatoris absents o invàlids, dades personals
            absents o invàlides quan el DNI no existeix (titular nou),
            dades bancàries incompletes per a domiciliació, propietat amb
            diversos punts de subministrament sense `supply_point_token`, paquets
            sense cap tarifa periòdica activa entre tots, paquets amb tarifes
            diferents d'un mateix producte, o mandat
            SEPA (`sepa_signed`) que no és base64 vàlid, no és un PDF o
            s'envia amb una forma de pagament que no és domiciliació.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
              examples:
                nuevoTitular:
                  value:
                    holder_name:
                      - This field is required when the holder does not exist.
                    holder_email:
                      - This field is required when the holder does not exist.
                mandatoBase64:
                  value:
                    sepa_signed:
                      - Invalid base64 content.
                mandatoNoPdf:
                  value:
                    sepa_signed:
                      - Invalid file type. Only PDF files are allowed.
                mandatoSinDomiciliacion:
                  value:
                    sepa_signed:
                      - The SEPA mandate is only allowed for direct debit.
                paqueteSinTarifas:
                  value: {error: Procedure type has no active periodic tariffs}
                tarifasMismoProducto:
                  value:
                    error: Procedure types have different tariffs for the same product
                    products: [WATER]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No existeix la propietat, el punt de subministrament, el tipus de tràmit
            o la forma de pagament indicats. Els tipus inactius també retornen
            `404`. Un DNI inexistent no retorna
            `404`: es crea el titular (vegeu els camps `holder_*`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                property:
                  value: {error: Property not found}
                supplyPoint:
                  value: {error: Supply point not found}
                procedureType:
                  value: {error: Procedure type not found}
                paymentType:
                  value: {error: Payment type not found}
        "409":
          description: |
            Ja existeix una sol·licitud activa (ni cancel·lada ni finalitzada) per a la
            mateixa persona i punt de subministrament.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractProcedureConflictResponse"
              example:
                error: Contract request already exists
                contract_request_token: "20261026001"
        "413":
          description: |
            El mandat SEPA (`sepa_signed`) supera els 10 MB, o el cos de la
            petició és més gran del que pot ocupar amb ell (es rebutja sense
            llegir-lo). No es crea res.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationErrors"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                mandato:
                  value:
                    sepa_signed:
                      - File too large. Maximum size is 10 MB.
                cuerpo:
                  value:
                    error: Request body too large
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: No s'ha pogut crear la sol·licitud (estat per defecte no configurat)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Contract procedure could not be created

  /ov/procedures/contract/{contract_request_token}/:
    get:
      tags:
        - Tràmits
      summary: Consultar l'estat d'una sol·licitud d'alta de contracte
      description: |
        Retorna el progrés d'una sol·licitud d'alta creada des de l'OV
        (`POST /ov/procedures/contract/`).

        - `status` i `type`: objectes `{token, name}` amb l'estat actual i el
          tipus de tràmit de la sol·licitud.
        - `contract_token`: `null` mentre la sol·licitud segueixi pendent; si
          atenció al client l'ha aprovada i ja existeix el contracte enllaçat
          (`Contract.contract_request_id`), retorna el `token` del contracte.
        - Retorna `404` si la sol·licitud no existeix o està inactiva.
      operationId: getContractRequestStatus
      security:
        - tokenAuth: []
      parameters:
        - name: contract_request_token
          in: path
          required: true
          schema:
            type: string
          description: Token de la sol·licitud de contracte
      responses:
        "200":
          description: Estat de la sol·licitud de contracte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractRequestStatusResponse"
              example:
                contract_request_token: "20261026001"
                status:
                  token: "2"
                  name: Pendent
                type:
                  token: domestic
                  name: Domèstic
                contract_token: null
                created_at: "2026-10-26T09:30:00Z"
                supply_point:
                  token: "1234/1234"
                person:
                  token: "12345678A"
                  name: Anna
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ov/procedures/contract/{contract_request_token}/pdf/:
    get:
      tags:
        - Tràmits
      summary: Baixar el PDF del contracte d'una sol·licitud d'alta
      description: |
        Retorna el PDF del contracte d'una sol·licitud d'alta perquè un
        sistema extern el faci signar fora d'Aqua360 (el contracte signat
        es puja després a la sol·licitud).

        - Es genera amb la mateixa plantilla que s'utilitza per enviar-lo a signar
          des d'Aqua360 (inclou la signatura digital de l'empresa).
        - Si la sol·licitud ja té el PDF generat, es reutilitza; si no, es
          genera, es desa a la sol·licitud i es retorna.
        - Només el compte de servei de l'OV (grup `ov`) o un superusuari.
        - Retorna `404` si la sol·licitud no existeix o està inactiva i `500` si
          el PDF no es pot generar.
      operationId: downloadContractRequestPdf
      security:
        - tokenAuth: []
      parameters:
        - name: contract_request_token
          in: path
          required: true
          schema:
            type: string
          description: Token de la sol·licitud de contracte (el que retorna `POST /ov/procedures/contract/`)
      responses:
        "200":
          description: PDF del contracte de la sol·licitud
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Nom del fitxer (`<contract_request_token>.pdf`, disposició `attachment`)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: L'usuari autenticat no és el compte de servei de l'OV (grup `ov`) ni superusuari
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: No s'ha pogut generar el PDF del contracte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Contract PDF could not be generated

  /ov/procedures/contract/{contract_request_token}/signed/:
    post:
      tags:
        - Tràmits
      summary: Pujar el contracte signat d'una sol·licitud d'alta
      description: |
        Puja el contracte d'una sol·licitud d'alta una vegada signat fora
        d'Aqua360 (el PDF baixat amb
        `GET /ov/procedures/contract/{contract_request_token}/pdf/`).

        - S'arxiva igual que el contracte que retorna Aqua360 Sign: al
          gestor documental i com a contracte signat de la sol·licitud i, si el
          contracte ja s'ha creat, també del contracte.
        - Si ja hi havia un contracte signat, el nou el substitueix.
        - No canvia l'estat de la sol·licitud: només s'afegeix el document.
        - El fitxer s'envia com a `multipart/form-data` al camp `file`.
          Només s'accepten PDF (extensió `.pdf` i contingut que comença per
          `%PDF-`) de 10 MB com a màxim.
        - Només el compte de servei de l'OV (grup `ov`) o un superusuari.
        - Retorna `404` si la sol·licitud no existeix o està inactiva i `400`
          si falta el fitxer, no és un PDF o supera la mida màxima. Si la
          petició sencera (`Content-Length`) ja supera el màxim més un marge
          de 64 KB per al multipart, es rebutja amb `413` sense llegir-la.
      operationId: uploadSignedContractRequest
      security:
        - tokenAuth: []
      parameters:
        - name: contract_request_token
          in: path
          required: true
          schema:
            type: string
          description: Token de la sol·licitud de contracte (el que retorna `POST /ov/procedures/contract/`)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Contracte signat (PDF, màxim 10 MB)
      responses:
        "201":
          description: Contracte signat pujat i arxivat
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract_request_token:
                    type: string
                    description: Token de la sol·licitud
                  document_id:
                    type: integer
                    description: Identificador del document arxivat
                  success:
                    type: boolean
              example:
                contract_request_token: CR-0001
                document_id: 1234
                success: true
        "400":
          description: Falta el fitxer, no és un PDF o supera la mida màxima (errors de camp en format Django REST Framework)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
              example:
                file:
                  - Invalid file type. Only PDF files are allowed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: L'usuari autenticat no és el compte de servei de l'OV (grup `ov`) ni superusuari
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: La petició supera la mida màxima (es rebutja sense llegir el cos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Request body too large
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ov/procedures/contract-termination/:
    post:
      tags:
        - Tràmits
      summary: Sol·licitar la baixa d'un contracte
      description: |
        Registra una **sol·licitud** de baixa del contracte indicat; no dona de baixa
        el contracte. Atenció al client valida la sol·licitud, organitza la
        lectura de tall al camp i la finalitza des de la plataforma de gestió.

        - Només el titular pot sol·licitar-la: el contracte ha d'estar actiu i
          `holder_dni` ha de coincidir amb el document del titular (s'ignoren
          espais, punts i guions, i majúscules/minúscules). Contracte
          inexistent, inactiu, sense titular o d'un altre titular retornen el
          mateix `404`.
        - La sol·licitud es crea amb l'estat per defecte (esborrany). El tipus de
          baixa (el "Motiu" de la plataforma de gestió) és l'indicat a
          `reason_token`, sense restricció per tipus (també admet els de
          canvi de nom); és obligatori (l'endpoint no aplica cap tipus per
          defecte si falta). La data de sol·licitud és la de recepció.
        - **No** es recullen lectures, fotos, estimacions, dates ni dades de
          contacte: la lectura de tall la registra el personal de camp.
          Qualsevol camp addicional del cos s'ignora.
        - **No** es bloqueja per factures pendents ni genera factura de
          tancament: la facturació i el deute segueixen el seu propi cicle.
        - El text lliure `observation` es desa com a observació de la sol·licitud.
        - Les sol·licituds simultànies sobre el mateix contracte se serialitzen:
          només una pot crear la sol·licitud; la resta reben `409`.
      operationId: requestContractTermination
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractTerminationProcedureRequest"
            example:
              contract_token: "00012345"
              holder_dni: "12345678Z"
              reason_token: "1"
              observation: Cambio de domicilio
      responses:
        "201":
          description: Sol·licitud de baixa creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractTerminationProcedureResponse"
              example:
                contract_termination_token: "261105001"
                contract_token: "00012345"
                status:
                  token: "1"
                  name: Borrador
                type:
                  token: "1"
                  name: Petición del cliente
                created_at: "2026-11-05T10:15:00+01:00"
        "400":
          description: |
            Camps obligatoris absents, buits o massa llargs, `reason_token`
            que no correspon a cap tipus de baixa, o `holder_dni` sense
            caràcters vàlids (`{"error": "DNI is required"}`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            Contracte inexistent, inactiu, sense titular o el titular del qual no
            coincideix amb `holder_dni`. Sempre la mateixa resposta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Contract not found
        "409":
          description: |
            El contracte ja està donat de baixa, o ja té una sol·licitud de baixa
            oberta (ni finalitzada ni cancel·lada); en aquest cas es retorna el
            seu token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractTerminationProcedureConflictResponse"
              examples:
                alreadyTerminated:
                  value:
                    error: Contract already terminated
                openTermination:
                  value:
                    error: Contract termination already exists
                    contract_termination_token: "261105001"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: No s'ha pogut crear la sol·licitud (estat o tipus de baixa per defecte no configurat)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Contract termination could not be created

  /ov/procedures/contract-change/:
    post:
      tags:
        - Tràmits
      summary: Sol·licitar un canvi de nom (subrogació)
      description: |
        Registra un canvi de nom del contracte indicat. En **una sola
        transacció** crea, en l'estat per defecte (esborrany):

        - una **sol·licitud de baixa** del contracte actual (titular sortint), amb
          el tipus de baixa indicat a `outgoing.reason_token` o, si s'omet,
          el tipus de baixa de canvi de nom;
        - una **sol·licitud d'alta** del nou titular marcada com a canvi de
          nom (`is_change_of_name`), al mateix punt de subministrament i
          enllaçada a la sol·licitud de baixa.

        Ni el contracte ni les seves dades canvien: atenció al client valida les
        sol·licituds i les finalitza des de la plataforma de gestió; en crear el
        nou contracte es tramita la baixa de l'actual.

        - Només el titular actual pot sol·licitar-ho: el contracte ha d'estar
          actiu i `outgoing.holder_dni` ha de coincidir amb el seu titular (s'ignoren
          espais, punts, guions i majúscules). Contracte
          inexistent, inactiu, sense titular o d'un altre titular retornen el
          mateix `404`.
        - El nou titular (`incoming.holder_dni`) ha de ser diferent de
          l'actual. Si no existeix, es crea dins de la mateixa transacció amb els
          camps `incoming.holder_*` (`holder_name`, `holder_surname` tret de
          persona jurídica, `holder_phone` i `holder_email` obligatoris en
          aquest cas); si existeix, aquests camps s'ignoren.
        - **No** s'escullen tarifes: la sol·licitud hereta les tarifes periòdiques
          actives del contracte actual; els drets d'alta i els tipus
          d'ordre són els de canvi de nom del tipus de tràmit. També es
          copien les variables traspassables del contracte actual.
        - **No** es recullen lectures ni es bloqueja per deute pendent.
        - Les dades bancàries d'`incoming` només són obligatòries si la forma
          de pagament és domiciliació (`DIRECT_DEBIT`).
        - Els errors de validació es retornen imbricats per bloc
          (`outgoing` / `incoming`).
        - Qualsevol error desfà tots els registres; les peticions
          simultànies sobre el mateix contracte se serialitzen i només una pot
          crear les sol·licituds.
      operationId: requestContractChange
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractChangeProcedureRequest"
            example:
              outgoing:
                contract_token: "00012345"
                holder_dni: "12345678Z"
                reason_token: "4"
                observation: Venta de la vivienda
              incoming:
                holder_dni: "87654321Y"
                procedure_type_token: domestic
                payment_type_token: DIRECT_DEBIT
                iban: ES0000000000000000000000
                iban_holder_name: Nombre Apellido
                iban_holder_dni: "87654321Y"
                iban_holder_swift: XXXXESXXXXX
                language: es
                observation: Nuevo titular
      responses:
        "201":
          description: Sol·licituds de baixa i d'alta (canvi de nom) creades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractChangeProcedureResponse"
              example:
                contract_request_token: "261106001"
                contract_termination_token: "261106001"
                contract_token: "00012345"
                contract_request_status:
                  token: "1"
                  name: Borrador
                contract_termination_status:
                  token: "1"
                  name: Borrador
                procedure_type:
                  token: domestic
                  name: Doméstico
                termination_type:
                  token: "4"
                  name: Baja por cambio de titular
                created_at: "2026-11-06T10:15:00+01:00"
        "400":
          description: |
            Errors de validació imbricats per bloc: camps absents o
            buits, `reason_token`, `procedure_type_token` (inexistent o
            inactiu) o `payment_type_token` desconeguts, dades bancàries
            incompletes per a domiciliació, dades personals del nou
            titular absents o invàlides quan el seu DNI no existeix, o mateix
            titular sortint i entrant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
              example:
                outgoing:
                  reason_token:
                    - Unknown termination reason.
                incoming:
                  iban:
                    - This field is required for direct debit.
                  holder_phone:
                    - This field is required when the holder does not exist.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            El contracte no existeix, està inactiu, no té titular o el seu
            titular no coincideix amb `outgoing.holder_dni`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                contract:
                  value: {error: Contract not found}
        "409":
          description: |
            El contracte no admet un canvi de nom: ja està donat de baixa,
            té una sol·licitud de baixa oberta, ja hi ha una sol·licitud d'alta
            oberta al seu punt de subministrament o no té punt de subministrament.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractChangeProcedureConflictResponse"
              examples:
                alreadyTerminated:
                  value:
                    error: Contract already terminated
                openTermination:
                  value:
                    error: Contract termination already exists
                    contract_termination_token: "261106001"
                openContractRequest:
                  value:
                    error: Contract request already exists
                    contract_request_token: "261106001"
                noSupplyPoint:
                  value:
                    error: Contract has no supply point
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: |
            No s'han pogut crear les sol·licituds: estats per defecte no
            configurats, o `reason_token` omès sense cap tipus de baixa de
            canvi de nom configurat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Contract change could not be created

  /ov/procedures/{contract_token}/upload-sepa-signed/:
    post:
      tags:
        - Tràmits
      summary: Pujar i arxivar el mandat SEPA signat
      description: |
        Puja el mandat SEPA signat pel titular del compte i l'arxiva
        com a prova de l'autorització de domiciliació. El document ha
        d'estar signat pel titular del compte; el sistema central el
        conserva com a justificant.

        El fitxer s'envia com a `multipart/form-data` amb dos camps:
        `sepa` (PDF o imatge) i `iban` del compte de domiciliació.

        L'`iban` rebut es neteja (sense espais, en majúscules) i ha de
        coincidir amb l'IBAN actiu del contracte (`payment.IBAN.iban`); si no
        coincideix es retorna `400`. Respon `404` si el contracte no existeix.

        El document s'arxiva al gestor documental del sistema central
        (servei configurat per a contractes, per defecte `hdd`) com a document
        SEPA vinculat a la forma de pagament del contracte
        (`GeneralPaymentSepaDocument`). Si el contracte ja tenia un mandat
        arxivat, se substitueix pel nou. La petició i la resposta
        (`201`) es mantenen sense canvis.
      operationId: uploadSignedProcedureDocument
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractTokenSepaPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - sepa
                - iban
              properties:
                sepa:
                  type: string
                  format: binary
                  description: Mandat SEPA signat (PDF o imatge)
                iban:
                  type: string
                  description: IBAN del compte de domiciliació del contracte (es normalitza sense espais i en majúscules)
                  example: ES9121000418450200051332
            example:
              sepa: (binario)
              iban: ES9121000418450200051332
      responses:
        "201":
          description: Mandat SEPA signat pujat i arxivat correctament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedMandateUploadResponse"
              example:
                contract_token: CTR-001
                success: true
        "400":
          description: |
            Falten camps o el fitxer no és vàlid (errors de camp en format
            Django REST Framework), o l'`iban` no coincideix amb el compte
            de domiciliació actiu del contracte.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationErrors"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                fieldErrors:
                  summary: Falta el fitxer o el seu tipus no és vàlid
                  value:
                    sepa:
                      - This field is required.
                ibanMismatch:
                  summary: IBAN diferent del del compte actiu
                  value:
                    error: The IBAN does not match the contract's current active account.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/procedures/{contract_token}/sepa-signed/:
    get:
      tags:
        - Tràmits
      summary: Baixar el mandat SEPA signat arxivat
      description: |
        Retorna el document del mandat SEPA signat arxivat per a la forma
        de pagament del contracte. Respon `404` si el contracte no existeix o si no
        hi ha cap mandat arxivat (també si el fitxer físic no està
        disponible al gestor documental).
      operationId: downloadSignedProcedureDocument
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractTokenSepaPath"
      responses:
        "200":
          description: Fitxer del mandat SEPA signat
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Nom del fitxer arxivat (disposició `attachment`)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            El contracte no existeix o no hi ha mandat SEPA arxivat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                contractNotFound:
                  summary: Contracte inexistent
                  value:
                    error: Contract not found
                documentNotFound:
                  summary: Sense mandat arxivat
                  value:
                    error: SEPA document not found

  /ov/procedures/{contract_token}/cancel-direct-debit/:
    post:
      tags:
        - Tràmits
      summary: Cancel·lar la domiciliació (revocació del mandat SEPA)
      description: |
        Revoca el mandat SEPA del contracte i canvia la seva forma de pagament al
        tipus de pagament indicat, com a resposta a una sol·licitud de cancel·lació
        de domiciliació de l'usuari.

        Cos JSON amb `period` (període de facturació des del qual s'aplica
        la cancel·lació, p. ex. `2026-3T`), `role` (rol de qui sol·licita, p.
        ex. `TITULAR` o `PAGADOR`) i `new_payment_type` (opcional: token del
        nou tipus de pagament; si falta s'utilitza `BANK_TRANSFER`).

        Flux: `404` si el contracte no existeix; `400` si falten camps, si el
        contracte no té forma de pagament o si `new_payment_type` no
        correspon a un `PaymentType` existent; `500` si el tipus per
        defecte `BANK_TRANSFER` no és a la base de dades.

        Operació **idempotent**: si el contracte ja té el tipus de pagament
        objectiu no es canvia el contracte (ni canvi de tipus, ni `ContractLog`)
        i es respon `200` amb
        `message: "Direct debit already cancelled."`.

        Quan sí que hi ha canvi, s'actualitza `contract.payment.type` i
        es registren una entrada d'auditoria `ContractLog` (camp
        `payment_type`, amb el token anterior i el nou) i una
        `ContractObservation` amb el `period` i el `role` sol·licitats, tot
        dins d'una transacció.

        En els dos casos, les factures emeses del contracte que encara s'havien de
        cobrar per domiciliació (actives, confirmades, enviades o vençudes,
        import positiu, amb algun rebut pendent o retornat i sense cap
        rebut en una remesa pendent d'enviar) passen al nou tipus de pagament
        sense compte, sigui quin sigui el seu període. Els abonaments no es toquen. El canvi
        queda a l'historial de cada factura i en una `ContractObservation`
        amb el nombre de factures. Els seus tokens es retornen a
        `updated_invoices`. Si el nou tipus és `DIRECT_DEBIT` no es canvia
        cap factura.
      operationId: cancelDirectDebit
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractTokenCancelPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelDirectDebitRequest"
            example:
              period: "2026-3T"
              role: TITULAR
              new_payment_type: BANK_TRANSFER
      responses:
        "200":
          description: |
            Cancel·lació aplicada (canvi de tipus de pagament + auditoria) o bé
            ja estava cancel·lada (resposta idempotent, sense canviar el contracte).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelDirectDebitResponse"
              examples:
                cancelled:
                  summary: Cancel·lació aplicada
                  value:
                    contract_token: CTR-001
                    success: true
                    message: Direct debit cancelled successfully.
                    updated_invoices:
                      - INV-001
                alreadyCancelled:
                  summary: Ja estava cancel·lada (idempotent, sense canviar el contracte)
                  value:
                    contract_token: CTR-001
                    success: true
                    message: Direct debit already cancelled.
                    updated_invoices: []
        "400":
          description: |
            Falten camps (format Django REST Framework), el contracte no
            té forma de pagament o `new_payment_type` no existeix.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationErrors"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                fieldErrors:
                  summary: Falten period o role
                  value:
                    period:
                      - This field is required.
                noPayment:
                  summary: El contracte no té forma de pagament
                  value:
                    error: Contract has no payment method
                invalidPaymentType:
                  summary: Token de tipus de pagament desconegut
                  value:
                    error: Invalid payment type token
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: El tipus de pagament per defecte `BANK_TRANSFER` no existeix a la base de dades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Default payment type BANK_TRANSFER not found

  /ov/dictionary/contract-statuses/:
    get:
      tags:
        - Diccionaris
      summary: Estats de contracte disponibles
      description: |
        Retorna els estats de contracte definits al PA com a parells
        `token`/`name`, ordenats per la seva `position` de presentació. Permet
        al frontal extern omplir selectors i traduir tokens sense
        codificar-los a mà. No inclou camps de presentació (color, etc.).
      operationId: listContractStatusesDictionary
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Estats de contracte ordenats per `position`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DictionaryItem"
              example:
                - token: "1"
                  name: Activo
                - token: "2"
                  name: Inactivo
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ov/dictionary/payment-types/:
    get:
      tags:
        - Diccionaris
      summary: Formes de pagament disponibles
      description: |
        Retorna les formes de pagament definides al PA com a parells
        `token`/`name`, ordenades per la seva `position` de presentació. El
        `token` és el mateix que accepten els endpoints de facturació
        (p. ex. `exc_payment_type_token`).
      operationId: listPaymentTypesDictionary
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Formes de pagament ordenades per `position`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DictionaryItem"
              example:
                - token: DIRECT_DEBIT
                  name: Domiciliació bancària (SEPA)
                - token: BANK_TRANSFER
                  name: Transferència bancària
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ov/dictionary/invoice-statuses/:
    get:
      tags:
        - Diccionaris
      summary: Estats de factura disponibles
      description: |
        Retorna els estats de factura definits al PA com a parells
        `token`/`name`, ordenats per la seva `position` de presentació. Els
        tokens són els mateixos que accepta el filtre `statuses` de
        `/ov/unpayed-invoices/`.
      operationId: listInvoiceStatusesDictionary
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Estats de factura ordenats per `position`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DictionaryItem"
              example:
                - token: "0"
                  name: Pagada
                - token: "-1"
                  name: Vencida
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ov/dictionary/contract-request-types/:
    get:
      tags:
        - Diccionaris
      summary: Tipus de sol·licitud de contracte actius amb les seves tarifes
      description: |
        Retorna els tipus de sol·licitud de contracte actius (per exemple,
        domèstic, comercial o industrial), ordenats alfabèticament per
        `name`. Cada tipus inclou si requereix ocupants (`has_persons`) i les
        tarifes **actives** associades, com a parells `token`/`name`:
        `registration_tariffs` (alta/contractació), `water_tariffs`
        (consum d'aigua) i `change_of_name_tariffs` (canvi de nom).
        Si un tipus no té tarifes en alguna relació, aquesta llista és `[]`.
        El `name` de cada tarifa és el de la tarifa, tret que sigui genèric
        (`GENERAL`), buit o només espais: llavors es retorna el nom del
        producte associat.
        Les tarifes de `registration_tariffs` i `change_of_name_tariffs`
        inclouen a més el seu cost, calculat igual que a
        `/ov/dictionary/procedure-tariffs/`: `type_price` (`fixed` o
        `variable`) i `price` (suma dels conceptes fixos, import sense
        impostos; `null` si no en té cap). Les de `water_tariffs` són
        periòdiques (es cobren amb el consum) i no porten preu.
        Cada tipus suma el cost del tràmit a `registration_price` (alta) i
        `change_of_name_price` (canvi de titularitat): `0` si no hi ha
        tarifes i `null` si alguna no té preu fix (va per trams o no té
        conceptes), perquè llavors depèn del punt de subministrament.
        El `token` és el que s'ha d'enviar com a `procedure_type_token` en
        sol·licitar un tràmit.
      operationId: listContractRequestTypesDictionary
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Tipus de sol·licitud actius ordenats per `name`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractRequestTypeItem"
              example:
                - token: domestic
                  name: Doméstico
                  has_persons: true
                  registration_tariffs:
                    - token: registration-domestic
                      name: Alta doméstica
                      type_price: fixed
                      price: 65.4
                  water_tariffs:
                    - token: water-domestic
                      name: Agua doméstica
                  change_of_name_tariffs: []
                  registration_price: 65.4
                  change_of_name_price: 0
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ov/dictionary/procedure-tariffs/:
    get:
      tags:
        - Diccionaris
      summary: Tarifes actives aplicables a tràmits
      description: |
        Retorna el catàleg de tarifes actives (`PriceRate.is_active`) de
        productes de tràmit/altes (orígens de producte 2, 4 i 5: drets
        d'escomesa, comptador, pòlissa, dipòsit, reconnexió...), excloent
        els serveis periòdics recurrents (origen 1: aigua, escombraries, cànon,
        sanejament...) i les tarifes sense producte associat. Ordenat per
        `name`. Per a cada tarifa es resol el seu període de
        facturació actiu (`billing_range_active`) i els seus conceptes:

        - `type_price`: `fixed` si tots els conceptes són imports fixos;
          `variable` si algun es tarifa per trams.
        - `price`: suma dels conceptes fixos (import unitari sense
          impostos); `null` quan no hi ha conceptes fixos.
        - `price_table`: taula del primer concepte variable (es prioritza
          `price_interval` sobre `price_variable`); `null` si la tarifa és
          fixa. `units` indica la dimensió del tram: `m3` (consum),
          `dm_met` (calibre del comptador) o `dm_con` (diàmetre de connexió).
        - `components`: desglossament complet de cada concepte amb la mateixa
          forma (`token`, `name`, `type_price`, `price`, `price_table`).
        - `name`: nom de la tarifa; si és genèric (`GENERAL`) o buit, es
          resol amb el nom del producte associat.

        El frontal extern ho fa servir per calcular el cost total d'un tràmit
        abans de cobrar a l'abonat.
      operationId: listProcedureTariffsDictionary
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Tarifes actives ordenades per `name`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcedureTariffItem"
              example:
                - token: TR-001
                  name: Tarifa 2.0TD
                  type_price: variable
                  price: null
                  price_table:
                    units: dm_met
                    stretches:
                      - name: Calibre 13
                        min: 1
                        max: 13
                        price: 45.0
                        proportional_price: null
                      - name: Calibre 20
                        min: 14
                        max: 20
                        price: 78.5
                        proportional_price: null
                  components:
                    - token: LIT-001
                      name: Alta por calibre
                      type_price: variable
                      price: null
                      price_table:
                        units: dm_met
                        stretches:
                          - name: Calibre 13
                            min: 1
                            max: 13
                            price: 45.0
                            proportional_price: null
                - token: TR-BAIL
                  name: Fianza contador
                  type_price: fixed
                  price: 100.0
                  price_table: null
                  components:
                    - token: LIT-002
                      name: Fianza
                      type_price: fixed
                      price: 100.0
                      price_table: null
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Token obtingut mitjançant `POST /auth/login/`.
        Format de la capçalera: `Authorization: Token <token>`

  parameters:
    consumptionDni:
      name: dni
      in: query
      required: false
      description: |
        DNI/NIF de la persona. Opcional: si s'indica, només compten les
        factures del contracte on és titular o pagadora. Es normalitza
        ignorant espais, guions i punts i passant a majúscules, igual que
        els DNI desats a la factura. Buit equival a no indicar-lo.
      schema:
        type: string
      example: "12345678A"

    contractToken:
      name: contract_token
      in: query
      required: true
      description: Token del contracte (`Contract.token`)
      schema:
        type: string
      example: CTR-001

    invoiceToken:
      name: invoice_token
      in: query
      required: true
      description: Token de la factura (`Invoice.token`) o, en PDF, també `serie_final`
      schema:
        type: string
      example: INV-001

    dni:
      name: dni
      in: query
      required: true
      description: |
        DNI/NIF del titular del contracte (`Contract.holder.token`) o del titular del
        compte de domiciliació (`PersonBank.dni` / `PersonBank.person.token`).
      schema:
        type: string
      example: "12345678A"

    dniOptional:
      name: dni
      in: query
      required: false
      description: |
        DNI/NIF del sol·licitant. A `/ov/contract/{token}/`, a
        `/ov/contract/by-nic/{nic}/` i a `/ov/contract-detail/` determina els
        indicadors `is_account_holder`, `is_holder` i `is_payer` (només s'avaluen
        i s'inclouen a la resposta quan s'envia) i desemmascara l'IBAN
        quan coincideix amb el titular del compte de domiciliació.
      schema:
        type: string
      example: "12345678A"

    contractStatus:
      name: estado
      in: query
      required: false
      description: |
        Token d'estat de contracte (`ContractStatus.token`) pel qual filtrar.
        Tokens habituals als fixtures de referència: `1` (Alta) i `-1` (Baixa).
        Els tokens reals depenen de la configuració del desplegament.
      schema:
        type: string
      example: "1"

    pageParam:
      name: page
      in: query
      required: false
      description: Número de pàgina (base 1).
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    limitParam:
      name: limit
      in: query
      required: false
      description: |
        Nombre màxim de contractes per pàgina. El servidor acota el valor al màxim
        configurat encara que se'n sol·liciti un de més gran.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    dateFrom:
      name: date_from
      in: query
      required: false
      description: Data mínima de lectura (inclosa), format `YYYY-MM-DD`.
      schema:
        type: string
        format: date
      example: "2025-01-01"

    dateTo:
      name: date_to
      in: query
      required: false
      description: Data màxima de lectura (inclosa), format `YYYY-MM-DD`.
      schema:
        type: string
        format: date
      example: "2025-12-31"

    pageSize:
      name: page_size
      in: query
      required: false
      description: Mida de pàgina. El servidor acota el valor al màxim indicat encara que se'n sol·liciti un de més gran.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      example: 50

    contractTokenPath:
      name: token
      in: path
      required: true
      description: Token del contracte (`Contract.token`)
      schema:
        type: string
      example: CTR-001

    nicPath:
      name: nic
      in: path
      required: true
      description: |
        NIC = referència de mandat de 12 xifres sense separadors de la forma de
        pagament del contracte (`GeneralPayment.mandate_id`).
      schema:
        type: string
        pattern: '^\d{12}$'
      example: "123456000001"

    contractTokenMeterPath:
      name: contract_token
      in: path
      required: true
      description: Token del contracte (`Contract.token`)
      schema:
        type: string
      example: CTR-001

    contractTokenSepaPath:
      name: contract_token
      in: path
      required: true
      description: Token del contracte (`Contract.token`)
      schema:
        type: string
      example: CTR-001

    contractTokenCancelPath:
      name: contract_token
      in: path
      required: true
      description: Token del contracte (`Contract.token`)
      schema:
        type: string
      example: CTR-001

    invoiceTokenPath:
      name: token
      in: path
      required: true
      description: Token de la factura (`Invoice.token`)
      schema:
        type: string
      example: INV-001

    consumptionIdPath:
      name: id
      in: path
      required: true
      description: ID de la lectura (`Reading.id`)
      schema:
        type: integer
      example: 42

    downloadFormat:
      name: format
      in: query
      required: false
      description: |
        Format del fitxer per a `GET /ov/consumption/{id}/download/`
        (`pdf` per defecte o `csv`).
      schema:
        type: string
        enum: [pdf, csv]
        default: pdf
      example: pdf

  responses:
    Unauthorized:
      description: Falta o és incorrecte el token d'autenticació
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            detail: Las credenciales de autenticación no se proveyeron.

    BadRequest:
      description: Paràmetres o dades d'entrada invàlids
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          examples:
            missingToken:
              summary: Falta contract_token
              value:
                error: Contract token is required
            notFound:
              summary: Contracte no trobat
              value:
                error: Contract not found

    ValidationErrors:
      description: Errors de validació del cos JSON (format Django REST Framework)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrors"
          example:
            date_from:
              - La fecha de inicio no puede ser posterior a la final
            reading_ids:
              - "ID de lectura desconocido: 999"

    NotFound:
      description: Recurs no trobat
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Contract not found

    InternalError:
      description: Error intern del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: "Failed to update billing data: ..."

    TooManyRequests:
      description: S'ha superat el límit de consultes per a aquest compte
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            detail: Solicitud fue regulada (throttled). Expected available in 60 seconds.

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: ov_user
        password:
          type: string
          format: password
          example: "********"

    LoginResponse:
      type: object
      required:
        - username
        - token
      properties:
        username:
          type: string
          example: ov_user
        token:
          type: string
          description: Token per a la capçalera Authorization
          example: 7b21d0b21ac28cd8721688b5db7d484adc32101f

    ErrorDetail:
      type: object
      properties:
        detail:
          type: string

    ErrorMessage:
      type: object
      properties:
        error:
          type: string

    ValidationErrors:
      type: object
      additionalProperties: true
      description: Errors de validació per camp (format Django REST Framework)

    ContractDetail:
      type: object
      properties:
        token:
          type: string
          description: Token del contracte
        status_token:
          type: string
          nullable: true
          description: Token de l'estat del contracte
        status_name:
          type: string
          nullable: true
          description: Nom de l'estat del contracte
        status:
          type: object
          nullable: true
          description: Estat del contracte com a objecte, afegit sense retirar els camps legacy
          properties:
            token:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
        holder_token:
          type: string
          nullable: true
          description: NIF/document del titular
        payment_type:
          type: string
          nullable: true
          description: Token del tipus de pagament
        use_type:
          type: string
          nullable: true
          description: Tipus d'ús del contracte
        last_invoice_date:
          type: string
          format: date-time
          nullable: true
          description: Data de creació de l'última factura
        iban:
          type: string
          description: IBAN emmascarat
        supply_point_address:
          type: string
          nullable: true
          description: Adreça del punt de subministrament per defecte
        meter_serial_number:
          type: string
          nullable: true
          description: Número de sèrie del comptador (camp code del comptador)
        meter_caliber:
          type: string
          nullable: true
          description: Calibre del comptador
        smart_metering:
          type: string
          enum: ["true", "false"]
          description: Indica si el comptador té telelectura
        registration_date:
          type: string
          nullable: true
          description: Data d'alta en format dd/mm/aaaa
        termination_date:
          type: string
          nullable: true
          description: Data de baixa en format dd/mm/aaaa (si el contracte està donat de baixa)

    BillingData:
      type: object
      properties:
        nif:
          type: string
          description: NIF del titular
        tenant_name:
          type: string
          description: Nom complet del titular
        supply_point_address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        paper_invoice:
          type: string
          enum: ["true", "false"]
          description: "`true` si rep factura en paper, `false` si és digital"
        email:
          type: string
        invoice_language:
          type: string
          description: Idioma de factura (configuració del desplegament)
        phone1:
          type: string
        phone2:
          type: string
        payment_type:
          type: string
          nullable: true
          description: Token del tipus de pagament
        iban:
          type: string
          description: IBAN emmascarat
        holder_name:
          type: string
          description: Nom complet del titular
        has_sepa_document:
          type: boolean
          description: |
            `true` si la forma de pagament del contracte té un mandat SEPA
            signat arxivat (`GeneralPaymentSepaDocument`); `false` si no hi ha
            mandat o el contracte no té forma de pagament.

    PersonDataResponse:
      type: object
      description: Dades de contacte d'una persona, incloses les seves files inactives.
      required:
        - person
        - phones
        - emails
        - addresses
      properties:
        person:
          $ref: "#/components/schemas/PersonSummary"
        phones:
          type: array
          items:
            $ref: "#/components/schemas/PersonPhoneItem"
        emails:
          type: array
          items:
            $ref: "#/components/schemas/PersonEmailItem"
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/PersonAddressItem"

    PersonSummary:
      type: object
      required:
        - token
        - name
        - surname
        - is_juridic
      properties:
        token:
          type: string
          description: DNI/NIF de la persona (`Person.token`)
          example: "12345678A"
        name:
          type: string
          nullable: true
          example: Anna
        surname:
          type: string
          nullable: true
          example: Garcia
        is_juridic:
          type: boolean
          description: Indica si la persona és jurídica (empresa) en lloc de física

    PersonPhoneItem:
      type: object
      required:
        - token
        - phone
        - role
        - is_default
        - is_active
      properties:
        token:
          type: string
          description: Token de la fila `PersonContact`
          nullable: true
        phone:
          type: string
          example: "600123456"
        role:
          type: string
          nullable: true
          description: Rol del contacte (etiqueta lliure)
        is_default:
          type: boolean
        is_active:
          type: boolean

    PersonEmailItem:
      type: object
      required:
        - token
        - email
        - role
        - is_default
        - is_active
      properties:
        token:
          type: string
          description: Token de la fila `PersonContact`
          nullable: true
        email:
          type: string
          format: email
          example: anna.garcia@example.com
        role:
          type: string
          nullable: true
          description: Rol del contacte (etiqueta lliure)
        is_default:
          type: boolean
        is_active:
          type: boolean

    PersonAddressItem:
      type: object
      description: |
        Adreça d'una persona (`PersonAddress`). `address` és `null` quan
        la fila no té adreça associada; en aquest cas els camps de
        l'adreça també són `null`.
      required:
        - token
        - address
        - attention_to
        - is_billing
        - is_active
      properties:
        token:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
          description: Adreça completa ja formatada
          example: "C. Major, 123 2-B, Barcelona"
        street:
          type: string
          nullable: true
          example: "C. Major"
        street_number:
          type: string
          nullable: true
          example: "123"
        postal_code:
          type: string
          nullable: true
          example: "08001"
        city:
          type: string
          nullable: true
          example: Barcelona
        floor:
          type: string
          nullable: true
          example: "2"
        door:
          type: string
          nullable: true
          example: B
        stair:
          type: string
          nullable: true
        building:
          type: string
          nullable: true
        attention_to:
          type: string
          nullable: true
          description: Persona o entitat a la qual va dirigida l'adreça
        is_billing:
          type: boolean
          description: Indica si és l'adreça de facturació
        is_active:
          type: boolean
          description: Indica si l'adreça està activa (false = històrica)

    ContactData:
      allOf:
        - $ref: "#/components/schemas/BillingData"
        - type: object
          properties:
            holder_address:
              type: string
              nullable: true
              description: Adreça postal del titular del contracte (`PersonAddress` amb `is_billing`); `null` si el titular no té adreça d'enviament
              example: "C/ de Mallorca, 45, 2-1, 08013 Barcelona"

    BatchInvoiceDownloadRequest:
      type: object
      required:
        - invoice_tokens
      properties:
        invoice_tokens:
          type: array
          minItems: 1
          description: Tokens de les factures a incloure al ZIP (es dedupliquen; totes han de pertànyer al contracte i ser definitives)
          items:
            type: string
          example:
            - "INV-001"
            - "INV-002"

    UpdateBillingDataRequest:
      type: object
      required:
        - paper_invoice
      properties:
        email:
          type: string
          format: email
          nullable: true
        phone1:
          type: string
        phone2:
          type: string
        paper_invoice:
          type: boolean
          description: "`true` per a factura en paper, `false` per a factura digital"

    UpdateBillingDataResponse:
      type: object
      properties:
        message:
          type: string
        data:
          $ref: "#/components/schemas/BillingData"

    UpdateIbanRequest:
      type: object
      required:
        - iban
        - nif
        - iban_holder_name
        - iban_holder_dni
      properties:
        iban:
          type: string
          description: IBAN complet (es normalitza sense espais i en majúscules)
        nif:
          type: string
          description: NIF del titular del contracte (ha de coincidir amb `holder.token`)
        iban_holder_name:
          type: string
          description: Nom del titular del compte bancari
        iban_holder_dni:
          type: string
          description: DNI/NIF del titular del compte bancari

    UpdateIbanResponse:
      type: object
      properties:
        message:
          type: string
        data:
          $ref: "#/components/schemas/BillingData"

    PersonInvoicesResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PersonInvoicesGroup"
    PersonInvoicesGroup:
      type: object
      description: |
        Factures d'un contracte. Si `contract_number` és `null`, agrupa les
        factures sense contracte.
      properties:
        contract_number:
          type: string
          nullable: true
          description: Token del contracte; `null` al grup de factures sense contracte
        contract_status:
          type: object
          nullable: true
          description: Estat actual del contracte `{token, name}`
          properties:
            token:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
        supply_address:
          type: string
          nullable: true
          description: Adreça del punt de subministrament per defecte del contracte
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/PersonInvoiceItem"
    PersonContractsResponse:
      type: object
      description: Embolcall paginat dels contractes d'una persona.
      required:
        - count
        - page
        - limit
        - total_pages
        - results
      properties:
        count:
          type: integer
          description: Nombre total de contractes que compleixen els filtres
        page:
          type: integer
          description: Pàgina actual
        limit:
          type: integer
          description: Mida de pàgina aplicada
        total_pages:
          type: integer
          description: Nombre total de pàgines
        results:
          type: array
          items:
            $ref: "#/components/schemas/PersonContractItem"
    PersonContractItem:
      type: object
      required:
        - contract_token
        - contract_status
        - supply_point
        - address
        - roles
        - related_now
      properties:
        contract_token:
          type: string
          nullable: true
          description: Token del contracte, utilitzable com a `contract_token` a la resta d'endpoints `/ov/`
        contract_status:
          type: object
          nullable: true
          description: Estat actual del contracte `{token, name}`
          properties:
            token:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
        supply_point:
          type: string
          nullable: true
          description: Token (NIC) del punt de subministrament per defecte del contracte
        address:
          type: string
          nullable: true
          description: Adreça del punt de subministrament per defecte del contracte
        roles:
          type: array
          description: Papers de la persona al contracte, avui o a les seves factures
          items:
            type: string
            enum: [holder, payer]
        related_now:
          type: boolean
          description: |
            `true` si avui la persona és la titular o la titular del compte
            de domiciliació i el contracte està d'alta.
    PersonInvoiceItem:
      type: object
      properties:
        invoice_number:
          type: string
          nullable: true
          description: Sèrie/número de factura (`serie_final`)
        invoice_token:
          type: string
          description: Token de la factura
        invoice_date:
          type: string
          format: date
          nullable: true
          description: Data d'emissió (`issue_date`)
        invoice_amount:
          type: number
          format: double
          nullable: true
          description: Import total de la factura (`total_final`)
        pending_amount:
          type: number
          format: double
          nullable: true
          description: Import pendent de pagament (`left_to_pay`)
        invoice_status:
          type: string
          nullable: true
          description: Nom de l'estat de la factura
        status:
          type: object
          nullable: true
          description: Estat de la factura `{token, name}`; `null` si no en té
          properties:
            token:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
        payment_type:
          type: string
          nullable: true
          description: |
            Token de la forma de pagament de la factura (`payment_type_token_final`),
            el mateix que retorna `/ov/dictionary/payment-types/`. És `null` si el
            token de la factura no correspon a cap forma de pagament del
            diccionari.
          example: DIRECT_DEBIT
        pdf_available:
          type: boolean
          description: Indica si el PDF està disponible segons la configuració `ov_pdf_from`
        is_holder:
          type: boolean
          description: La persona és la titular desada a la factura
        is_payer:
          type: boolean
          description: |
            La persona és la pagadora desada a la factura (o la titular, si
            la factura no té pagador)
        is_returned:
          $ref: "#/components/schemas/InvoiceIsReturned"
        last_return:
          $ref: "#/components/schemas/InvoiceLastReturn"
    InvoiceSummary:
      type: object
      properties:
        contract_number:
          type: string
          description: Token del contracte
        invoice_number:
          type: string
          description: Sèrie/número de factura (`serie_final`)
        invoice_token:
          type: string
          description: Token de la factura
        invoice_date:
          type: string
          format: date
          description: Data d'emissió
        invoice_amount:
          type: number
          format: double
          description: Import pendent de pagament (`left_to_pay`)
        invoice_status:
          type: string
          description: Nom de l'estat de la factura
        status:
          type: object
          nullable: true
          description: |
            Estat de la factura com a objecte `{token, name}`. S'afegeix en paral·lel
            a `invoice_status`, que es manté per compatibilitat. És `null` si
            la factura no té estat assignat.
          properties:
            token:
              type: string
              nullable: true
              description: Token de l'estat (`InvoiceStatus.token`)
            name:
              type: string
              nullable: true
              description: Nom de l'estat (mateix valor que `invoice_status`)
          example:
            token: "3"
            name: Enviada
        payment_type:
          type: string
          nullable: true
          description: |
            Token de la forma de pagament de la factura (`payment_type_token_final`),
            el mateix que retorna `/ov/dictionary/payment-types/` (per exemple
            `DIRECT_DEBIT`, `CASH`, `BANK_TRANSFER`). És `null` si el token de la
            factura no correspon a cap forma de pagament del diccionari.
          example: DIRECT_DEBIT
        pdf_available:
          type: boolean
          description: Indica si el PDF està disponible segons la configuració `ov_pdf_from`
        is_returned:
          $ref: "#/components/schemas/InvoiceIsReturned"
        last_return:
          $ref: "#/components/schemas/InvoiceLastReturn"

    InvoiceIsReturned:
      type: boolean
      description: |
        `true` mentre algun rebut actiu de la factura continuï retornat pel
        banc (estat de rebut `payment_status_returned_token`). Torna a
        `false` quan el rebut deixa d'estar retornat (per exemple, quan
        es torna a cobrar). És el mateix
        criteri pel qual `POST /ov/invoice/return-request/` respon `409`.

        La factura no té un estat «retornada»: quan el banc retorna el
        rebut domiciliat, la factura torna a `Confirmada` (token `2`) si encara
        no ha vençut o a `Vencida` (token `-1`) si ja ha vençut, i passa a
        `Vencida` en arribar el venciment. La forma de pagament no canvia, llevat
        de les devolucions per compte no vàlid, en les quals la factura passa a
        pagament bancari.
      example: true
    InvoiceLastReturn:
      type: object
      nullable: true
      description: |
        Última devolució bancària d'un rebut actiu de la factura, encara que
        després s'hagi tornat a cobrar (en aquest cas `is_returned` és `false`).
        `null` si la factura no ha tingut cap devolució.
      properties:
        date:
          type: string
          format: date
          nullable: true
          description: Data de la devolució
        reason:
          type: object
          nullable: true
          description: |
            Motiu de la devolució; `null` si no consta. `code` és el codi
            del motiu (a les devolucions SEPA, el codi ISO, p. ex. `AM04`).
          properties:
            code:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
      example:
        date: "2026-02-10"
        reason:
          code: AM04
          name: Fondos insuficientes

    InvoicePaidRequest:
      type: object
      required:
        - contract_token
        - invoice_token
      properties:
        contract_token:
          type: string
        invoice_token:
          type: string

    InvoicePaidResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        invoice_token:
          type: string
        new_status:
          type: string
          nullable: true
          description: Nom del nou estat de la factura
        already_paid:
          type: boolean
          description: La factura ja estava pagada abans de la crida (no s'ha canviat res)

    PendingRemittanceConflict:
      type: object
      required:
        - error
        - reason
      properties:
        error:
          type: string
        reason:
          type: string
          enum:
            - pending_remittance

    QuickPayRequest:
      type: object
      required:
        - contract_number
        - invoice_number
        - amount
      properties:
        contract_number:
          type: string
          description: Token del contracte (`Contract.token`), el número que figura a la factura
          example: "3451189"
        invoice_number:
          type: string
          description: Número oficial de la factura (`Invoice.serie_final`), el imprès al PDF
          example: FC/202609/000001
        amount:
          type: number
          format: double
          description: |
            Import total exacte imprès a la factura (`Invoice.total_final`).
            Ha de coincidir al cèntim (màxim dos decimals i positiu).
          example: 101.73

    QuickPayStatus:
      type: object
      nullable: true
      description: Estat de la factura com a objecte `{token, name}`
      properties:
        token:
          type: string
          nullable: true
          description: Token de l'estat (`InvoiceStatus.token`)
        name:
          type: string
          nullable: true
          description: Nom de l'estat

    QuickPayResponse:
      type: object
      properties:
        contract_token:
          type: string
          description: Token del contracte, necessari per a `POST /ov/invoice/paid/`
        invoice_token:
          type: string
          description: Token de la factura, necessari per a `POST /ov/invoice/paid/`
        invoice_number:
          type: string
          description: Número oficial de la factura (`serie_final`)
        issue_date:
          type: string
          format: date
          nullable: true
          description: Data d'emissió
        due_date:
          type: string
          format: date
          nullable: true
          description: Data de venciment
        invoice_amount:
          type: number
          format: double
          nullable: true
          description: Import total de la factura (`total_final`)
        left_to_pay:
          type: number
          format: double
          nullable: true
          description: Import pendent de pagament (`left_to_pay`)
        status:
          $ref: "#/components/schemas/QuickPayStatus"
        payable:
          type: boolean
          description: Sempre `true` en una resposta `200`

    QuickPayNotPayableResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Invoice is not payable
        status:
          $ref: "#/components/schemas/QuickPayStatus"
        left_to_pay:
          type: number
          format: double
          nullable: true
          description: Import pendent de pagament en el moment de la consulta
        reason:
          type: string
          enum:
            - pending_remittance
          description: Només si algun rebut és en una remesa pendent d'enviar

    ReturnRequest:
      type: object
      required:
        - invoice_token
        - contract_token
        - reason
      properties:
        invoice_token:
          type: string
          description: Token de la factura (`Invoice.token`)
          example: INV-001
        contract_token:
          type: string
          description: Token del contracte (`Contract.token`) al qual ha de pertànyer la factura
          example: "3451189"
        reason:
          type: string
          maxLength: 500
          description: Motiu de la devolució indicat per l'abonat
          example: Domiciliación devuelta por el banco

    ReturnRequestCategory:
      type: object
      description: Diccionari `{token, name}` d'estat o tipus d'incidència
      properties:
        token:
          type: string
          nullable: true
        name:
          type: string
          nullable: true

    ReturnRequestResponse:
      type: object
      required:
        - incident_token
        - invoice_token
        - contract_token
        - status
        - type
        - created_at
      properties:
        incident_token:
          type: string
          description: Token de la incidència creada (`Incident.token`)
        invoice_token:
          type: string
        contract_token:
          type: string
        status:
          $ref: "#/components/schemas/ReturnRequestCategory"
        type:
          $ref: "#/components/schemas/ReturnRequestCategory"
        created_at:
          type: string
          format: date-time

    ReturnRequestConflictResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Invoice is not paid
        status:
          $ref: "#/components/schemas/ReturnRequestCategory"
        incident_token:
          type: string
          nullable: true
          description: Token de la sol·licitud oberta existent (només en el cas duplicat)

    ContractProcedureRequest:
      type: object
      required:
        - holder_dni
        - property_token
        - procedure_type_token
        - payment_type_token
      properties:
        holder_dni:
          type: string
          description: |
            DNI del titular de la sol·licitud (`Person.token`). Si no correspon
            a cap persona existent, es crea el titular amb els camps
            `holder_*`, que llavors són obligatoris.
          example: "12345678A"
        holder_name:
          type: string
          nullable: true
          maxLength: 255
          description: |
            Nom (o raó social) del titular. Obligatori només si `holder_dni`
            no correspon a cap persona existent; si existeix, s'ignora.
        holder_surname:
          type: string
          nullable: true
          maxLength: 255
          description: |
            Cognoms del titular. Obligatori només si `holder_dni` no existeix i
            `holder_is_juridic` no és `true`; si el DNI existeix, s'ignora.
        holder_phone:
          type: string
          nullable: true
          maxLength: 20
          description: |
            Telèfon del titular. Obligatori només si `holder_dni` no existeix; si
            existeix, s'ignora.
        holder_email:
          type: string
          format: email
          nullable: true
          maxLength: 255
          description: |
            Correu electrònic del titular. Obligatori només si `holder_dni` no
            existeix; si existeix, s'ignora.
        holder_is_juridic:
          type: boolean
          default: false
          description: |
            Indica si el nou titular és una persona jurídica (llavors
            `holder_surname` és opcional). Només s'usa si `holder_dni` no existeix.
        holder_identification_type_token:
          type: string
          nullable: true
          maxLength: 255
          description: |
            Tipus d'identificació del nou titular (`IdentificationType.token`,
            p. ex. `dni`, `nie`, `cif`, `passport`, `other`). Opcional: si s'omet
            s'usa el tipus marcat per defecte; un token desconegut retorna `400`.
            Només s'usa si `holder_dni` no existeix.
          example: dni
        property_token:
          type: string
          description: Token de la propietat (`Property.token`) obtingut a `/ov/properties/`
          example: PROV-0001
        supply_point_token:
          type: string
          nullable: true
          description: |
            NIC del punt de subministrament (`SupplyPoint.token`). Obligatori només
            si la propietat té més d'un punt de subministrament actiu.
          example: "1234/1234"
        procedure_type_token:
          description: |
            Paquets de la contractació (`ContractRequestType.token`), en una
            llista de com a màxim 20; el primer és el tipus de la sol·licitud.
            Per compatibilitat, també s'accepta un sol token com a text.
          oneOf:
            - type: array
              minItems: 1
              maxItems: 20
              items:
                type: string
                maxLength: 255
            - type: string
              maxLength: 255
          example: [domestic, sewer_connection]
        payment_type_token:
          type: string
          description: Forma de pagament (`PaymentType.token`)
          example: DIRECT_DEBIT
        iban:
          type: string
          nullable: true
          description: Obligatori si `payment_type_token` és `DIRECT_DEBIT`
          example: ES9121000418450200051332
        iban_holder_name:
          type: string
          nullable: true
          description: Obligatori si `payment_type_token` és `DIRECT_DEBIT`
        iban_holder_dni:
          type: string
          nullable: true
          description: Obligatori si `payment_type_token` és `DIRECT_DEBIT`
        iban_holder_swift:
          type: string
          nullable: true
          maxLength: 11
          description: SWIFT/BIC del compte. Obligatori si `payment_type_token` és `DIRECT_DEBIT`
        language:
          type: string
          nullable: true
          enum:
            - ca
            - es
            - gl
            - en
          description: Idioma de la sol·licitud (per defecte el del sistema)
        observation:
          type: string
          nullable: true
          maxLength: 1000
          description: Observació que es registra a l'historial d'estats
        sepa_signed:
          type: string
          format: byte
          nullable: true
          description: |
            Mandat SEPA signat: contingut del PDF en base64 (fins a 10 MB
            descodificat; s'ignoren els salts de línia). Només amb
            `payment_type_token` = `DIRECT_DEBIT`. Buit o `null`: sense mandat.
          example: JVBERi0xLjQKJcfsj6IKNSAwIG9iago8PC9MZW5ndGggNiAwIFI+PgpzdHJlYW0K...
        sepa_signed_filename:
          type: string
          nullable: true
          maxLength: 100
          description: |
            Nom del fitxer del mandat. S'eliminen les rutes i els
            caràcters no vàlids i s'afegeix `.pdf` si no el porta. Si no
            s'envia: `mandat_sepa_signat.pdf`.
          example: mandato_sepa_firmado.pdf

    ContractProcedureResponse:
      type: object
      required:
        - contract_request_token
        - status
        - type
        - person
        - supply_point
        - payment
        - created_at
      properties:
        contract_request_token:
          type: string
          description: Token de la sol·licitud creada (`ContractRequest.token`)
        status:
          $ref: "#/components/schemas/DictionaryItem"
        type:
          $ref: "#/components/schemas/DictionaryItem"
        person:
          type: object
          properties:
            token:
              type: string
            name:
              type: string
              nullable: true
        supply_point:
          type: object
          properties:
            token:
              type: string
        payment:
          type: object
          properties:
            iban:
              type: string
              description: IBAN emmascarat (8 primers + asteriscos + 8 darrers); buit si no hi ha compte
        created_at:
          type: string
          format: date-time

    ContractRequestStatusResponse:
      type: object
      required:
        - contract_request_token
        - status
        - type
        - contract_token
        - created_at
        - supply_point
        - person
      properties:
        contract_request_token:
          type: string
          description: Token de la sol·licitud de contracte (`ContractRequest.token`)
        status:
          allOf:
            - $ref: "#/components/schemas/DictionaryItem"
          nullable: true
          description: Estat actual de la sol·licitud; `null` si no té estat assignat
        type:
          allOf:
            - $ref: "#/components/schemas/DictionaryItem"
          nullable: true
          description: Tipus de tràmit; `null` si no té tipus assignat
        contract_token:
          type: string
          nullable: true
          description: |
            Token del contracte creat; `null` mentre la sol·licitud segueixi
            pendent o sense contracte enllaçat (`Contract.contract_request_id`).
        created_at:
          type: string
          format: date-time
        supply_point:
          type: object
          nullable: true
          properties:
            token:
              type: string
        person:
          type: object
          nullable: true
          description: Persona sol·licitant
          properties:
            token:
              type: string
            name:
              type: string
              nullable: true

    ContractProcedureConflictResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Contract request already exists
        contract_request_token:
          type: string
          nullable: true
          description: Token de la sol·licitud oberta existent

    ContractTerminationProcedureRequest:
      type: object
      required:
        - contract_token
        - holder_dni
        - reason_token
      properties:
        contract_token:
          type: string
          maxLength: 255
          description: Token del contracte a donar de baixa
          example: "00012345"
        holder_dni:
          type: string
          maxLength: 255
          description: Document del titular del contracte (es normalitza)
          example: "12345678Z"
        observation:
          type: string
          nullable: true
          maxLength: 1000
          description: Text lliure sobre la baixa (es desa com a observació de la sol·licitud)
          example: Cambio de domicilio
        reason_token:
          type: string
          maxLength: 255
          description: Token del tipus de baixa (el «Motiu» de la plataforma de gestió).
          example: "1"

    ContractTerminationProcedureResponse:
      type: object
      required:
        - contract_termination_token
        - contract_token
        - status
        - type
        - created_at
      properties:
        contract_termination_token:
          type: string
          description: Token de la sol·licitud de baixa creada
          example: "261105001"
        contract_token:
          type: string
          example: "00012345"
        status:
          $ref: "#/components/schemas/DictionaryItem"
        type:
          $ref: "#/components/schemas/DictionaryItem"
        created_at:
          type: string
          format: date-time

    ContractTerminationProcedureConflictResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - Contract already terminated
            - Contract termination already exists
        contract_termination_token:
          type: string
          description: Token de la sol·licitud de baixa oberta existent (només a `Contract termination already exists`)

    ContractChangeOutgoing:
      type: object
      description: Contracte actual i titular sortint
      required:
        - contract_token
        - holder_dni
      properties:
        contract_token:
          type: string
          maxLength: 255
          example: "00012345"
        holder_dni:
          type: string
          maxLength: 255
          description: Document del titular actual (es normalitza)
          example: "12345678Z"
        reason_token:
          type: string
          nullable: true
          maxLength: 255
          description: |
            Token del tipus de baixa (qualsevol tipus existent). Opcional: si
            s'omet, és nul o és buit s'usa el tipus de baixa de canvi de
            nom. Un token inexistent retorna `400`.
          example: "4"
        observation:
          type: string
          nullable: true
          maxLength: 1000
          description: Observació de la sol·licitud de baixa

    ContractChangeIncoming:
      type: object
      description: Nou titular, tipus de tràmit i forma de pagament
      required:
        - holder_dni
        - procedure_type_token
        - payment_type_token
      properties:
        holder_dni:
          type: string
          maxLength: 255
          description: |
            Document del nou titular (diferent de l'actual). Si no
            correspon a cap persona existent, es crea el titular amb els
            camps `holder_*`, que llavors són obligatoris.
          example: "87654321Y"
        holder_name:
          type: string
          nullable: true
          maxLength: 255
          description: |
            Nom (o raó social) del titular. Obligatori només si `holder_dni`
            no correspon a cap persona existent; si existeix, s'ignora.
        holder_surname:
          type: string
          nullable: true
          maxLength: 255
          description: |
            Cognoms del titular. Obligatori només si `holder_dni` no existeix i
            `holder_is_juridic` no és `true`; si el DNI existeix, s'ignora.
        holder_phone:
          type: string
          nullable: true
          maxLength: 20
          description: |
            Telèfon del titular. Obligatori només si `holder_dni` no existeix; si
            existeix, s'ignora.
        holder_email:
          type: string
          format: email
          nullable: true
          maxLength: 255
          description: |
            Correu electrònic del titular. Obligatori només si `holder_dni` no
            existeix; si existeix, s'ignora.
        holder_is_juridic:
          type: boolean
          default: false
          description: |
            Indica si el nou titular és una persona jurídica (llavors
            `holder_surname` és opcional). Només s'usa si `holder_dni` no existeix.
        holder_identification_type_token:
          type: string
          nullable: true
          maxLength: 255
          description: |
            Tipus d'identificació del nou titular (`IdentificationType.token`,
            p. ex. `dni`, `nie`, `cif`, `passport`, `other`). Opcional: si s'omet
            s'usa el tipus marcat per defecte; un token desconegut retorna `400`.
            Només s'usa si `holder_dni` no existeix.
          example: dni
        procedure_type_token:
          type: string
          maxLength: 255
          description: Token d'un tipus de sol·licitud actiu (`/ov/dictionary/contract-request-types/`)
          example: domestic
        payment_type_token:
          type: string
          maxLength: 255
          description: Token de la forma de pagament (`/ov/dictionary/payment-types/`)
          example: DIRECT_DEBIT
        iban:
          type: string
          nullable: true
          maxLength: 34
          description: Obligatori si la forma de pagament és `DIRECT_DEBIT`
        iban_holder_name:
          type: string
          nullable: true
          maxLength: 255
          description: Obligatori si la forma de pagament és `DIRECT_DEBIT`
        iban_holder_dni:
          type: string
          nullable: true
          maxLength: 255
          description: Obligatori si la forma de pagament és `DIRECT_DEBIT`
        iban_holder_swift:
          type: string
          nullable: true
          maxLength: 11
          description: Obligatori si la forma de pagament és `DIRECT_DEBIT`
        language:
          type: string
          nullable: true
          maxLength: 2
          description: Idioma del nou contracte (per defecte el del sistema)
          example: es
        observation:
          type: string
          nullable: true
          maxLength: 1000
          description: Observació de la sol·licitud d'alta

    ContractChangeProcedureRequest:
      type: object
      required:
        - outgoing
        - incoming
      properties:
        outgoing:
          $ref: "#/components/schemas/ContractChangeOutgoing"
        incoming:
          $ref: "#/components/schemas/ContractChangeIncoming"

    ContractChangeProcedureResponse:
      type: object
      required:
        - contract_request_token
        - contract_termination_token
        - contract_token
        - contract_request_status
        - contract_termination_status
        - procedure_type
        - termination_type
        - created_at
      properties:
        contract_request_token:
          type: string
          description: Token de la sol·licitud d'alta (canvi de nom); consultable a `/ov/procedures/contract/{contract_request_token}/`
        contract_termination_token:
          type: string
          description: Token de la sol·licitud de baixa del contracte actual
        contract_token:
          type: string
        contract_request_status:
          $ref: "#/components/schemas/DictionaryItem"
        contract_termination_status:
          $ref: "#/components/schemas/DictionaryItem"
        procedure_type:
          $ref: "#/components/schemas/DictionaryItem"
        termination_type:
          $ref: "#/components/schemas/DictionaryItem"
        created_at:
          type: string
          format: date-time

    ContractChangeProcedureConflictResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - Contract already terminated
            - Contract termination already exists
            - Contract request already exists
            - Contract has no supply point
        contract_termination_token:
          type: string
          description: Només a `Contract termination already exists`
        contract_request_token:
          type: string
          description: Només a `Contract request already exists`

    BilledConsumption:
      type: object
      properties:
        timestamp:
          type: string
          format: date
          description: Data d'emissió de la factura
        consumptions:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceConsumption"

    InvoiceConsumption:
      type: object
      properties:
        meter:
          type: string
          description: Número de sèrie del comptador (camp code del comptador)
        reading:
          oneOf:
            - type: number
              format: double
            - type: string
          description: Valor de lectura (buit si no hi ha lectura associada)
        consumption:
          type: number
          format: double
          nullable: true
        origin:
          type: string
        contract_number:
          type: string
        is_estimated:
          type: boolean

    InvoicePdfResponse:
      type: object
      properties:
        pdf:
          type: string
          format: byte
          description: Contingut del PDF codificat en Base64
        filename:
          type: string
          description: Nom de fitxer suggerit per a la baixada
        document_name:
          type: string
          description: Nom del document al gestor documental

    CreateReadingRequest:
      type: object
      required:
        - reading_at
        - contract
        - meter
        - reading
      properties:
        reading_at:
          type: string
          format: date
          description: Data de la lectura (format YYYY-MM-DD)
        contract:
          type: string
          description: Token del contracte
        meter:
          type: string
          description: Número de sèrie del comptador (camp code del comptador)
        reading:
          type: number
          format: double
          description: Valor de la lectura del comptador

    CreateReadingResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        reading_token:
          type: string
        reading_value:
          type: string
        reading_date:
          type: string
          format: date
        contract_token:
          type: string
          nullable: true
        meter_token:
          type: string
          nullable: true
        supply_point_token:
          type: string
          nullable: true

    ContractListResponse:
      type: object
      description: Envoltori paginat de la llista de contractes.
      required:
        - count
        - page
        - limit
        - total_pages
        - results
      properties:
        count:
          type: integer
          description: Nombre total de contractes que compleixen els filtres
        page:
          type: integer
          description: Pàgina actual
        limit:
          type: integer
          description: Mida de pàgina aplicada
        total_pages:
          type: integer
          description: Nombre total de pàgines
        results:
          type: array
          items:
            $ref: "#/components/schemas/ContractListItem"

    ContractListItem:
      type: object
      required:
        - token
        - status_token
        - payment_type
        - contract_holder
        - allowed_actions
        - is_account_holder
      properties:
        token:
          type: string
          nullable: true
          description: Token del contracte, utilitzable com a `contract_token` a la resta d'endpoints `/ov/`
        status_token:
          type: string
          nullable: true
          description: Token de l'estat del contracte (`ContractStatus.token`)
        status_name:
          type: string
          nullable: true
          description: Nom de l'estat del contracte
        status:
          type: object
          nullable: true
          description: Estat del contracte com a objecte, afegit sense retirar els camps antics
          properties:
            token:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
        payment_type:
          type: string
          nullable: true
          description: Token del tipus de pagament (`PaymentType.token`)
        contract_holder:
          allOf:
            - $ref: "#/components/schemas/ContractHolder"
          nullable: true
          description: Titular del contracte; `null` si el contracte no té titular assignat
        direct_debit_holder:
          allOf:
            - $ref: "#/components/schemas/ContractDebitHolder"
          nullable: true
          description: Titular de la domiciliació; `null` si el contracte no té IBAN associat
        allowed_actions:
          type: array
          description: |
            Accions habilitades per a aquest contracte concret, calculades segons el seu estat
            i el seu tipus de pagament. Llista buida si no hi ha cap acció disponible.
          items:
            type: string
          example:
            - consultar_datos_facturacion
            - actualizar_iban
            - registrar_lectura
        is_account_holder:
          type: boolean
          description: |
            `true` si el `dni` rebut coincideix amb el titular del compte de
            domiciliació. En aquest endpoint el `dni` és obligatori, per la qual cosa la
            clau sempre és present.
          example: true

    ContractHolder:
      type: object
      required:
        - dni
      properties:
        dni:
          type: string
          nullable: true
          description: DNI/NIF del titular (`Person.token`)
        nombre:
          type: string
          nullable: true
          description: Nom i cognoms del titular

    ContractDebitHolder:
      type: object
      required:
        - dni
      properties:
        dni:
          type: string
          nullable: true
          description: DNI/NIF del titular del compte bancari (`PersonBank.dni`)
        nombre:
          type: string
          nullable: true
          description: Nom del titular del compte bancari (`PersonBank.name`)
        iban:
          type: string
          description: IBAN emmascarat (8 primers caràcters + asteriscos + 8 darrers)

    ContractFullDetail:
      description: |
        Detall complet d'un contracte: els camps de `ContractDetail` i
        `BillingData` en un únic objecte, més les dades del compte de
        domiciliació. Es defineix com a esquema propi en lloc de compondre's amb
        `allOf` perquè `iban` s'ha de descriure de manera condicional i `allOf`
        no permet sobreescriure la descripció heretada dels seus esquemes base.
      type: object
      properties:
        token:
          type: string
          description: Token del contracte
        status_token:
          type: string
          nullable: true
          description: Token de l'estat del contracte
        status_name:
          type: string
          nullable: true
          description: Nom de l'estat del contracte
        status:
          type: object
          nullable: true
          description: |
            Estat del contracte com a objecte `{token, name}`. S'afegeix en paral·lel
            a `status_token` i `status_name`, que es mantenen per
            compatibilitat. És `null` si el contracte no té estat assignat.
          properties:
            token:
              type: string
              nullable: true
              description: Token de l'estat (mateix valor que `status_token`)
            name:
              type: string
              nullable: true
              description: Nom de l'estat (mateix valor que `status_name`)
          example:
            token: "1"
            name: Activo
        holder_token:
          type: string
          nullable: true
          description: NIF/document del titular
        payment_type:
          type: string
          nullable: true
          description: Token del tipus de pagament
        use_type:
          type: string
          nullable: true
          description: Tipus d'ús del contracte
        last_invoice_date:
          type: string
          format: date-time
          nullable: true
          description: Data de creació de l'última factura
        supply_point_address:
          type: string
          nullable: true
          description: Adreça del punt de subministrament per defecte
        meter_serial_number:
          type: string
          nullable: true
          description: Número de sèrie del comptador (camp code del comptador)
        meter_caliber:
          type: string
          nullable: true
          description: Calibre del comptador
        smart_metering:
          type: string
          enum: ["true", "false"]
          description: Indica si el comptador té telelectura
        registration_date:
          type: string
          nullable: true
          description: Data d'alta en format dd/mm/aaaa
        termination_date:
          type: string
          nullable: true
          description: Data de baixa en format dd/mm/aaaa (si el contracte està donat de baixa)
        nif:
          type: string
          description: NIF del titular
        tenant_name:
          type: string
          description: Nom complet del titular
        holder_name:
          type: string
          description: Nom complet del titular
        has_sepa_document:
          type: boolean
          description: |
            `true` si la forma de pagament del contracte té un mandat SEPA
            signat arxivat (`GeneralPaymentSepaDocument`); `false` si no hi ha
            mandat o el contracte no té forma de pagament.
        city:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        paper_invoice:
          type: string
          enum: ["true", "false"]
          description: "`true` si rep factura en paper, `false` si és digital"
        email:
          type: string
        invoice_language:
          type: string
          description: Idioma de factura (configuració del desplegament)
        phone1:
          type: string
        phone2:
          type: string
        account_holder_dni:
          type: string
          nullable: true
          description: DNI/NIF del titular del compte de domiciliació (`PersonBank.dni`); `null` si el contracte no té IBAN associat o el compte no emmagatzema DNI
        is_account_holder:
          type: boolean
          description: |
            `true` si el paràmetre de consulta `dni` coincideix amb el titular del
            compte de domiciliació (normalitzat: sense espais i en majúscules).
            **Només apareix a la resposta si s'envia `dni`**; sense `dni` la clau
            s'omet per complet. El frontend utilitza aquest indicador per aplicar la
            lògica d'anonimització; si és `false`, s'està veient el compte d'una altra
            persona.
          example: true
        is_holder:
          type: boolean
          description: |
            `true` si el paràmetre de consulta `dni` coincideix amb el DNI/NIF del
            titular del contracte (`Contract.holder.token`, normalitzat: sense
            espais i en majúscules). **Només apareix a la resposta si s'envia
            `dni`**; sense `dni` la clau s'omet per complet.
          example: true
        is_payer:
          type: boolean
          description: |
            `true` si el paràmetre de consulta `dni` coincideix amb el titular del
            compte de domiciliació (normalitzat). **Només apareix a la resposta
            si s'envia `dni`**; sense `dni` la clau s'omet per complet. És un
            àlies explícit de la mateixa comprovació que `is_account_holder`.
          example: true
        holder_address:
          type: string
          nullable: true
          description: Adreça postal del titular del contracte (`PersonAddress` amb `is_billing` actiu); no confondre amb `supply_point_address`, que és l'adreça del punt de subministrament
        iban:
          type: string
          description: IBAN del compte de domiciliació. Es retorna sense emmascarar només quan s'envia el paràmetre `dni` i aquest coincideix amb el titular del compte (és a dir, `is_account_holder` és `true`); en qualsevol altre cas apareix emmascarat (8 primers caràcters + asteriscos + 8 darrers)

    ContractByNic:
      description: |
        Resposta de `GET /ov/contract/by-nic/{nic}/`: el detall complet del
        contracte (`ContractFullDetail`) més `contract_token`.
      allOf:
        - $ref: "#/components/schemas/ContractFullDetail"
        - type: object
          required:
            - contract_token
          properties:
            contract_token:
              type: string
              description: Token del contracte (`Contract.token`, idèntic al camp `token`); és el valor que el frontend passa com a `?contract_token=` a la resta d'endpoints
              example: CTR-001

    InvoiceFullDetail:
      type: object
      description: |
        Detall complet d'una factura: camps bàsics més període de facturació,
        referència d'habitatge, adreça tributària (condicional), tarifes i desglossament fiscal.

        Estats condicionals de `tax_address`:

        - Factura **no domiciliada** (tipus de pagament diferent de `DIRECT_DEBIT`): el camp
          `tax_address` no apareix a la resposta.
        - Domiciliada i pagador = titular del contracte: `is_anonymized: false` i adreça
          completa (`address`, `postal_code`, `city`, `province`, `country`).
        - Domiciliada i pagador tercer: `is_anonymized: true`; s'omet `address` i només
          s'exposen `postal_code`, `city`, `province` i `country`.
      properties:
        contract_number:
          type: string
          description: Token del contracte
        invoice_token:
          type: string
          description: Token de la factura
        invoice_number:
          type: string
          description: Sèrie/número de factura (`serie_final`)
        invoice_date:
          type: string
          format: date
          description: Data d'emissió (`issue_date`)
        invoice_status:
          type: string
          description: Nom de l'estat de la factura
        status:
          type: object
          nullable: true
          description: |
            Estat de la factura com a objecte `{token, name}`. S'afegeix en paral·lel
            a `invoice_status`, que es manté per compatibilitat. És `null` si
            la factura no té estat assignat.
          properties:
            token:
              type: string
              nullable: true
              description: Token de l'estat (`InvoiceStatus.token`)
            name:
              type: string
              nullable: true
              description: Nom de l'estat (mateix valor que `invoice_status`)
          example:
            token: "3"
            name: Enviada
        due_date:
          type: string
          format: date
          nullable: true
          description: Data de venciment (`due_date`); `null` si no està definida
        invoice_amount:
          type: number
          format: double
          description: Import pendent de pagament (`left_to_pay`)
        total_amount:
          type: number
          format: double
          description: Import total de la factura (`total_final`)
        subtotal_amount:
          type: number
          format: double
          description: Base imposable (`subtotal_final`)
        payment_method:
          type: string
          nullable: true
          description: Nom del mètode de pagament (`payment_type_final`)
        payment_type:
          type: string
          nullable: true
          description: |
            Token de la forma de pagament de la factura (`payment_type_token_final`),
            el mateix que retorna `/ov/dictionary/payment-types/` (per exemple
            `DIRECT_DEBIT`, `CASH`, `BANK_TRANSFER`). És `null` si el token de la
            factura no correspon a cap forma de pagament del diccionari.
            `payment_method` (nom) es manté per compatibilitat.
          example: DIRECT_DEBIT
        pdf_available:
          type: boolean
          description: Indica si el PDF està disponible segons la configuració `ov_pdf_from`
        is_returned:
          $ref: "#/components/schemas/InvoiceIsReturned"
        last_return:
          $ref: "#/components/schemas/InvoiceLastReturn"
        billing_period:
          type: object
          description: Període de facturació de la factura
          properties:
            year:
              type: integer
              nullable: true
            month:
              type: integer
              nullable: true
            days:
              type: integer
              nullable: true
        dwelling_code:
          type: string
          nullable: true
          description: Referència del codi d'habitatge del punt de subministrament; `null` si no està disponible
        tax_address:
          type: object
          nullable: true
          description: |
            Adreça tributària del pagador. La seva presència i contingut depenen del tipus
            de pagament i del pagador (vegeu les notes condicionals de `InvoiceFullDetail`).
            Només s'exposa si la factura està domiciliada; s'anonimitza si el pagador és
            un tercer.
          properties:
            is_anonymized:
              type: boolean
              description: "`true` quan el pagador és un tercer (no titular del contracte); en aquest cas `address` s'omet"
            postal_code:
              type: string
            city:
              type: string
            province:
              type: string
              nullable: true
            country:
              type: string
              nullable: true
            address:
              type: string
              nullable: true
              description: Adreça del carrer; només s'exposa quan `is_anonymized` és `false`
        direct_debit_account:
          type: object
          nullable: true
          description: |
            Compte de cobrament d'**aquesta** factura (no el compte actual del contracte, que pot
            haver canviat després). Sempre present; és `null` si la factura no està
            domiciliada o no té IBAN.

            El titular (`nombre`, `dni`) surt del pagador de la factura (`payer_final` /
            `payer_token_final`) o, si no en té (factures migrades), del compte bancari
            de persona amb el mateix IBAN (sense espais i en majúscules): primer el compte
            actual del contracte si coincideix, després el del titular del contracte o de la
            persona de la factura i, si només hi ha un NIF possible, aquest. Si no es pot resoldre
            sense ambigüitat, `nombre` i `dni` són `null`.

            El `dni` s'**emmascara** (criteri AEPD: 4 xifres centrals visibles, mateixa
            longitud; menys de 9 caràcters, tot asteriscs) quan el NIF del titular del
            compte és diferent del de la persona de la factura (`customer_token_final`), és
            a dir, quan paga un tercer. El nom sempre es mostra.
          properties:
            iban:
              type: string
              description: IBAN emmascarat (8 primers + asteriscs + 8 últims)
              example: "ES912100********00051332"
            nombre:
              type: string
              nullable: true
              description: Nom del titular del compte
            dni:
              type: string
              nullable: true
              description: NIF del titular del compte; emmascarat si és un tercer
              example: "***4567**"
        tariffs:
          type: array
          description: Tarifes aplicades a la factura (línies de factura)
          items:
            $ref: "#/components/schemas/TariffDetail"
        fiscal_breakdown:
          type: array
          description: |
            Desglossament fiscal del rebut per organització (p. ex.:
            empresa gestora, ajuntament, EDAR, consorci i agència de l'aigua). Calculat
            íntegrament pel backend a partir de la distribució fiscal de les línies.
            Les organitzacions depenen del desplegament.
          items:
            $ref: "#/components/schemas/FiscalBreakdownItem"

    TariffDetail:
      type: object
      description: Tarifa aplicada en una línia de factura, amb la seva normativa de referència
      properties:
        name:
          type: string
          description: Nom de la tarifa/línia (`price_rate_name`)
        description:
          type: string
          nullable: true
          description: Descripció de la línia
        units:
          type: number
          nullable: true
          description: Nombre d'unitats facturades
        unit_price:
          type: number
          nullable: true
          description: Preu unitari
        tax_percent:
          type: number
          nullable: true
          description: Percentatge d'impost aplicat
        total:
          type: number
          description: Import total de la línia (base + impost)
        normativa:
          type: object
          nullable: true
          description: Normativa (publicació oficial) en què es basa la tarifa
          properties:
            reference:
              type: string
              description: Referència de la normativa (p. ex. referència BOE)
            name:
              type: string
              nullable: true
              description: Nom de la normativa

    FiscalBreakdownItem:
      type: object
      description: Desglossament fiscal del rebut per a una organització
      properties:
        organization:
          type: string
          description: Nom de l'organització receptora
        amount:
          type: number
          format: double
          description: Import de la distribució fiscal per a l'organització

    MeterDetail:
      type: object
      description: >
        Detall del comptador del contracte per al bloc de cinc camps
        de l'Oficina Virtual. El comptador procedeix del punt de subministrament per
        defecte (`supply_point_default.meter`).
      properties:
        meter_serial_number:
          type: string
          nullable: true
          description: Número de sèrie del comptador (camp code del comptador)
        meter_caliber:
          type: string
          nullable: true
          description: Calibre del comptador
        digits:
          type: integer
          nullable: true
          description: Xifres del comptador
        manufacture_year:
          type: integer
          nullable: true
          description: Any de fabricació del comptador (`manufacturing_year`)
        installation_date:
          type: string
          format: date
          nullable: true
          description: Data d'instal·lació (`installation_at`)

    ConsumptionHistoryResponse:
      type: object
      description: Embolcall paginat estàndard de l'historial de consums.
      required:
        - count
        - next
        - previous
        - results
      properties:
        count:
          type: integer
          description: Nombre total de consums que compleixen els filtres
        next:
          type: string
          format: uri
          nullable: true
          description: URL de la pàgina següent (`null` a l'última pàgina)
        previous:
          type: string
          format: uri
          nullable: true
          description: URL de la pàgina anterior (`null` a la primera pàgina)
        results:
          type: array
          items:
            $ref: "#/components/schemas/ConsumptionHistoryItem"

    ConsumptionHistoryItem:
      type: object
      description: Consum d'un període del contracte en nomenclatura HF.
      required:
        - id
      properties:
        id:
          type: integer
          description: ID primari de la lectura (`Reading.id`), per vincular les files als checkboxes i sol·licitar baixades
          example: 42
        period:
          type: string
          description: Període de facturació en nomenclatura HF (`<any>-<trimestre>T`)
          example: "2025-3T"
        reading:
          type: number
          format: double
          nullable: true
          description: Lectura actual del període
        previous_reading:
          type: number
          format: double
          nullable: true
          description: Lectura anterior, resolta al backend (`Reading.previous_reading`)
        consumption:
          type: number
          format: double
          nullable: true
          description: Consum del període
        reading_date:
          type: string
          format: date
          nullable: true
          description: Data de la lectura del període
        is_estimated:
          type: boolean
          description: Indica si la lectura del període és estimada

    ConsumptionDownloadRequest:
      type: object
      description: |
        Sol·licitud de baixada de l'historial de consums. `reading_ids` i els
        filtres de data són mútuament excloents a la pràctica: si es passen
        `reading_ids` s'ignoren `date_from`/`date_to`; si no, s'usen els
        filtres per generar el conjunt complet.
      required:
        - contract_token
      properties:
        contract_token:
          type: string
          description: Token del contracte (`Contract.token`)
          example: CTR-001
        dni:
          type: string
          nullable: true
          description: |
            DNI/NIF de la persona (opcional). Si s'indica, només s'inclouen
            les lectures facturades en factures del contracte on és titular
            o pagadora. Buit o nul equival a no indicar-lo.
          example: "12345678A"
        reading_ids:
          type: array
          description: ID de lectures seleccionades manualment (`Reading.id`)
          items:
            type: integer
          example: [42, 43, 44]
        date_from:
          type: string
          format: date
          description: Data mínima de lectura (inclosa), `YYYY-MM-DD`
          example: "2025-01-01"
        date_to:
          type: string
          format: date
          description: Data màxima de lectura (inclosa), `YYYY-MM-DD`
          example: "2025-12-31"
        format:
          type: string
          enum: [pdf, csv, zip]
          default: pdf
          description: Format del fitxer generat
          example: pdf

    BillingPeriodItem:
      type: object
      description: |
        Període de facturació del contracte, definit pel seu facturador.
        `period_code` és una etiqueta (índex del cicle + sufix segons la
        periodicitat: `T` trimestral, `B` bimestral, `Q` quadrimestral,
        `S` semestral, `M` mensual, `A` anual; p. ex. `3T`) i `months_label`
        els mesos que inclou, per mostrar-los sense deduir-los al frontal.
        `month_from`/`year_from` i `month_to`/`year_to` delimiten el cicle (pot
        creuar d'any).
      required:
        - year
        - period_code
        - months_label
        - month_from
        - year_from
        - month_to
        - year_to
        - is_current
      properties:
        year:
          type: integer
          description: Any en què comença el cicle de facturació
          example: 2026
        period_code:
          type: string
          description: Etiqueta del període (p. ex. `1T`..`4T`, `1B`..`6B`, `1S`/`2S`)
          example: "3T"
        month_from:
          type: integer
          description: Mes (1-12) en què comença el cicle
          example: 7
        year_from:
          type: integer
          description: Any en què comença el cicle
          example: 2026
        month_to:
          type: integer
          description: Mes (1-12) en què acaba el cicle
          example: 9
        year_to:
          type: integer
          description: Any en què acaba el cicle
          example: 2026
        months_label:
          type: string
          description: Mesos naturals inclosos al període, llegibles
          example: "julio-septiembre"
        is_current:
          type: boolean
          description: |
            Indica si és el període de facturació en curs; el frontal l'usa
            per als avisos en configurar el mitjà de pagament.
          example: false

    SignedMandateUploadResponse:
      type: object
      required:
        - contract_token
        - success
      properties:
        contract_token:
          type: string
          description: Token del contracte al qual s'ha vinculat el mandat
          example: CTR-001
        success:
          type: boolean
          description: Confirmació que el document s'ha arxivat
          example: true

    CancelDirectDebitRequest:
      type: object
      required:
        - period
        - role
      properties:
        period:
          type: string
          description: Període de facturació des del qual s'aplica la cancel·lació
          example: "2026-3T"
        role:
          type: string
          description: Rol de qui sol·licita la cancel·lació
          example: TITULAR
        new_payment_type:
          type: string
          description: |
            Token del nou tipus de pagament sol·licitat (`PaymentType.token`).
            Opcional: si manca, s'usa el tipus per defecte `BANK_TRANSFER`.
          example: BANK_TRANSFER

    CancelDirectDebitResponse:
      type: object
      required:
        - contract_token
        - success
        - message
      properties:
        contract_token:
          type: string
          description: Token del contracte
          example: CTR-001
        success:
          type: boolean
          description: Confirmació que la cancel·lació s'ha tramitat
          example: true
        message:
          type: string
          description: |
            `Direct debit cancelled successfully.` quan s'ha aplicat el
            canvi; `Direct debit already cancelled.` quan el contracte ja
            tenia el tipus de pagament objectiu (resposta idempotent, sense
            canviar el contracte).
          example: Direct debit cancelled successfully.
        updated_invoices:
          type: array
          items:
            type: string
          description: |
            Tokens de les factures domiciliades pendents o retornades que han
            passat al nou tipus de pagament (buit si no n'hi havia cap).
          example:
            - INV-001

    ContractRequestTypeItem:
      type: object
      required:
        - token
        - name
        - has_persons
        - registration_tariffs
        - water_tariffs
        - change_of_name_tariffs
        - registration_price
        - change_of_name_price
      properties:
        token:
          type: string
          description: Identificador estable del tipus (valor de `procedure_type_token`)
          example: domestic
        name:
          type: string
          description: Etiqueta llegible per mostrar a l'usuari
          example: Doméstico
        has_persons:
          type: boolean
          description: Indica si el tipus requereix informar ocupants/residents
          example: true
        registration_tariffs:
          type: array
          description: Tarifes actives d'alta/contractació associades, amb el seu cost; `[]` si no n'hi ha
          items:
            $ref: "#/components/schemas/ContractRequestTypeTariff"
        water_tariffs:
          type: array
          description: Tarifes actives de consum d'aigua associades; `[]` si no n'hi ha
          items:
            $ref: "#/components/schemas/DictionaryItem"
        change_of_name_tariffs:
          type: array
          description: Tarifes actives de canvi de nom associades, amb el seu cost; `[]` si no n'hi ha
          items:
            $ref: "#/components/schemas/ContractRequestTypeTariff"
        registration_price:
          type: number
          format: float
          nullable: true
          description: Suma dels `price` de `registration_tariffs` (import sense impostos de l'alta); `0` si no hi ha tarifes, `null` si alguna no té preu fix
          example: 65.4
        change_of_name_price:
          type: number
          format: float
          nullable: true
          description: Suma dels `price` de `change_of_name_tariffs` (import sense impostos del canvi de titularitat); `0` si no hi ha tarifes, `null` si alguna no té preu fix
          example: 0

    ContractRequestTypeTariff:
      type: object
      description: Tarifa d'un tipus de sol·licitud amb el seu cost
      required:
        - token
        - name
        - type_price
        - price
      properties:
        token:
          type: string
          description: Token de la tarifa
          example: registration-domestic
        name:
          type: string
          description: Nom de la tarifa (o del producte si és genèric)
          example: Alta doméstica
        type_price:
          type: string
          enum: [fixed, variable]
          description: "`fixed` si tots els conceptes són imports fixos; `variable` si algun es tarifa per trams"
          example: fixed
        price:
          type: number
          format: float
          nullable: true
          description: Suma dels conceptes fixos (import unitari sense impostos); `null` si no hi ha conceptes fixos
          example: 65.4

    DictionaryItem:
      type: object
      required:
        - token
        - name
      properties:
        token:
          type: string
          description: Identificador estable del valor (el que espera l'API)
          example: "1"
        name:
          type: string
          description: Etiqueta llegible per mostrar a l'usuari
          example: Activo

    PropertyItem:
      type: object
      required:
        - token
        - address
      properties:
        token:
          type: string
          description: Token de la propietat (`Property.token`)
          example: PR-001
        address:
          type: string
          description: |
            Adreça completa ja formatada
            (`carrer, número, codi postal ciutat`).
          example: C/ Major, 123, 08001 Barcelona
        street_type:
          type: string
          nullable: true
          description: Abreviatura del tipus de via (`address_street.type.abbreviation`)
          example: C
        street_name:
          type: string
          nullable: true
          description: Nom de la via (`address_street.name`)
          example: Major
        street_number:
          type: integer
          nullable: true
          description: Número de la via (`address_street_number.number`)
          example: 123
        postal_code:
          type: string
          nullable: true
          description: Codi postal (`address_postal_code.code`)
          example: "08001"
        city:
          type: string
          nullable: true
          description: Municipi (`address_city.name`)
          example: Barcelona

    PropertyListResponse:
      type: object
      description: Embolcall paginat de l'autocompletat de propietats.
      required:
        - count
        - page
        - limit
        - total_pages
        - results
      properties:
        count:
          type: integer
          description: Nombre total de propietats que compleixen la cerca
        page:
          type: integer
          description: Pàgina actual
        limit:
          type: integer
          description: Mida de pàgina aplicada
        total_pages:
          type: integer
          description: Nombre total de pàgines
        results:
          type: array
          items:
            $ref: "#/components/schemas/PropertyItem"

    SupplyPointAddressItem:
      type: object
      required:
        - address
        - supply_points
      properties:
        address:
          type: string
          description: |
            Adreça completa ja formatada, amb escala, edifici, pis,
            porta i ampliació (`Address.__str__`). Si el número té
            sufix, es mostra amb guió (`21-A`) encara que el número sigui de
            tipus `N`.
          example: C. Major, 21 Esc. A 2n-1a, Barcelona
        street_type:
          type: string
          nullable: true
          description: Abreviatura del tipus de via (`street.type.abbreviation`)
          example: C
        street_name:
          type: string
          nullable: true
          description: Nom de la via (`street.name`)
          example: Major
        street_number:
          type: integer
          nullable: true
          description: |
            Número de la via (`street_number.number`). `null` als `S/N`,
            que no mostren el número.
          example: 21
        street_number_suffix:
          type: string
          nullable: true
          description: Sufix del número (`street_number.number_suffix`), p. ex. `A`
          example: A
        stair:
          type: string
          nullable: true
          description: Escala
          example: A
        building:
          type: string
          nullable: true
          description: Edifici
        floor:
          type: string
          nullable: true
          description: Pis
          example: 2n
        door:
          type: string
          nullable: true
          description: Porta
          example: 1a
        address_extra:
          type: string
          nullable: true
          description: Ampliació de l'adreça (local, bar...)
        postal_code:
          type: string
          nullable: true
          description: Codi postal
          example: "08001"
        city:
          type: string
          nullable: true
          description: Municipi (`city.name` o, si no n'hi ha, `city_name`)
          example: Barcelona
        supply_points:
          type: array
          description: |
            Punts de subministrament amb aquesta adreça (actius o de baixa),
            ordenats per token.
          items:
            type: object
            required:
              - token
            properties:
              token:
                type: string
                nullable: true
                description: Token del punt de subministrament (`SupplyPoint.token`)
                example: SP-001
              property_token:
                type: string
                nullable: true
                description: Token de la finca del punt (`Property.token`)
                example: PR-001

    SupplyPointAddressListResponse:
      type: object
      description: Embolcall paginat de l'autocompletat d'adreces.
      required:
        - count
        - page
        - limit
        - total_pages
        - results
      properties:
        count:
          type: integer
          description: Nombre total d'adreces que compleixen la cerca
        page:
          type: integer
          description: Pàgina actual
        limit:
          type: integer
          description: Mida de pàgina aplicada
        total_pages:
          type: integer
          description: Nombre total de pàgines
        results:
          type: array
          items:
            $ref: "#/components/schemas/SupplyPointAddressItem"

    ProcedureTariffItem:
      type: object
      required:
        - token
        - name
        - type_price
        - price
        - price_table
        - components
      properties:
        token:
          type: string
          description: Token de la tarifa (`PriceRate.token`)
          example: TR-001
        name:
          type: string
          nullable: true
          description: |
            Nom de la tarifa (`PriceRate.name`); si és genèric (`GENERAL`)
            o buit, es resol amb el nom del producte associat
            (`Product.name`).
          example: Tarifa 2.0TD
        type_price:
          type: string
          enum:
            - fixed
            - variable
          description: |
            `variable` si algun concepte de la tarifa es tarifa per trams
            (`price_interval` o `price_variable`); `fixed` en cas contrari.
          example: variable
        price:
          type: number
          nullable: true
          description: |
            Suma dels imports dels conceptes fixos (import unitari sense
            impostos). `null` si la tarifa no té conceptes fixos.
          example: 100.0
        price_table:
          nullable: true
          description: |
            Taula del primer concepte variable (es prioritza `price_interval`
            sobre `price_variable`). `null` si la tarifa és fixa.
          allOf:
            - $ref: "#/components/schemas/ProcedureTariffPriceTable"
        components:
          type: array
          description: Desglossament complet dels conceptes actius de la tarifa
          items:
            $ref: "#/components/schemas/ProcedureTariffComponent"

    ProcedureTariffPriceTable:
      type: object
      required:
        - units
        - stretches
      properties:
        units:
          type: string
          enum:
            - m3
            - dm_met
            - dm_con
          description: |
            Dimensió del tram: `m3` (consum), `dm_met` (calibre del
            comptador) o `dm_con` (diàmetre de connexió).
          example: dm_met
        stretches:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureTariffStretch"

    ProcedureTariffStretch:
      type: object
      required:
        - name
        - min
        - max
        - price
        - proportional_price
      properties:
        name:
          type: string
          nullable: true
          description: Nom del tram
          example: Calibre 13
        min:
          type: integer
          nullable: true
          description: Límit inferior del tram
          example: 1
        max:
          type: integer
          nullable: true
          description: Límit superior del tram; `null` si és obert
          example: 13
        price:
          type: number
          nullable: true
          description: Import per unitat del tram, sense impostos
          example: 45.0
        proportional_price:
          type: number
          nullable: true
          description: Import proporcional del tram, sense impostos
          example: null

    ProcedureTariffComponent:
      type: object
      required:
        - token
        - name
        - type_price
        - price
        - price_table
      properties:
        token:
          type: string
          nullable: true
          description: Token del concepte (`LineItemType.token`)
          example: LIT-001
        name:
          type: string
          nullable: true
          description: Nom del concepte
          example: Alta por calibre
        type_price:
          type: string
          enum:
            - fixed
            - variable
          description: Tipus de preu del concepte
          example: variable
        price:
          type: number
          nullable: true
          description: Import fix del concepte; `null` si és variable
          example: null
        price_table:
          nullable: true
          description: Taula de trams del concepte; `null` si és fix
          allOf:
            - $ref: "#/components/schemas/ProcedureTariffPriceTable"
