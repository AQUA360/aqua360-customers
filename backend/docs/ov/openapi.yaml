    InvoiceSummary:
      type: object
      properties:
        contract_number:
          type: string
          description: Token del contrato
        invoice_number:
          type: string
          description: Serie/número de factura (`serie_final`)
        invoice_token:
          type: string
          description: Token de la factura
        invoice_date:
          type: string
          format: date
          description: Fecha de emisión
        invoice_amount:
          type: number
          format: double
          description: Importe pendiente de pago (`left_to_pay`)
        invoice_status:
          type: string
          description: Nombre del estado de la factura
        status:
          type: object
          nullable: true
          description: |
            Estado de la factura como objeto `{token, name}`. Se añade en paralelo
            a `invoice_status`, que se mantiene por compatibilidad. Es `null` si
            la factura no tiene estado asignado.
          properties:
            token:
              type: string
              nullable: true
              description: Token del estado (`InvoiceStatus.token`)
            name:
              type: string
              nullable: true
              description: Nombre del estado (mismo valor que `invoice_status`)
          example:
            token: "3"
            name: Enviada
        pdf_available:
          type: boolean
          description: Indica si el PDF está disponible según la configuración `ov_pdf_from`

    InvoicePaidRequest:
      type: object
      required:
        - contract_token
        - invoice_token
      properties:
        contract_token:
          type: string
        invoice_token:
          type: string

    InvoicePaidResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        invoice_token:
          type: string
        new_status:
          type: string
          nullable: true
          description: Nombre del nuevo estado de la factura

    QuickPayRequest:
      type: object
      required:
        - contract_number
        - invoice_number
        - amount
      properties:
        contract_number:
          type: string
          description: Token del contrato (`Contract.token`), el número que figura en la factura
          example: "3451189"
        invoice_number:
          type: string
          description: Número oficial de la factura (`Invoice.serie_final`), el impreso en el PDF
          example: FC/202609/000001
        amount:
          type: number
          format: double
          description: |
            Importe total exacto impreso en la factura (`Invoice.total_final`).
            Debe coincidir al céntimo (máximo dos decimales y positivo).
          example: 101.73

    QuickPayStatus:
      type: object
      nullable: true
      description: Estado de la factura como objeto `{token, name}`
      properties:
        token:
          type: string
          nullable: true
          description: Token del estado (`InvoiceStatus.token`)
        name:
          type: string
          nullable: true
          description: Nombre del estado

    QuickPayResponse:
      type: object
      properties:
        contract_token:
          type: string
          description: Token del contrato, necesario para `POST /ov/invoice/paid/`
        invoice_token:
          type: string
          description: Token de la factura, necesario para `POST /ov/invoice/paid/`
        invoice_number:
          type: string
          description: Número oficial de la factura (`serie_final`)
        issue_date:
          type: string
          format: date
          nullable: true
          description: Fecha de emisión
        due_date:
          type: string
          format: date
          nullable: true
          description: Fecha de vencimiento
        invoice_amount:
          type: number
          format: double
          nullable: true
          description: Importe total de la factura (`total_final`)
        left_to_pay:
          type: number
          format: double
          nullable: true
          description: Importe pendiente de pago (`left_to_pay`)
        status:
          $ref: "#/components/schemas/QuickPayStatus"
        payable:
          type: boolean
          description: Siempre `true` en una respuesta `200`

    QuickPayNotPayableResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Invoice is not payable
        status:
          $ref: "#/components/schemas/QuickPayStatus"
        left_to_pay:
          type: number
          format: double
          nullable: true
          description: Importe pendiente de pago en el momento de la consulta

    ReturnRequest:
      type: object
      required:
        - invoice_token
        - contract_token
        - reason
      properties:
        invoice_token:
          type: string
          description: Token de la factura (`Invoice.token`)
          example: INV-001
        contract_token:
          type: string
          description: Token del contrato (`Contract.token`) al que debe pertenecer la factura
          example: "3451189"
        reason:
          type: string
          maxLength: 500
          description: Motivo de la devolución indicado por el abonado
          example: Domiciliación devuelta por el banco

    ReturnRequestCategory:
      type: object
      description: Diccionario `{token, name}` de estado o tipo de incidencia
      properties:
        token:
          type: string
          nullable: true
        name:
          type: string
          nullable: true

    ReturnRequestResponse:
      type: object
      required:
        - incident_token
        - invoice_token
        - contract_token
        - status
        - type
        - created_at
      properties:
        incident_token:
          type: string
          description: Token de la incidencia creada (`Incident.token`)
        invoice_token:
          type: string
        contract_token:
          type: string
        status:
          $ref: "#/components/schemas/ReturnRequestCategory"
        type:
          $ref: "#/components/schemas/ReturnRequestCategory"
        created_at:
          type: string
          format: date-time

    ReturnRequestConflictResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Invoice is not paid
        status:
          $ref: "#/components/schemas/ReturnRequestCategory"
        incident_token:
          type: string
          nullable: true
          description: Token de la solicitud abierta existente (solo en el caso duplicado)

    ContractProcedureRequest:
      type: object
      required:
        - holder_dni
        - property_token
        - procedure_type_token
        - tariff_token
        - payment_type_token
      properties:
        holder_dni:
          type: string
          description: DNI del titular de la solicitud (`Person.token`)
          example: "12345678A"
        property_token:
          type: string
          description: Token de la propiedad (`Property.token`) obtenido en `/ov/properties/`
          example: PROV-0001
        supply_point_token:
          type: string
          nullable: true
          description: |
            NIC del punto de suministro (`SupplyPoint.token`). Obligatorio solo
            si la propiedad tiene más de un punto de suministro activo.
          example: "1234/1234"
        procedure_type_token:
          type: string
          description: Tipo de solicitud de contrato (`ContractRequestType.token`)
          example: domestic
        tariff_token:
          type: string
          description: |
            Tarifa que la OV ha mostrado y cobrado (`PriceRate.token`). Es la
            fuente de verdad de la tarifa de la solicitud.
          example: TD-2.0TD
        payment_type_token:
          type: string
          description: Forma de pago (`PaymentType.token`)
          example: DIRECT_DEBIT
        iban:
          type: string
          nullable: true
          description: Obligatorio si `payment_type_token` es `DIRECT_DEBIT`
          example: ES9121000418450200051332
        iban_holder_name:
          type: string
          nullable: true
          description: Obligatorio si `payment_type_token` es `DIRECT_DEBIT`
        iban_holder_dni:
          type: string
          nullable: true
          description: Obligatorio si `payment_type_token` es `DIRECT_DEBIT`
        iban_holder_swift:
          type: string
          nullable: true
          maxLength: 11
          description: SWIFT/BIC de la cuenta. Obligatorio si `payment_type_token` es `DIRECT_DEBIT`
        language:
          type: string
          nullable: true
          enum:
            - ca
            - es
            - gl
            - en
          description: Idioma de la solicitud (por defecto el del sistema)
        observation:
          type: string
          nullable: true
          maxLength: 1000
          description: Observación que se registra en el historial de estados

    ContractProcedureResponse:
      type: object
      required:
        - contract_request_token
        - status
        - type
        - person
        - supply_point
        - payment
        - created_at
      properties:
        contract_request_token:
          type: string
          description: Token de la solicitud creada (`ContractRequest.token`)
        status:
          $ref: "#/components/schemas/DictionaryItem"
        type:
          $ref: "#/components/schemas/DictionaryItem"
        person:
          type: object
          properties:
            token:
              type: string
            name:
              type: string
              nullable: true
        supply_point:
          type: object
          properties:
            token:
              type: string
        payment:
          type: object
          properties:
            iban:
              type: string
              description: IBAN enmascarado (8 primeros + asteriscos + 8 últimos); vacío si no hay cuenta
        created_at:
          type: string
          format: date-time

    ContractProcedureConflictResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Contract request already exists
        contract_request_token:
          type: string
          nullable: true
          description: Token de la solicitud abierta existente

    BilledConsumption:
      type: object
      properties:
        timestamp:
          type: string
          format: date
          description: Fecha de emisión de la factura
        consumptions:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceConsumption"

    InvoiceConsumption:
      type: object
      properties:
        meter:
          type: string
          description: Token del contador
        reading:
          oneOf:
            - type: number
              format: double
            - type: string
          description: Valor de lectura (vacío si no hay lectura asociada)
        consumption:
          type: number
          format: double
          nullable: true
        origin:
          type: string
        contract_number:
          type: string
        is_estimated:
          type: boolean

    InvoicePdfResponse:
      type: object
      properties:
        pdf:
          type: string
          format: byte
          description: Contenido del PDF codificado en Base64
        filename:
          type: string
          description: Nombre de archivo sugerido para la descarga
        document_name:
          type: string
          description: Nombre del documento en el gestor documental

    CreateReadingRequest:
      type: object
      required:
        - reading_at
        - contract
        - meter
        - reading
      properties:
        reading_at:
          type: string
          format: date
          description: Fecha de la lectura (formato YYYY-MM-DD)
        contract:
          type: string
          description: Token del contrato
        meter:
          type: string
          description: Token del contador
        reading:
          type: number
          format: double
          description: Valor de la lectura del contador

    CreateReadingResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        reading_token:
          type: string
        reading_value:
          type: string
        reading_date:
          type: string
          format: date
        contract_token:
          type: string
          nullable: true
        meter_token:
          type: string
          nullable: true
        supply_point_token:
          type: string
          nullable: true

    ContractListResponse:
      type: object
      description: Envoltorio paginado de la lista de contratos.
      required:
        - count
        - page
        - limit
        - total_pages
        - results
      properties:
        count:
          type: integer
          description: Número total de contratos que cumplen los filtros
        page:
          type: integer
          description: Página actual
        limit:
          type: integer
          description: Tamaño de página aplicado
        total_pages:
          type: integer
          description: Número total de páginas
        results:
          type: array
          items:
            $ref: "#/components/schemas/ContractListItem"

    ContractListItem:
      type: object
      required:
        - token
        - status_token
        - payment_type
        - contract_holder
        - allowed_actions
        - is_account_holder
      properties:
        token:
          type: string
          nullable: true
          description: Token del contrato, utilizable como `contract_token` en el resto de endpoints `/ov/`
        status_token:
          type: string
          nullable: true
          description: Token del estado del contrato (`ContractStatus.token`)
        status_name:
          type: string
          nullable: true
          description: Nombre del estado del contrato
        status:
          type: object
          nullable: true
          description: Estado del contrato como objeto, añadido sin retirar los campos legacy
          properties:
            token:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
        payment_type:
          type: string
          nullable: true
          description: Token del tipo de pago (`PaymentType.token`)
        contract_holder:
          allOf:
            - $ref: "#/components/schemas/ContractHolder"
          nullable: true
          description: Titular del contrato; `null` si el contrato no tiene titular asignado
        direct_debit_holder:
          allOf:
            - $ref: "#/components/schemas/ContractDebitHolder"
          nullable: true
          description: Titular de la domiciliación; `null` si el contrato no tiene IBAN asociado
        allowed_actions:
          type: array
          description: |
            Acciones habilitadas para este contrato concreto, calculadas según su estado
            y su tipo de pago. Lista vacía si no hay ninguna acción disponible.
          items:
            type: string
          example:
            - consultar_datos_facturacion
            - actualizar_iban
            - registrar_lectura
        is_account_holder:
          type: boolean
          description: |
            `true` si el `dni` recibido coincide con el titular de la cuenta de
            domiciliación. En este endpoint el `dni` es obligatorio, por lo que la
            clave siempre está presente.
          example: true
        es_titular:
          type: boolean
          description: |
            `true` si el `dni` recibido coincide con el titular del contrato.
            Solo aparece cuando se envía `dni`.
          example: true
        es_pagador:
          type: boolean
          description: |
            `true` si el `dni` recibido coincide con el titular de la cuenta
            de domiciliación. Solo aparece cuando se envía `dni`.
          example: false

    ContractHolder:
      type: object
      required:
        - dni
      properties:
        dni:
          type: string
          nullable: true
          description: DNI/NIF del titular (`Person.token`)
        nombre:
          type: string
          nullable: true
          description: Nombre y apellidos del titular

    ContractDebitHolder:
      type: object
      required:
        - dni
      properties:
        dni:
          type: string
          nullable: true
          description: DNI/NIF del titular de la cuenta bancaria (`PersonBank.dni`)
        nombre:
          type: string
          nullable: true
          description: Nombre del titular de la cuenta bancaria (`PersonBank.name`)
        iban:
          type: string
          description: IBAN enmascarado (8 primeros caracteres + asteriscos + 8 últimos)

    ContractFullDetail:
      description: |
        Detalle completo de un contrato: los campos de `ContractDetail` y
        `BillingData` en un único objeto, más los datos de la cuenta de
        domiciliación. Se define como esquema propio en lugar de componerse con
        `allOf` porque `iban` debe describirse de forma condicional y `allOf`
        no permite sobrescribir la descripción heredada de sus esquemas base.
      type: object
      properties:
        token:
          type: string
          description: Token del contrato
        status_token:
          type: string
          nullable: true
          description: Token del estado del contrato
        status_name:
          type: string
          nullable: true
          description: Nombre del estado del contrato
        status:
          type: object
          nullable: true
          description: |
            Estado del contrato como objeto `{token, name}`. Se añade en paralelo
            a `status_token` y `status_name`, que se mantienen por
            compatibilidad. Es `null` si el contrato no tiene estado asignado.
          properties:
            token:
              type: string
              nullable: true
              description: Token del estado (mismo valor que `status_token`)
            name:
              type: string
              nullable: true
              description: Nombre del estado (mismo valor que `status_name`)
          example:
            token: "1"
            name: Activo
        holder_token:
          type: string
          nullable: true
          description: NIF/documento del titular
        payment_type:
          type: string
          nullable: true
          description: Token del tipo de pago
        use_type:
          type: string
          nullable: true
          description: Tipo de uso del contrato
        last_invoice_date:
          type: string
          format: date-time
          nullable: true
          description: Fecha de creación de la última factura
        supply_point_address:
          type: string
          nullable: true
          description: Dirección del punto de suministro por defecto
        meter_serial_number:
          type: string
          nullable: true
          description: Token del contador
        meter_caliber:
          type: string
          nullable: true
          description: Calibre del contador
        smart_metering:
          type: string
          enum: ["true", "false"]
          description: Indica si el contador tiene telelectura
        registration_date:
          type: string
          nullable: true
          description: Fecha de alta en formato dd/mm/aaaa
        termination_date:
          type: string
          nullable: true
          description: Fecha de baja en formato dd/mm/aaaa (si el contrato está dado de baja)
        nif:
          type: string
          description: NIF del titular
        tenant_name:
          type: string
          description: Nombre completo del titular
        holder_name:
          type: string
          description: Nombre completo del titular
        has_sepa_document:
          type: boolean
          description: |
            `true` si la forma de pago del contrato tiene un mandato SEPA
            firmado archivado (`GeneralPaymentSepaDocument`); `false` si no hay
            mandato o el contrato no tiene forma de pago.
        city:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        paper_invoice:
          type: string
          enum: ["true", "false"]
          description: "`true` si recibe factura en papel, `false` si es digital"
        email:
          type: string
        invoice_language:
          type: string
          description: Idioma de factura (configuración del despliegue)
        phone1:
          type: string
        phone2:
          type: string
        account_holder_dni:
          type: string
          nullable: true
          description: DNI/NIF del titular de la cuenta de domiciliación (`PersonBank.dni`); `null` si el contrato no tiene IBAN asociado o la cuenta no almacena DNI
        is_account_holder:
          type: boolean
          description: |
            `true` si el parámetro de consulta `dni` coincide con el titular de la
            cuenta de domiciliación (normalizado: sin espacios y en mayúsculas).
            **Solo aparece en la respuesta si se envía `dni`**; sin `dni` la clave
            se omite por completo. El frontend utiliza esta bandera para aplicar la
            lógica de anonimización; si es `false`, se está viendo la cuenta de otra
            persona.
          example: true
        is_holder:
          type: boolean
          description: |
            `true` si el parámetro de consulta `dni` coincide con el DNI/NIF del
            titular del contrato (`Contract.holder.token`, normalizado: sin
            espacios y en mayúsculas). **Solo aparece en la respuesta si se envía
            `dni`**; sin `dni` la clave se omite por completo.
          example: true
        is_payer:
          type: boolean
          description: |
            `true` si el parámetro de consulta `dni` coincide con el titular de la
            cuenta de domiciliación (normalizado). **Solo aparece en la respuesta
            si se envía `dni`**; sin `dni` la clave se omite por completo. Es un
            alias explícito de la misma comprobación que `is_account_holder`.
          example: true
        es_titular:
          type: boolean
          description: |
            Alias aditivo de `is_holder`: `true` si el `dni` coincide con el
            titular del contrato. Solo aparece cuando se envía `dni`.
          example: true
        es_pagador:
          type: boolean
          description: |
            Alias aditivo de `is_payer`: `true` si el `dni` coincide con el
            titular de la cuenta de domiciliación. Solo aparece cuando se envía
            `dni`.
          example: true
        holder_address:
          type: string
          nullable: true
          description: Dirección postal del titular del contrato (`PersonAddress` con `is_billing` activo); no confundir con `supply_point_address`, que es la dirección del punto de suministro
        iban:
          type: string
          description: IBAN de la cuenta de domiciliación. Se devuelve sin enmascarar solo cuando se envía el parámetro `dni` y este coincide con el titular de la cuenta (es decir, `is_account_holder` es `true`); en cualquier otro caso aparece enmascarado (8 primeros caracteres + asteriscos + 8 últimos)

    ContractByNic:
      description: |
        Respuesta de `GET /ov/contract/by-nic/{nic}/`: el detalle completo del
        contrato (`ContractFullDetail`) más `contract_token`.
      allOf:
        - $ref: "#/components/schemas/ContractFullDetail"
        - type: object
          required:
            - contract_token
          properties:
            contract_token:
              type: string
              description: Token del contrato (`Contract.token`, idéntico al campo `token`); es el valor que la frontend pasa como `?contract_token=` en el resto de endpoints
              example: CTR-001

    InvoiceFullDetail:
      type: object
      description: |
        Detalle completo de una factura: campos básicos más periodo de facturación,
        referencia de vivienda, dirección tributaria (condicional), tarifas y desglose fiscal.

        Estados condicionales de `tax_address`:

        - Factura **no domiciliada** (tipo de pago distinto de `DIRECT_DEBIT`): el campo
          `tax_address` no aparece en la respuesta.
        - Domiciliada y pagador = titular del contrato: `is_anonymized: false` y dirección
          completa (`address`, `postal_code`, `city`, `province`, `country`).
        - Domiciliada y pagador tercero: `is_anonymized: true`; se omite `address` y solo
          se exponen `postal_code`, `city`, `province` y `country`.
      properties:
        contract_number:
          type: string
          description: Token del contrato
        invoice_token:
          type: string
          description: Token de la factura
        invoice_number:
          type: string
          description: Serie/número de factura (`serie_final`)
        invoice_date:
          type: string
          format: date
          description: Fecha de emisión (`issue_date`)
        invoice_status:
          type: string
          description: Nombre del estado de la factura
        status:
          type: object
          nullable: true
          description: |
            Estado de la factura como objeto `{token, name}`. Se añade en paralelo
            a `invoice_status`, que se mantiene por compatibilidad. Es `null` si
            la factura no tiene estado asignado.
          properties:
            token:
              type: string
              nullable: true
              description: Token del estado (`InvoiceStatus.token`)
            name:
              type: string
              nullable: true
              description: Nombre del estado (mismo valor que `invoice_status`)
          example:
            token: "3"
            name: Enviada
        due_date:
          type: string
          format: date
          nullable: true
          description: Fecha de vencimiento (`due_date`); `null` si no está definida
        invoice_amount:
          type: number
          format: double
          description: Importe pendiente de pago (`left_to_pay`)
        total_amount:
          type: number
          format: double
          description: Importe total de la factura (`total_final`)
        subtotal_amount:
          type: number
          format: double
          description: Base imponible (`subtotal_final`)
        payment_method:
          type: string
          nullable: true
          description: Método de pago (`payment_type_final`)
        pdf_available:
          type: boolean
          description: Indica si el PDF está disponible según la configuración `ov_pdf_from`
        billing_period:
          type: object
          description: Periodo de facturación de la factura
          properties:
            year:
              type: integer
              nullable: true
            month:
              type: integer
              nullable: true
            days:
              type: integer
              nullable: true
        dwelling_code:
          type: string
          nullable: true
          description: Referencia del código de vivienda del punto de suministro; `null` si no está disponible
        tax_address:
          type: object
          nullable: true
          description: |
            Dirección tributaria del pagador. Su presencia y contenido dependen del tipo
            de pago y del pagador (ver las notas condicionales de `InvoiceFullDetail`).
            Solo se expone si la factura está domiciliada; se anonimiza si el pagador es
            un tercero.
          properties:
            is_anonymized:
              type: boolean
              description: "`true` cuando el pagador es un tercero (no titular del contrato); en ese caso `address` se omite"
            postal_code:
              type: string
            city:
              type: string
            province:
              type: string
              nullable: true
            country:
              type: string
              nullable: true
            address:
              type: string
              nullable: true
              description: Dirección de la calle; solo se expone cuando `is_anonymized` es `false`
        tariffs:
          type: array
          description: Tarifas aplicadas en la factura (líneas de factura)
          items:
            $ref: "#/components/schemas/TariffDetail"
        fiscal_breakdown:
          type: array
          description: |
            Desglose fiscal del recibo por organización (p. ej.:
            empresa gestora, ayuntamiento, EDAR, consorcio y agencia del agua). Calculado
            íntegramente por el backend a partir de la distribución fiscal de las líneas.
            Las organizaciones dependen del despliegue.
          items:
            $ref: "#/components/schemas/FiscalBreakdownItem"

    TariffDetail:
      type: object
      description: Tarifa aplicada en una línea de factura, con su normativa de referencia
      properties:
        name:
          type: string
          description: Nombre de la tarifa/línea (`price_rate_name`)
        description:
          type: string
          nullable: true
          description: Descripción de la línea
        units:
          type: number
          nullable: true
          description: Número de unidades facturadas
        unit_price:
          type: number
          nullable: true
          description: Precio unitario
        tax_percent:
          type: number
          nullable: true
          description: Porcentaje de impuesto aplicado
        total:
          type: number
          description: Importe total de la línea (base + impuesto)
        normativa:
          type: object
          nullable: true
          description: Normativa (publicación oficial) en la que se basa la tarifa
          properties:
            reference:
              type: string
              description: Referencia de la normativa (p. ej. referencia BOE)
            name:
              type: string
              nullable: true
              description: Nombre de la normativa

    FiscalBreakdownItem:
      type: object
      description: Desglose fiscal del recibo para una organización
      properties:
        organization:
          type: string
          description: Nombre de la organización receptora
        amount:
          type: number
          format: double
          description: Importe de la distribución fiscal para la organización

    MeterDetail:
      type: object
      description: >
        Detalle del contador del contrato para el bloque de cinco campos de la
        Oficina Virtual. El contador procede del punto de suministro por
        defecto (`supply_point_default.meter`).
      properties:
        meter_serial_number:
          type: string
          nullable: true
          description: Número de serie del contador (token del contador)
        meter_caliber:
          type: string
          nullable: true
          description: Calibre del contador
        digits:
          type: integer
          nullable: true
          description: Cifras del contador
        manufacture_year:
          type: integer
          nullable: true
          description: Año de fabricación del contador (`manufacturing_year`)
        installation_date:
          type: string
          format: date
          nullable: true
          description: Fecha de instalación (`installation_at`)

    ConsumptionHistoryResponse:
      type: object
      description: Envoltorio paginado estándar del historial de consumos.
      required:
        - count
        - next
        - previous
        - results
      properties:
        count:
          type: integer
          description: Número total de consumos que cumplen los filtros
        next:
          type: string
          format: uri
          nullable: true
          description: URL de la página siguiente (`null` en la última página)
        previous:
          type: string
          format: uri
          nullable: true
          description: URL de la página anterior (`null` en la primera página)
        results:
          type: array
          items:
            $ref: "#/components/schemas/ConsumptionHistoryItem"

    ConsumptionHistoryItem:
      type: object
      description: Consumo de un periodo del contrato en nomenclatura HF.
      required:
        - id
      properties:
        id:
          type: integer
          description: ID primario de la lectura (`Reading.id`), para vincular las filas a los checkboxes y solicitar descargas
          example: 42
        period:
          type: string
          description: Periodo de facturación en nomenclatura HF (`<año>-<trimestre>T`)
          example: "2025-3T"
        reading:
          type: number
          format: double
          nullable: true
          description: Lectura actual del periodo
        previous_reading:
          type: number
          format: double
          nullable: true
          description: Lectura anterior, resuelta en el backend (`Reading.previous_reading`)
        consumption:
          type: number
          format: double
          nullable: true
          description: Consumo del periodo
        reading_date:
          type: string
          format: date
          nullable: true
          description: Fecha de la lectura del periodo
        is_estimated:
          type: boolean
          description: Indica si la lectura del periodo es estimada

    ConsumptionDownloadRequest:
      type: object
      description: |
        Solicitud de descarga del historial de consumos. `reading_ids` y los
        filtros de fecha son mutuamente excluyentes en la práctica: si se pasan
        `reading_ids` se ignoran `date_from`/`date_to`; si no, se usan los
        filtros para generar el conjunto completo.
      required:
        - contract_token
      properties:
        contract_token:
          type: string
          description: Token del contrato (`Contract.token`)
          example: CTR-001
        reading_ids:
          type: array
          description: ID de lecturas seleccionadas manualmente (`Reading.id`)
          items:
            type: integer
          example: [42, 43, 44]
        date_from:
          type: string
          format: date
          description: Fecha mínima de lectura (inclusive), `YYYY-MM-DD`
          example: "2025-01-01"
        date_to:
          type: string
          format: date
          description: Fecha máxima de lectura (inclusive), `YYYY-MM-DD`
          example: "2025-12-31"
        format:
          type: string
          enum: [pdf, csv, zip]
          default: pdf
          description: Formato del fichero generado
          example: pdf

    BillingPeriodItem:
      type: object
      description: |
        Periodo de facturación disponible para el contrato, definido por el PA.
        `period_code` es el código de periodo (p. ej. `3T`) y `months_label` los
        meses naturales que incluye, para mostrarlos al usuario sin deducirlos
        en el frontal.
      required:
        - year
        - period_code
        - months_label
        - is_current
      properties:
        year:
          type: integer
          description: Año del periodo de facturación
          example: 2026
        period_code:
          type: string
          description: Código del periodo según el PA (p. ej. `1T`, `2T`, `3T`, `4T`)
          example: "3T"
        months_label:
          type: string
          description: Meses naturales incluidos en el periodo, legibles
          example: "julio-septiembre"
        is_current:
          type: boolean
          description: |
            Indica si es el periodo de facturación en curso; el frontal lo usa
            para los avisos al configurar el medio de pago.
          example: false

    SignedMandateUploadResponse:
      type: object
      required:
        - contract_token
        - success
      properties:
        contract_token:
          type: string
          description: Token del contrato al que se ha vinculado el mandato
          example: CTR-001
        success:
          type: boolean
          description: Confirmación de que el documento se ha archivado
          example: true

    CancelDirectDebitRequest:
      type: object
      required:
        - period
        - role
      properties:
        period:
          type: string
          description: Período de facturación desde el que se aplica la cancelación
          example: "2026-3T"
        role:
          type: string
          description: Rol de quien solicita la cancelación
          example: TITULAR
        new_payment_type:
          type: string
          description: |
            Token del nuevo tipo de pago solicitado (`PaymentType.token`).
            Opcional: si falta, se usa el tipo por defecto `BANK_TRANSFER`.
          example: BANK_TRANSFER

    CancelDirectDebitResponse:
      type: object
      required:
        - contract_token
        - success
        - message
      properties:
        contract_token:
          type: string
          description: Token del contrato
          example: CTR-001
        success:
          type: boolean
          description: Confirmación de que la cancelación se ha tramitado
          example: true
        message:
          type: string
          description: |
            `Direct debit cancelled successfully.` cuando se ha aplicado el
            cambio; `Direct debit already cancelled.` cuando el contrato ya
            tenía el tipo de pago objetivo (respuesta idempotente, sin
            escrituras).
          example: Direct debit cancelled successfully.

    DictionaryItem:
      type: object
      required:
        - token
        - name
      properties:
        token:
          type: string
          description: Identificador estable del valor (el que espera la API)
          example: "1"
        name:
          type: string
          description: Etiqueta legible para mostrar al usuario
          example: Activo

    PropertyItem:
      type: object
      required:
        - token
        - address
      properties:
        token:
          type: string
          description: Token de la propiedad (`Property.token`)
          example: PR-001
        address:
          type: string
          description: |
            Dirección completa ya formateada
            (`calle, número, código postal ciudad`).
          example: C/ Major, 123, 08001 Barcelona

    PropertyListResponse:
      type: object
      description: Envoltorio paginado del autocompletado de propiedades.
      required:
        - count
        - page
        - limit
        - total_pages
        - results
      properties:
        count:
          type: integer
          description: Número total de propiedades que cumplen la búsqueda
        page:
          type: integer
          description: Página actual
        limit:
          type: integer
          description: Tamaño de página aplicado
        total_pages:
          type: integer
          description: Número total de páginas
        results:
          type: array
          items:
            $ref: "#/components/schemas/PropertyItem"

    ProcedureTariffItem:
      type: object
      required:
        - token
        - name
        - type_price
        - price
        - price_table
        - components
      properties:
        token:
          type: string
          description: Token de la tarifa (`PriceRate.token`)
          example: TR-001
        name:
          type: string
          nullable: true
          description: Nombre de la tarifa
          example: Tarifa 2.0TD
        type_price:
          type: string
          enum:
            - fixed
            - variable
          description: |
            `variable` si algún concepto de la tarifa se tarifa por tramos
            (`price_interval` o `price_variable`); `fixed` en caso contrario.
          example: variable
        price:
          type: number
          nullable: true
          description: |
            Suma de los importes de los conceptos fijos (importe unitario sin
            impuestos). `null` si la tarifa no tiene conceptos fijos.
          example: 100.0
        price_table:
          nullable: true
          description: |
            Tabla del primer concepto variable (se prioriza `price_interval`
            sobre `price_variable`). `null` si la tarifa es fija.
          allOf:
            - $ref: "#/components/schemas/ProcedureTariffPriceTable"
        components:
          type: array
          description: Desglose completo de los conceptos activos de la tarifa
          items:
            $ref: "#/components/schemas/ProcedureTariffComponent"

    ProcedureTariffPriceTable:
      type: object
      required:
        - units
        - stretches
      properties:
        units:
          type: string
          enum:
            - m3
            - dm_met
            - dm_con
          description: |
            Dimensión del tramo: `m3` (consumo), `dm_met` (calibre del
            contador) o `dm_con` (diámetro de conexión).
          example: dm_met
        stretches:
          type: array
          items:
            $ref: "#/components/schemas/ProcedureTariffStretch"

    ProcedureTariffStretch:
      type: object
      required:
        - name
        - min
        - max
        - price
        - proportional_price
      properties:
        name:
          type: string
          nullable: true
          description: Nombre del tramo
          example: Calibre 13
        min:
          type: integer
          nullable: true
          description: Límite inferior del tramo
          example: 1
        max:
          type: integer
          nullable: true
          description: Límite superior del tramo; `null` si es abierto
          example: 13
        price:
          type: number
          nullable: true
          description: Importe por unidad del tramo, sin impuestos
          example: 45.0
        proportional_price:
          type: number
          nullable: true
          description: Importe proporcional del tramo, sin impuestos
          example: null

    ProcedureTariffComponent:
      type: object
      required:
        - token
        - name
        - type_price
        - price
        - price_table
      properties:
        token:
          type: string
          nullable: true
          description: Token del concepto (`LineItemType.token`)
          example: LIT-001
        name:
          type: string
          nullable: true
          description: Nombre del concepto
          example: Alta por calibre
        type_price:
          type: string
          enum:
            - fixed
            - variable
          description: Tipo de precio del concepto
          example: variable
        price:
          type: number
          nullable: true
          description: Importe fijo del concepto; `null` si es variable
          example: null
        price_table:
          nullable: true
          description: Tabla de tramos del concepto; `null` si es fijo
          allOf:
            - $ref: "#/components/schemas/ProcedureTariffPriceTable"
