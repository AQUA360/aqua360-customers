openapi: 3.0.3
info:
  title: Programa de Abonados — API Oficina Virtual (OV)
  description: |
    API de consulta y modificación de datos de abonados para Oficinas Virtuales (OV)
    y otras aplicaciones de terceros integradas con Aqua360 — Customers (Programa de Abonados).

    ## Resumen de endpoints

    | Endpoint | Método | Descripción |
    |---|---|---|
    | `/auth/login/` | POST | Obtención del token (usuario del grupo `ov`) |
    | `/ov/contract-detail/` | GET | Detalle del contrato |
    | `/ov/billing-data/` | GET / POST | Consulta y actualización de datos de facturación |
    | `/ov/billing-data/update-iban/` | POST | Actualización del IBAN |
    | `/ov/contact-data/` | GET | Consulta de la configuración del perfil (datos de facturación + dirección del titular) |
    | `/ov/person-data/` | GET | Datos de contacto de la persona por DNI (teléfonos, correos y direcciones, incluidas las inactivas) |
    | `/ov/invoices/` | GET | Listado de facturas (excluye pre-facturas) |
    | `/ov/invoices/download/` | POST | Descarga en lote de facturas seleccionadas (ZIP) |
    | `/ov/invoice/` | GET | Detalle de una factura |
    | `/ov/invoice/{token}/detail/` | GET | Detalle completo de una factura (tarifas y desglose fiscal) |
    | `/ov/invoice/paid/` | POST | Marcar factura como pagada (TPV online) |
    | `/ov/invoice/quick-pay/` | POST | Resolver factura por número de contrato, número de factura e importe exacto para el pago rápido (solo lectura) |
    | `/ov/invoice/return-request/` | POST | Solicitar la devolución de una factura (abre una incidencia; no cambia el estado) |
    | `/ov/payment-receipt/` | GET | Justificante de pago en PDF codificado en base64 (pagos en efectivo o con tarjeta en TPV físico) |
    | `/ov/unpayed-invoices/` | GET | Facturas impagadas filtradas por estado |
    | `/ov/billed-consumptions/` | GET | Consumos facturados |
    | `/ov/consumptions/` | GET | Historial de consumos paginado con filtro por fechas |
    | `/ov/consumption/{id}/download/` | GET | Descargar fichero de un consumo individual (PDF/CSV) |
    | `/ov/consumptions/download/` | POST | Descargar historial de consumos en lote (selección o todos filtrados) |
    | `/ov/billing-periods/` | GET | Periodos de facturación disponibles del contrato |
    | `/ov/invoice-pdf/` | GET | PDF de factura en Base64 |
    | `/ov/create-reading/` | POST | Registrar lectura de contador |
    | `/ov/contracts/` | GET | Listado de contratos por titular o pagador (DNI) |
    | `/ov/contract/{token}/` | GET | Detalle del contrato por token (incluye datos de la cuenta) |
    | `/ov/contract/by-nic/{nic}/` | GET | Búsqueda de contrato por NIC (punto de suministro) |
    | `/ov/meter/{contract_token}/` | GET | Detalle del contador del contrato por token |
    | `/ov/procedures/contract/` | POST | Solicitar el alta de un contrato (crea una solicitud; no crea contrato) |
    | `/ov/procedures/{contract_token}/upload-sepa-signed/` | POST | Subir y archivar el mandato SEPA firmado del contrato |
    | `/ov/procedures/{contract_token}/sepa-signed/` | GET | Descargar el mandato SEPA firmado archivado |
    | `/ov/procedures/{contract_token}/cancel-direct-debit/` | POST | Cancelar la domiciliación (revocación del mandato SEPA) y cambiar el tipo de pago |
    | `/ov/dictionary/contract-statuses/` | GET | Diccionario de estados de contrato (`token`, `name`) |
    | `/ov/dictionary/payment-types/` | GET | Diccionario de formas de pago (`token`, `name`) |
    | `/ov/dictionary/invoice-statuses/` | GET | Diccionario de estados de factura (`token`, `name`) |
    | `/ov/dictionary/procedure-tariffs/` | GET | Diccionario de tarifas activas de trámites con precio fijo o tabla por calibre/consumo |
    | `/ov/properties/` | GET | Autocompletado de propiedades por dirección (resultados paginados) |

    ## Autenticación

    1. Obtener un token con `POST /auth/login/` (usuario Django del grupo `ov`, creado por el administrador del PA).
    2. Incluir el token en cada llamada: `Authorization: Token <token>`.

    El usuario OV solo puede acceder a rutas bajo el prefijo `/ov/`. Cualquier otra ruta devuelve `403 Forbidden`.

    ## Prefijo de URL

    Si el despliegue tiene `API_URL_PREFIX=True`, añadir el prefijo `/api` a todas las rutas
    (p. ej. `/api/ov/contract-detail/`).

    ## Identificadores

    La mayoría de endpoints requieren el parámetro de consulta `contract_token`, que corresponde
    al campo `Contract.token` del contrato en el PA.

    ## Notas generales

    - Los IBAN devueltos en las respuestas aparecen enmascarados (8 primeros caracteres + asteriscos + 8 últimos). Excepción: `/ov/contract/{token}/` y `/ov/contract-detail/` devuelven el IBAN sin enmascarar cuando se envía el parámetro de consulta `dni` y este coincide con el titular de la cuenta de domiciliación (en ese caso `is_account_holder` es `true`); sin `dni`, las claves `is_account_holder`, `is_holder` e `is_payer` no aparecen en la respuesta.
    - Los campos booleanos expuestos como texto (`smart_metering`, `paper_invoice`) usan los valores `"true"` o `"false"`.
    - El listado de facturas (`/ov/invoices/`) excluye las pre-facturas (estado con token `1`).
  version: 1.0.0
  contact:
    name: Aqua360 — Programa de Abonados

servers:
  - url: https://customers.example.com
    description: Entorno de producción (sustituir por el dominio real)
  - url: http://localhost:8000
    description: Entorno local de desarrollo

tags:
  - name: Autenticación
    description: Obtención del token de acceso
  - name: Contrato
    description: Consulta de datos del contrato
  - name: Contador
    description: Consulta de los datos del contador del contrato
  - name: Datos de facturación
    description: Consulta y actualización de datos de facturación del abonado
  - name: Facturas
    description: Consulta, pago y descarga de facturas
  - name: Consumos
    description: Consulta de consumos facturados
  - name: Lecturas
    description: Registro de lecturas de contador
  - name: Trámites
    description: Trámites del abonado (alta, domiciliación, etc.) y documentos adjuntos
  - name: Perfil
    description: Configuración del perfil del abonado
  - name: Diccionarios
    description: Catálogos de valores de referencia para rellenar selectores sin hardcodear tokens

paths:
  /auth/login/:
    post:
      tags:
        - Autenticación
      summary: Obtener token de acceso
      description: |
        Autentica un usuario Django y devuelve el token para las llamadas siguientes.
        El usuario debe pertenecer al grupo `ov` y ser creado previamente por el administrador del PA.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: ov_user
              password: "********"
      responses:
        "200":
          description: Autenticación correcta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                username: ov_user
                token: 7b21d0b21ac28cd8721688b5db7d484adc32101f
        "400":
          description: Datos de login inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"

  /ov/contract-detail/:
    get:
      tags:
        - Contrato
      summary: Detalle del contrato por contract_token de consulta
      description: |
        Recibe el identificador como parámetro de consulta `contract_token`
        y devuelve directamente los datos completos del contrato (mismo
        esquema `ContractFullDetail` que `GET /ov/contract/{token}/`), sin
        redirigir. El token puede contener barra (`/`, p. ej.
        `12345678/001`), algo que un parámetro de ruta `<str:token>` no
        podría resolver, por eso se busca por consulta a la base de datos.

        `400` si falta `contract_token`; `404` si el contrato no existe.

        Igual que en `/ov/contract/{token}/`, el parámetro opcional `dni`
        desenmascara el IBAN cuando coincide con el titular de la cuenta de
        domiciliación y expone `is_account_holder`, `is_holder` e `is_payer`
        cuando se envía.
      operationId: getContractDetail
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
        - $ref: "#/components/parameters/dniOptional"
      responses:
        "200":
          description: Datos del contrato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractFullDetail"
              example:
                token: CTR-001
                status_token: "1"
                status_name: Activo
                holder_token: "12345678A"
                payment_type: DOM
                use_type: Doméstico
                last_invoice_date: "2026-01-15T10:30:00Z"
                supply_point_address: "C/ Barcelona, 31, 08000 Barcelona"
                meter_serial_number: MTR-001
                meter_caliber: "15"
                smart_metering: "false"
                registration_date: "15/03/2020"
                termination_date: null
                nif: "12345678A"
                tenant_name: Anna Garcia
                holder_name: Anna Garcia
                city: Barcelona
                postal_code: "08110"
                paper_invoice: "false"
                email: anna.garcia@example.com
                invoice_language: es
                phone1: "600000000"
                iban: "ES12***************7890"
                holder_address: "C/ de Mallorca, 45, 2-1, 08013 Barcelona"
                status:
                  token: "1"
                  name: Activo
                has_sepa_document: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/billing-data/:
    get:
      tags:
        - Datos de facturación
      summary: Consultar datos de facturación
      description: |
        Devuelve los datos de facturación y contacto del titular asociados al contrato.
      operationId: getBillingData
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
      responses:
        "200":
          description: Datos de facturación del contrato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingData"
              example:
                nif: "12345678A"
                tenant_name: Anna Garcia
                supply_point_address: "C/ Barcelona, 31, 08000 Barcelona"
                city: Barcelona
                postal_code: "08110"
                paper_invoice: "false"
                email: anna.garcia@example.com
                invoice_language: es
                phone1: "600123456"
                phone2: ""
                payment_type: DOM
                iban: "ES123456********56789012"
                holder_name: Anna Garcia
                has_sepa_document: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags:
        - Datos de facturación
      summary: Actualizar datos de facturación
      description: |
        Actualiza los datos de contacto y el tipo de comunicación (factura en papel o digital)
        del contrato. Los cambios quedan registrados en el historial del contrato.

        El campo `paper_invoice` es obligatorio. Los demás campos son opcionales;
        solo se actualizan si se envían en el cuerpo de la petición.
      operationId: updateBillingData
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBillingDataRequest"
            example:
              email: anna.garcia@example.com
              phone1: "600123456"
              phone2: "600654321"
              paper_invoice: false
      responses:
        "200":
          description: Datos actualizados correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateBillingDataResponse"
              example:
                message: Billing data updated successfully
                data:
                  nif: "12345678A"
                  tenant_name: Anna Garcia
                  supply_point_address: "C/ Barcelona, 31, 08000 Barcelona"
                  city: Barcelona
                  postal_code: "08110"
                  paper_invoice: "false"
                  email: anna.garcia@example.com
                  invoice_language: es
                  phone1: "600123456"
                  phone2: "600654321"
                  payment_type: DOM
                  iban: "ES123456********56789012"
                  holder_name: Anna Garcia
                  has_sepa_document: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /ov/billing-data/update-iban/:
    post:
      tags:
        - Datos de facturación
      summary: Actualizar IBAN
      description: |
        Actualiza la cuenta bancaria (IBAN) asociada al método de pago del contrato.

        El `nif` enviado debe coincidir con el NIF del titular del contrato (`holder.token`).
        El IBAN se normaliza eliminando espacios y convirtiéndolo a mayúsculas.
      operationId: updateIban
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIbanRequest"
            example:
              iban: ES1234567890123456789012
              nif: "12345678A"
              iban_holder_name: Anna Garcia
              iban_holder_dni: "12345678A"
      responses:
        "200":
          description: IBAN actualizado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateIbanResponse"
              example:
                message: "IBAN updated successfully "
                data:
                  nif: "12345678A"
                  tenant_name: Anna Garcia
                  supply_point_address: "C/ Barcelona, 31, 08000 Barcelona"
                  city: Barcelona
                  postal_code: "08110"
                  paper_invoice: "false"
                  email: anna.garcia@example.com
                  invoice_language: es
                  phone1: "600123456"
                  phone2: ""
                  payment_type: DOM
                  iban: "ES123456********56789012"
                  holder_name: Anna Garcia
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /ov/contact-data/:
    get:
      tags:
        - Perfil
      summary: Consultar la configuración del perfil
      description: |
        Devuelve los datos de facturación y contacto del contrato (los mismos
        campos que `GET /ov/billing-data/`) más `holder_address`, la dirección
        postal del titular del contrato (`PersonAddress` con `is_billing`).

        Parámetro obligatorio `contract_token` en la query: responde `400` si
        falta y `404` si el contrato no existe.
      operationId: getContactData
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
      responses:
        "200":
          description: Configuración del perfil del contrato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactData"
              example:
                nif: "12345678A"
                tenant_name: Anna Garcia
                supply_point_address: "C/ Barcelona, 31, 08000 Barcelona"
                city: Barcelona
                postal_code: "08110"
                paper_invoice: "false"
                email: anna.garcia@example.com
                invoice_language: es
                phone1: "600123456"
                phone2: ""
                payment_type: DOM
                iban: "ES123456********56789012"
                holder_name: Anna Garcia
                holder_address: "C/ de Mallorca, 45, 2-1, 08013 Barcelona"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/person-data/:
    get:
      tags:
        - Perfil
      summary: Consultar los datos de contacto de una persona por DNI
      description: |
        Devuelve los teléfonos, correos electrónicos y direcciones de la
        persona identificada por `dni`, sin depender de ningún contrato. El
        frontal OV lo usa globalmente para prellenar formularios y para la
        verificación por SMS OTP.

        Se incluyen también las filas históricas/inactivas; cada teléfono,
        correo y dirección lleva su propio `is_active`. Los teléfonos y los
        correos proceden de las mismas filas `PersonContact`: una fila con
        ambos valores aparece en las dos listas compartiendo `token`. Las
        filas sin teléfono ni correo se omiten.

        El `dni` es obligatorio y se normaliza ignorando espacios, guiones y
        puntos y pasando a mayúsculas. La persona se resuelve primero por
        `Person.token` y, si no hay coincidencia, por el DNI de su cuenta
        bancaria (`PersonBank.dni`), de modo que los pagadores también
        pueden consultar sus datos de contacto. Si varias personas comparten
        token (datos heredados), se devuelve la que tiene más contactos y, a
        igualdad, la de menor `id`. Responde `400` si falta el DNI y `404` si
        no se encuentra la persona. El endpoint está limitado a 35
        peticiones por minuto y cuenta.
      operationId: getPersonData
      security:
        - tokenAuth: []
      parameters:
        - name: dni
          in: query
          required: true
          description: |
            DNI/NIF de la persona. Se normaliza ignorando espacios, guiones y
            puntos y pasando a mayúsculas. Si no coincide con ningún
            `Person.token`, se busca en `PersonBank.dni` para localizar al
            pagador.
          schema:
            type: string
          example: "12345678A"
      responses:
        "200":
          description: Datos de contacto de la persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonDataResponse"
              example:
                person:
                  token: "12345678A"
                  name: Anna
                  surname: Garcia
                  is_juridic: false
                phones:
                  - token: "12345678A_CONTACT_1"
                    phone: "600123456"
                    role: MÒBIL
                    is_default: true
                    is_active: true
                emails:
                  - token: "12345678A_CONTACT_1"
                    email: anna.garcia@example.com
                    role: PARTICULAR
                    is_default: true
                    is_active: true
                addresses:
                  - token: "12345678A_ADDRESS_1"
                    address: "C. Major, 123 2-B, Barcelona"
                    street: "C. Major"
                    street_number: "123"
                    postal_code: "08001"
                    city: Barcelona
                    floor: "2"
                    door: B
                    stair: null
                    building: null
                    attention_to: null
                    is_billing: true
                    is_active: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ov/invoices/:
    get:
      tags:
        - Facturas
      summary: Listar facturas del contrato
      description: |
        Devuelve todas las facturas del contrato excepto las pre-facturas
        (facturas con estado token `1`).

        El importe devuelto en `invoice_amount` corresponde al pendiente de pago (`left_to_pay`).

        `404` si el `contract_token` no corresponde a ningún contrato.
      operationId: listInvoices
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
      responses:
        "200":
          description: Lista de facturas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceSummary"
              example:
                - contract_number: CTR-001
                  invoice_number: F-2026-0001
                  invoice_token: INV-001
                  invoice_date: "2026-01-15"
                  invoice_amount: 45.50
                  invoice_status: Enviada
                  status:
                    token: "3"
                    name: Enviada
                  pdf_available: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/invoices/download/:
    post:
      tags:
        - Facturas
      summary: Descarga en lote de facturas (ZIP)
      description: |
        Descarga en un único ZIP los PDFs de las facturas indicadas. El
        `contract_token` va en la query y la lista de fitxes en el cuerpo
        JSON (`invoice_tokens`).

        Reutiliza el PDF almacenado y finalizado en `invoice_file` cuando está
        disponible. Si no existe o no se puede recuperar, genera el PDF con
        el mismo servicio que `GET /ov/invoice-pdf/`
        (`generate_report_invoice_pdf`) y `save_pdf=False`. La generación de
        fallback mantiene los bytes del PDF sin registrar un nuevo documento
        desde esta descarga por lote.

        Seguridad IDOR: todas las fitxes solicitadas deben pertenecer al
        contrato indicado y ser definitivas (`type_final`), el mismo filtro
        que la descarga individual; cualquier fitxa desconocida o de otro
        contrato responde `400` con el detalle por token (mensaje genérico,
        no revela si la fitxa existe en otro contrato).

        Cada PDF se nombra `factura_<serie_final>.pdf` (o
        `factura_<invoice_token>.pdf` si no tiene número), con las barras del
        número sustituidas por `-` para que las entradas del ZIP no creen
        subcarpetas; la respuesta es un fichero adjunto `facturas.zip`.
      operationId: downloadInvoicesZip
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchInvoiceDownloadRequest"
            example:
              invoice_tokens:
                - "INV-001"
                - "INV-002"
      responses:
        "200":
          description: ZIP con un PDF por factura solicitada
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: |
            Falta `contract_token`, el cuerpo no es válido, la lista está
            vacía o alguna fitxa no pertenece al contrato.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrors"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                missingContractToken:
                  summary: Falta contract_token en la query
                  value:
                    error: Contract token is required
                emptyList:
                  summary: Lista vacía
                  value:
                    invoice_tokens:
                      - Esta lista no puede estar vacía.
                unknownTokens:
                  summary: Fitxa ajena al contrato o desconocida
                  value:
                    invoice_tokens:
                      - Invoice not found for this contract: "FAKE-TOKEN"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: Fallo generando alguno de los PDFs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: "Failed to retrieve invoice PDF: ..."

  /ov/invoice/:
    get:
      tags:
        - Facturas
      summary: Detalle de una factura
      description: |
        Devuelve el detalle de una factura concreta del contrato.
      operationId: getInvoice
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
        - $ref: "#/components/parameters/invoiceToken"
      responses:
        "200":
          description: Detalle de la factura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceSummary"
              example:
                contract_number: CTR-001
                invoice_number: F-2026-0001
                invoice_token: INV-001
                invoice_date: "2026-01-15"
                invoice_amount: 45.50
                invoice_status: Enviada
                status:
                  token: "3"
                  name: Enviada
                pdf_available: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ov/invoice/{token}/detail/:
    get:
      tags:
        - Facturas
      summary: Detalle completo de una factura
      description: |
        Devuelve el detalle ampliado de una factura identificada por su token, ampliando
        el listado básico (`/ov/invoices/`) con el periodo de facturación, la referencia
        de la vivienda, la dirección tributaria, las tarifas aplicadas con su normativa
        y el desglose fiscal del recibo.

        Solo devuelve facturas definitivas (tipo `invoice_type_invoice_token`); las
        proformas, pre-facturas y presupuestos se excluyen, igual que en `/ov/invoice-pdf/`.

        La dirección tributaria (`tax_address`) es condicional:

        - Si la factura **no** está domiciliada (el tipo de pago no es `DIRECT_DEBIT`),
          el campo `tax_address` **no aparece** en la respuesta.
        - Si está domiciliada y el pagador es el propio titular del contrato
          (`payer_token_final` coincide con `customer_token_final`), el campo aparece
          con `is_anonymized: false` y la dirección completa.
        - Si está domiciliada pero el pagador es un tercero, el campo aparece con
          `is_anonymized: true`, se omite `address` y solo se exponen `postal_code`,
          `city`, `province` y `country`.
      operationId: getInvoiceDetailByToken
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/invoiceTokenPath"
      responses:
        "200":
          description: Detalle completo de la factura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceFullDetail"
              example:
                contract_number: CTR-001
                invoice_token: INV-001
                invoice_number: F-2026-0001
                invoice_date: "2026-03-05"
                invoice_status: Enviada
                status:
                  token: "3"
                  name: Enviada
                due_date: "2026-03-25"
                invoice_amount: 45.50
                total_amount: 48.19
                subtotal_amount: 45.50
                payment_method: Domiciliació Bancària - SEPA
                pdf_available: true
                billing_period:
                  year: 2026
                  month: 3
                  days: 31
                dwelling_code: VIV-000123
                tax_address:
                  is_anonymized: false
                  address: "C/ Barcelona, 31"
                  postal_code: "08110"
                  city: Barcelona
                  province: Barcelona
                  country: España
                tariffs:
                  - name: Subministrament d'aigua
                    description: Canalización y consumo de agua
                    units: 14
                    unit_price: 2.20
                    tax_percent: 10
                    total: 30.80
                    normativa:
                      reference: "BOE-A-2020-12345"
                      name: Tarifa del ciclo integral del agua
                fiscal_breakdown:
                  - organization: Empresa gestora
                    amount: 14.50
                  - organization: Ayuntamiento
                    amount: 8.00
                  - organization: EDAR
                    amount: 3.10
                  - organization: Consorcio
                    amount: 4.20
                  - organization: Agencia del agua
                    amount: 9.85
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Factura no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Invoice not found

  /ov/invoice/paid/:
    post:
      tags:
        - Facturas
      summary: Marcar factura como pagada
      description: |
        Marca como pagados todos los pagos pendientes de una factura tras un cobro
        por TPV online. Solo aplica a facturas de tipo factura (no presupuestos).

        Los pagos se actualizan con tipo de pago `TPV_ONLINE` y fecha de pago actual.
      operationId: markInvoicePaid
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoicePaidRequest"
            example:
              contract_token: CTR-001
              invoice_token: INV-001
      responses:
        "200":
          description: Factura marcada como pagada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePaidResponse"
              example:
                success: true
                message: Invoice marked as paid successfully
                invoice_token: INV-001
                new_status: Pagada
        "400":
          description: Datos inválidos o factura no encontrada
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrors"
                  - $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ov/invoice/quick-pay/:
    post:
      tags:
        - Facturas
      summary: Resolver factura para el pago rápido
      description: |
        Resuelve una factura a partir de los tres datos que el abonado tiene
        impresos en el papel: número de contrato (`Contract.token`), número de
        factura (`Invoice.serie_final`) e importe total exacto (`Invoice.total_final`).

        Es una consulta de **solo lectura**: no crea ni modifica pagos. El frontal
        de la OV debe cobrar con su propio TPV y, a continuación, confirmar el cobro
        con `POST /ov/invoice/paid/` usando los tokens devueltos.

        Si cualquiera de los tres datos no coincide, o el documento no es una
        factura definitiva, la respuesta es siempre el mismo `404` para no revelar
        coincidencias parciales. Si los tres coinciden pero la factura no es
        pagable (estado de pago, anulación, abono, prefactura, impagado
        irrecuperable o importe pendiente cero), se devuelve `409` con el estado
        actual.
      operationId: quickPayInvoice
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickPayRequest"
            example:
              contract_number: "3451189"
              invoice_number: FC/202609/000001
              amount: 101.73
      responses:
        "200":
          description: Factura resuelta y pagable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickPayResponse"
              example:
                contract_token: "3451189"
                invoice_token: INV-001
                invoice_number: FC/202609/000001
                issue_date: "2026-09-01"
                due_date: "2026-09-30"
                invoice_amount: 101.73
                left_to_pay: 101.73
                status:
                  token: "2"
                  name: Confirmada
                payable: true
        "400":
          description: Datos inválidos (campos obligatorios, importe con más de dos decimales o negativo)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No existe una factura definitiva que coincida con los tres datos.
            El mensaje es idéntico para cualquier discrepancia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Invoice not found
        "409":
          description: La factura existe pero no es pagable en su estado actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickPayNotPayableResponse"
              example:
                error: Invoice is not payable
                status:
                  token: "0"
                  name: Pagada
                left_to_pay: 101.73
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ov/invoice/return-request/:
    post:
      tags:
        - Facturas
      summary: Solicitar la devolución de una factura
      description: |
        Abre una incidencia automática para que atención al cliente haga
        seguimiento de una devolución solicitada por el abonado.

        **No cambia el estado de la factura, su `left_to_pay` ni ningún pago.**
        La factura solo vuelve a confirmada/vencida días después, cuando el
        banco procesa el fichero de devoluciones (flujo externo a este endpoint).

        Solo se acepta una factura definitiva, del contrato indicado y con
        estado pagado. El token de estado pagado es la fuente de verdad; no se
        comprueba `left_to_pay`, porque el flujo de pagos actualiza el estado
        sin re-sincronizar ese campo y puede quedar obsoleto (o `NULL`) en
        facturas realmente pagadas. La misma respuesta `404` cubre factura
        inexistente, prefactura y contrato erróneo, para no revelar
        coincidencias parciales. Si ya existe una solicitud abierta para la
        factura, o un pago ya está devuelto por el banco, se devuelve `409`.
      operationId: requestInvoiceReturn
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnRequest"
            example:
              invoice_token: INV-001
              contract_token: "3451189"
              reason: Domiciliación devuelta por el banco
      responses:
        "201":
          description: Incidencia de devolución creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnRequestResponse"
              example:
                incident_token: "20261023001"
                invoice_token: INV-001
                contract_token: "3451189"
                status:
                  token: "1"
                  name: Oberta
                type:
                  token: reclamacio
                  name: Reclamació
                created_at: "2026-10-23T09:30:00Z"
        "400":
          description: Campos obligatorios ausentes o inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No existe una factura definitiva que coincida con el token de
            factura y el de contrato, o la configuración de estados no está
            disponible. El mensaje es idéntico para cualquier discrepancia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Invoice not found
        "409":
          description: |
            La factura existe pero no se puede solicitar la devolución: no está
            pagada, ya la ha devuelto el banco o ya tiene una solicitud abierta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnRequestConflictResponse"
              examples:
                notPaid:
                  value:
                    error: Invoice is not paid
                    status:
                      token: "2"
                      name: Confirmada
                alreadyReturned:
                  value:
                    error: Invoice already returned
                    status:
                      token: "2"
                      name: Confirmada
                duplicate:
                  value:
                    error: Return request already exists
                    incident_token: "20261023001"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: No se ha podido crear la incidencia (diccionarios de incidencias no configurados)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Return request could not be created

  /ov/payment-receipt/:
    get:
      tags:
        - Facturas
      summary: Obtener justificante de pago (base64)
      description: |
        Devuelve el justificante de pago en PDF de un pago realizado **en efectivo
        (`CASH`) o con tarjeta en el TPV físico (`CARD`)**. Los pagos online
        (`TPV_ONLINE`) no se sirven porque la OV emite su propio justificante, y
        los pagos por domiciliación SEPA o transferencia no tienen justificante.

        Solo se aceptan pagos cobrados (estado pagado) asociados a una factura
        definitiva (`type_final`). El pago debe pertenecer al contrato indicado y
        el DNI debe coincidir con el pagador, el cliente, el titular del contrato
        o el titular de la cuenta de domiciliación. Cualquier discrepancia
        devuelve el mismo `404` para no revelar qué pagos existen.

        El PDF se genera en memoria: no se guarda ningún documento ni se modifica
        el pago. El PDF se devuelve codificado en base64 dentro de
        `pdf_base64`, no como descarga binaria.

        El idioma del justificante se elige con `lang` (preferente) o con la
        cabecera `Accept-Language`; si no se indica ninguno, se usa catalán.
        Solo afecta a este endpoint de la OV: el resto de consumidores del mismo
        servicio (administración/ERP) siguen generando el PDF en catalán.
      operationId: getPaymentReceipt
      security:
        - tokenAuth: []
      parameters:
        - in: query
          name: contract_token
          required: true
          description: Token del contrato (`Contract.token`) al que pertenece el pago
          schema:
            type: string
          example: "RECEIPT-CONTRACT-1"
        - in: query
          name: payment_token
          required: true
          description: Token del pago (`Payment.token`)
          schema:
            type: string
          example: PAY-CASH-1
        - in: query
          name: dni
          required: true
          description: |
            DNI/NIF del pagador, cliente, titular del contrato o titular de la
            cuenta de domiciliación. Se normaliza como en `/ov/person-data/`
            (ignora espacios, guiones y puntos; no distingue mayúsculas).
          schema:
            type: string
          example: 12345678A
        - in: query
          name: lang
          required: false
          description: |
            Idioma del justificante. Tiene prioridad sobre `Accept-Language`.
            Admite `ca`, `es`, `gl` y `en` (también con región o mayúsculas,
            p. ej. `ES`, `es-ES`, `es_ES`). Un valor no soportado se ignora y se
            usa `Accept-Language` o, en su defecto, catalán.
          schema:
            type: string
            enum: [ca, es, gl, en]
            default: ca
          example: es
      responses:
        "200":
          description: Justificante de pago en PDF codificado en base64
          headers:
            Cache-Control:
              description: Siempre `no-store` (documento sensible)
              schema:
                type: string
            Content-Language:
              description: Idioma efectivo del PDF (`ca`, `es`, `gl` o `en`)
              schema:
                type: string
              example: es
          content:
            application/json:
              schema:
                type: object
                required: [pdf_base64]
                properties:
                  pdf_base64:
                    type: string
                    format: byte
                    description: |
                      Contenido del PDF codificado en base64 (estándar, sin
                      prefijo `data:` ni saltos de línea).
              example:
                pdf_base64: JVBERi0xLjQK...
        "400":
          description: Faltan el token de contrato, el token de pago o el DNI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: DNI is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No existe un pago válido que coincida con el contrato, el pago y el
            DNI, o el pago no es de efectivo/TPV físico, no está cobrado, no
            tiene factura definitiva o no se puede generar el justificante.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Payment receipt not found
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: Error generando el PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: PDF generation failed

  /ov/unpayed-invoices/:
    get:
      tags:
        - Facturas
      summary: Listar facturas impagadas
      description: |
        Devuelve las facturas del contrato filtradas por uno o más estados de factura.

        Aplica los mismos filtros base que `/ov/invoices/`: nunca devuelve
        pre-facturas (estado con token `1`), aunque el token `1` se incluya en
        `statuses` (en ese caso la lista puede quedar vacía). Sobre esa base,
        `statuses` añade el filtro de estados impagados.

        Para compatibilidad, `statuses` sigue aceptando tokens de `InvoiceStatus`
        separados por comas y conserva prioridad cuando se envía. Como alternativa,
        `unpaid=true` activa el modo automatizado, que resuelve desde `ConfigProject`
        los estados confirmados, vencidos, de morosidad/impago y de compromiso,
        excluyendo estados terminales y pre-facturas.

        Tokens de estado habituales (pueden variar según la configuración del despliegue):
        - `0`: Pagada
        - `2`: Confirmada
        - `3`: Enviada
        - `-1`: Vencida
        - `-3`: Morosidad
        - `4`: En compromiso

        Parámetro opcional `exc_payment_type_token`: excluye facturas cuyo tipo de pago final
        coincida con alguno de los tokens indicados (separados por comas).
      operationId: listUnpaidInvoices
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
        - name: statuses
          in: query
          required: false
          description: Tokens de estado de factura (`InvoiceStatus.token`), separados por comas
          schema:
            type: string
          example: "-3,2"
        - name: unpaid
          in: query
          required: false
          description: |
            Si vale `true` y no se proporciona `statuses`, activa la selección
            automática de estados impagados configurados. Si se proporciona
            `statuses`, ese filtro explícito conserva prioridad.
          schema:
            type: boolean
            default: false
        - name: exc_payment_type_token
          in: query
          required: false
          description: Tokens de tipo de pago a excluir (`PaymentType.token`), separados por comas
          schema:
            type: string
          example: DOM
      responses:
        "200":
          description: Lista de facturas filtradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/billed-consumptions/:
    get:
      tags:
        - Consumos
      summary: Consumos facturados
      description: |
        Devuelve el historial de consumos facturados del contrato, agrupados por fecha de emisión
        de cada factura.
      operationId: listBilledConsumptions
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
      responses:
        "200":
          description: Lista de consumos facturados por factura
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BilledConsumption"
              example:
                - timestamp: "2026-01-15"
                  consumptions:
                    - meter: MTR-001
                      reading: 1250.5
                      consumption: 12.0
                      origin: ""
                      contract_number: CTR-001
                      is_estimated: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ov/consumptions/:
    get:
      tags:
        - Consumos
      summary: Historial de consumos del contrato
      description: |
        Devuelve el historial de consumos del contrato en nomenclatura HF
        (p. ej. `2025-3T`), una fila por periodo con la lectura actual, la
        lectura anterior, el consumo, la fecha de lectura y el indicador de
        lectura estimada.

        A diferencia de `/ov/billed-consumptions/`, que agrupa por la fecha de
        emisión de la factura, la lectura anterior se resuelve en el backend
        (cadena `Reading.previous_reading`), insensible a lecturas estimadas y
        cambios de contador que romperían el orden de la serie en el BFF.

        Paginación de servidor: `count` es el total de filas que cumplen los
        filtros y `next`/`previous` son las URLs de las páginas contiguas
        (`null` en los extremos). `date_from` y `date_to` filtran por la fecha
        de lectura (`reading_date`, ambos inclusive); si `date_from` es
        posterior a `date_to` responde `400`. Un `contract_token` desconocido
        responde `404`.

        Solo se devuelven los consumos ya facturados: las lecturas que no están
        vinculadas a ninguna factura se excluyen del historial.
      operationId: listConsumptionHistory
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
        - $ref: "#/components/parameters/dateFrom"
        - $ref: "#/components/parameters/dateTo"
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Página del historial de consumos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumptionHistoryResponse"
              example:
                count: 100
                next: http://localhost:8000/ov/consumptions/?contract_token=CTR-001&page=2
                previous: null
                results:
                  - id: 42
                    period: "2025-3T"
                    reading: 1250.5
                    previous_reading: 1238.5
                    consumption: 12.0
                    reading_date: "2025-09-15"
                    is_estimated: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/consumption/{id}/download/:
    get:
      tags:
        - Consumos
      summary: Descargar consumo individual
      description: |
        Devuelve el fichero de un único consumo del historial. El `id` es el
        `Reading.id` expuesto por `GET /ov/consumptions/` y `contract_token` el
        token del contrato al que pertenece la lectura.

        El formato se elige con `?format=` (`pdf` por defecto o `csv`).
        Responde `404` si el contrato no existe o si la lectura no existe, no
        pertenece al contador del contrato o no está facturada (sin factura
        vinculada).
      operationId: downloadConsumption
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/consumptionIdPath"
        - $ref: "#/components/parameters/contractToken"
        - $ref: "#/components/parameters/downloadFormat"
      responses:
        "200":
          description: Fichero del consumo
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/consumptions/download/:
    post:
      tags:
        - Consumos
      summary: Descargar historial de consumos (selección o todos los filtrados)
      description: |
        Genera el fichero del historial de consumos. Si se pasan `reading_ids`,
        se descargan únicamente esas lecturas (filas marcadas manualmente). Si
        no, se aplican `date_from`/`date_to` y se devuelve el conjunto completo
        filtrado, sin límite de página, pensado para «Seleccionar todo».

        Solo se incluyen los consumos ya facturados (lecturas vinculadas a al
        menos una factura). Los `reading_ids` no facturados se omiten del
        fichero sin devolver error; un `reading_id` fuera del contador del
        contrato sigue respondiendo `400`.

        El formato se elige con `format` en el cuerpo (`pdf` por defecto,
        `csv` o `zip`). Responde `404` si el contrato no existe y `400` con
        errores de validación por campo si `date_from` es posterior a
        `date_to`, hay un `reading_id` desconocido o el cuerpo es inválido.
      operationId: downloadConsumptions
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumptionDownloadRequest"
            example:
              contract_token: CTR-001
              reading_ids: [42, 43, 44]
              date_from: "2025-01-01"
              date_to: "2025-12-31"
              format: pdf
      responses:
        "200":
          description: Fichero con el historial solicitado
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ValidationErrors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/billing-periods/:
    get:
      tags:
        - Datos de facturación
      summary: Periodos de facturación disponibles del contrato
      description: |
        Devuelve los periodos de facturación disponibles para el contrato.
        Los ciclos de facturación (trimestral, bimestral, etc.) los define el
        sistema central (PA) y varían según el contrato, por lo que el frontal
        no puede hardcodearlos: este endpoint los expone tal cual los genera el
        PA para que el selector de «Primera domiciliación» del formulario de
        medio de pago se rellene dinámicamente.
      operationId: listBillingPeriods
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
      responses:
        "200":
          description: Periodos de facturación disponibles del contrato
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillingPeriodItem"
              example:
                - year: 2026
                  period_code: "1T"
                  months_label: "enero-marzo"
                  is_current: false
                - year: 2026
                  period_code: "2T"
                  months_label: "abril-junio"
                  is_current: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/invoice-pdf/:
    get:
      tags:
        - Facturas
      summary: Obtener PDF de factura
      description: |
        Devuelve en formato Base64 el PDF almacenado y finalizado de una
        factura cuando está disponible. Si no existe o no se puede recuperar,
        genera un PDF nuevo como fallback.

        La factura se identifica por `invoice_token` (campo `Invoice.token`) o, en su defecto,
        por `serie_final` si no se encuentra por token. Solo se consideran facturas de tipo factura
        (según la configuración `invoice_type_invoice_token` del proyecto).
      operationId: getInvoicePdf
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractToken"
        - $ref: "#/components/parameters/invoiceToken"
      responses:
        "200":
          description: PDF de la factura codificado en Base64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePdfResponse"
              example:
                pdf: JVBERi0xLjQKJeLjz9MK...
                filename: invoice_F-2026-0001_42.pdf
                document_name: F-2026-0001.pdf
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /ov/create-reading/:
    post:
      tags:
        - Lecturas
      summary: Registrar lectura de contador
      description: |
        Crea una nueva lectura de contador asociada al contrato.

        El contador (`meter`) debe coincidir con el contador del punto de suministro
        por defecto del contrato (`supply_point_default`).

        La lectura se crea con origen `OV`. Si la fecha no está dentro del periodo de facturación
        permitido, la lectura se marca como lectura de control (`is_control=true`).
      operationId: createReading
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReadingRequest"
            example:
              reading_at: "2026-01-15"
              contract: CTR-001
              meter: MTR-001
              reading: 1250.5
      responses:
        "201":
          description: Lectura creada correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReadingResponse"
              example:
                success: true
                message: Reading created successfully
                reading_token: OV-123
                reading_value: "1250.5"
                reading_date: "2026-01-15"
                contract_token: CTR-001
                meter_token: MTR-001
                supply_point_token: SP-001
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ov/contracts/:
    get:
      tags:
        - Contrato
      summary: Listar contratos por DNI
      description: |
        Devuelve los contratos en los que el DNI indicado actúa como titular del contrato
        (`holder.token`) o como titular de la cuenta de domiciliación
        (`payment.IBAN.person.token` / `payment.IBAN.dni`).

        El DNI es obligatorio y se compara tras normalizarlo (sin espacios y en mayúsculas).
        Si el DNI coincide en ambos roles, el contrato aparece una sola vez.

        `allowed_actions` se calcula por contrato según su estado y su tipo de pago,
        por lo que su contenido puede variar entre elementos de una misma respuesta.

        `is_account_holder` indica si el `dni` recibido coincide con el titular de la
        cuenta de domiciliación; como en este endpoint el `dni` es obligatorio, la
        clave siempre está presente.
      operationId: listContractsByDni
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/dni"
        - $ref: "#/components/parameters/contractStatus"
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/limitParam"
      responses:
        "200":
          description: Lista paginada de contratos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractListResponse"
              example:
                count: 2
                page: 1
                limit: 20
                total_pages: 1
                results:
                  - token: CTR-001
                    status_token: "1"
                    status_name: Alta
                    payment_type: DOM
                    contract_holder:
                      dni: "12345678A"
                      nombre: Anna Garcia
                    direct_debit_holder:
                      dni: "12345678A"
                      nombre: Anna Garcia
                      iban: "ES912345********45678901"
                    allowed_actions:
                      - consultar_datos_facturacion
                      - actualizar_iban
                      - registrar_lectura
                    is_account_holder: true
                  - token: CTR-002
                    status_token: "-1"
                    status_name: Baixa
                    payment_type: DOM
                    contract_holder:
                      dni: "12345678A"
                      nombre: Anna Garcia
                    direct_debit_holder: null
                    allowed_actions:
                      - consultar_datos_facturacion
                    is_account_holder: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ov/properties/:
    get:
      tags:
        - Contrato
      summary: Autocompletado de propiedades por dirección
      description: |
        Devuelve las propiedades activas cuya dirección, nombre o referencia
        catastral coincide con `search`, para que el abonado pueda iniciar
        trámites sobre una propiedad existente desde la Oficina Virtual. No
        permite crear ni modificar propiedades.

        `search` es obligatorio y debe tener al menos 3 caracteres (si no,
        `400`). La puntuación (espacios, `,`, `.`, `;`, `/`) se trata como
        separador: cada término debe coincidir con algún campo (nombre de
        calle, número, ciudad, código postal, nombre o referencia catastral)
        y todos los términos se combinan con AND. Así `CR.` encuentra las
        propiedades del tipo de calle `CR` y `CR. Major 33` exige que se
        cumplan todos los términos. Un `search` compuesto solo por
        puntuación devuelve `400` (`Search must contain at least one valid
        term`). Los resultados se devuelven paginados y `address` ya llega
        formateada (`calle, número, código postal ciudad`).
      operationId: listProperties
      security:
        - tokenAuth: []
      parameters:
        - name: search
          in: query
          required: true
          description: Texto a buscar (mínimo 3 caracteres)
          schema:
            type: string
            minLength: 3
          example: Major
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/limitParam"
      responses:
        "200":
          description: Propiedades coincidentes, paginadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyListResponse"
              example:
                count: 1
                page: 1
                limit: 20
                total_pages: 1
                results:
                  - token: PR-001
                    address: C/ Major, 123, 08001 Barcelona
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ov/contract/{token}/:
    get:
      tags:
        - Contrato
      summary: Detalle del contrato por token
      description: |
        Devuelve los datos del contrato identificado por el `token` incluido en la
        propia ruta. Equivalente a `/ov/contract-detail/`, que recibe el
        identificador como parámetro de consulta `contract_token` (este admite
        tokens con barra, que no caben en un parámetro de ruta `<str:token>`).

        Expande las estructuras de `/ov/contract-detail/` y `/ov/billing-data/`
        añadiendo los datos de la cuenta de domiciliación: el DNI de su titular,
        la dirección postal del titular y la bandera `is_account_holder`.

        `is_account_holder` solo se evalúa si se envía el parámetro opcional
        `dni`: coincide con `true` cuando ese `dni` (normalizado) corresponde al
        titular de la cuenta de domiciliación. Si `dni` no se envía, la clave
        `is_account_holder` **no aparece** en la respuesta.

        `is_holder` e `is_payer` siguen la misma regla: solo se evalúan si se
        envía `dni` y se omiten de la respuesta si no se envía. `is_holder`
        indica si el `dni` corresponde al titular del contrato e `is_payer` si
        corresponde al titular de la cuenta de domiciliación (misma comprobación
        que `is_account_holder`).

        Excepción a la nota general sobre IBAN: en este endpoint el campo `iban`
        se devuelve sin enmascarar solo si se envía `dni` y este coincide con el
        titular de la cuenta; en cualquier otro caso aparece enmascarado
        (8 primeros caracteres + asteriscos + 8 últimos).
      operationId: getContractDetailByToken
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractTokenPath"
        - $ref: "#/components/parameters/dniOptional"
      responses:
        "200":
          description: Datos del contrato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractFullDetail"
              example:
                token: CTR-001
                status_token: "1"
                status_name: Activo
                holder_token: "12345678A"
                payment_type: DOM
                use_type: Doméstico
                last_invoice_date: "2026-01-15T10:30:00Z"
                supply_point_address: "C/ Barcelona, 31, 08000 Barcelona"
                meter_serial_number: MTR-001
                meter_caliber: "15"
                smart_metering: "false"
                registration_date: "15/03/2020"
                termination_date: null
                nif: "12345678A"
                tenant_name: Anna Garcia
                holder_name: Anna Garcia
                city: Barcelona
                postal_code: "08110"
                paper_invoice: "false"
                email: anna.garcia@example.com
                invoice_language: es
                phone1: "600000000"
                phone2: "600000001"
                account_holder_dni: "12345678A"
                is_account_holder: true
                is_holder: true
                is_payer: true
                holder_address: "C/ de Mallorca, 45, 2-1, 08013 Barcelona"
                iban: "ES12345678901234567890"
                status:
                  token: "1"
                  name: Activo
                has_sepa_document: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/contract/by-nic/{nic}/:
    get:
      tags:
        - Contrato
      summary: Búsqueda de contrato por NIC
      description: |
        Devuelve el contrato asociado a un NIC (token del punto de suministro,
        `SupplyPoint.token`). Existe para los flujos de acceso directo donde la
        frontend aún no dispone de `contract_token` y solo conoce el NIC del
        cliente.

        El NIC lleva «/» con una o dos barras: formato de dos tramos
        `[num.puntosub]/[numcliente]` (p. ej. `12345/1234`) o de tres tramos
        `[num.puntosub]/[numcliente]/[num.modificacion]` (p. ej.
        `012345/654321/12345678`), por eso el parámetro de ruta usa el conversor
        `path` de Django (si no, el ruter acaba en 404 a nivel de ruta antes de
        llegar a la vista). El formato se valida con la expresión regular
        `^\d+(?:/\d+){1,2}$` **antes** de consultar la base de datos.

        Resolución del contrato: primero los puntos de suministro por defecto
        del contrato (`supply_point_default`); si ningún contrato lo tiene como
        por defecto, se busca por la relación muchos-a-muchos
        (`supply_points`). Si el punto es por defecto de varios contratos se
        devuelve el más reciente (`created_at` descendente).

        El payload del `200` es idéntico al de `/ov/contract/{token}/` más la
        clave explícita `contract_token` (con el mismo valor que `token`), que
        la frontend reutiliza en `?contract_token=` del resto de endpoints.
        Igual que en `/ov/contract/{token}/`, el parámetro opcional `dni`
        desenmascara el IBAN cuando coincide con el titular de la cuenta de
        domiciliación y expone `is_account_holder`, `is_holder` e `is_payer`
        (solo se incluyen si se envía `dni`), además del objeto `status`.

        Un `404` significa que el NIC no existe o no está asociado a ningún
        contrato: la frontend muestra el mensaje «NIC inexistente».
      operationId: getContractByNic
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/nicPath"
        - $ref: "#/components/parameters/dniOptional"
      responses:
        "200":
          description: Datos del contrato asociado al NIC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractByNic"
              example:
                token: CTR-001
                contract_token: CTR-001
                status_token: "1"
                status_name: Activo
                holder_token: "12345678A"
                payment_type: DOM
                use_type: Doméstico
                holder_name: Anna Garcia
                city: Barcelona
                postal_code: "08110"
                iban: "ES12***************7890"
                status:
                  token: "1"
                  name: Activo
                has_sepa_document: false
        "400":
          description: El NIC no cumple el formato esperado (`^\d+(?:/\d+){1,2}$`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Invalid NIC format
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: NIC inexistente o sin contrato asociado (la frontend muestra «NIC inexistente»)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Contract not found

  /ov/meter/{contract_token}/:
    get:
      tags:
        - Contador
      summary: Detalle del contador por token de contrato
      description: |
        Devuelve los cinco datos del contador que la Oficina Virtual muestra en
        su bloque fijo de lectura: número de serie, calibre, cifras, año de
        fabricación y fecha de instalación.
        El `contract_token` de la ruta es el del contrato; el contador se resuelve desde
        su punto de suministro por defecto (`supply_point_default.meter`), el
        mismo origen que `meter_serial_number` y `meter_caliber` de
        `/ov/contract/{token}/`. Este endpoint añade los tres metadatos del
        dispositivo (cifras, fabricación e instalación) que no se exponen en el
        detalle del contrato.

        Si el contrato existe pero no tiene contador, responde `200` con los
        cinco campos a `null`.
      operationId: getMeterDetailByToken
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractTokenMeterPath"
      responses:
        "200":
          description: Datos del contador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterDetail"
              example:
                meter_serial_number: MTR-001
                meter_caliber: "15"
                digits: 5
                manufacture_year: 2019
                installation_date: "2020-03-15"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/procedures/contract/:
    post:
      tags:
        - Trámites
      summary: Solicitar el alta de un contrato
      description: |
        Crea una **solicitud de contrato** (`ContractRequest`) para un nuevo
        suministro, que atención al cliente finalizará posteriormente.

        **No crea ningún contrato, ni órdenes, ni aprueba nada.** La solicitud
        queda en el estado por defecto (borrador) para que atención al cliente
        complete los datos que faltan (contador, fecha de alta, dirección de
        facturación, ...) y la finalice con el flujo existente.

        La tarifa (`tariff_token`) es la que la Oficina Virtual ha mostrado y
        cobrado al abonado, por lo que es la fuente de verdad de la solicitud.
        No se deduce del tipo de trámite: `ContractRequestType.price_rates` es
        una relación M2M que puede contener cero, una o varias tarifas y no
        está relacionada con el catálogo de tarifas activas que expone la OV.

        Se exige que el DNI corresponda a una persona existente, que la
        propiedad exista y tenga un punto de suministro, y que el tipo de
        trámite y la tarifa estén activos. Si el pago es por domiciliación
        (`DIRECT_DEBIT`) se exigen los datos bancarios. Si la propiedad tiene
        más de un punto de suministro activo debe enviarse `supply_point_token`.
      operationId: requestContractProcedure
      security:
        - tokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractProcedureRequest"
            example:
              holder_dni: "12345678A"
              property_token: PROV-0001
              supply_point_token: "1234/1234"
              procedure_type_token: domestic
              tariff_token: TD-2.0TD
              payment_type_token: DIRECT_DEBIT
              iban: ES9121000418450200051332
              iban_holder_name: Nombre Titular
              iban_holder_dni: "12345678A"
              iban_holder_swift: CAIXESBBXXX
              language: ca
              observation: Alta solicitada desde la OV
      responses:
        "201":
          description: Solicitud de contrato creada (estado borrador)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractProcedureResponse"
              example:
                contract_request_token: "20261026001"
                status:
                  token: "1"
                  name: Esborrany
                type:
                  token: domestic
                  name: Domèstic
                person:
                  token: "12345678A"
                  name: Anna
                supply_point:
                  token: "1234/1234"
                payment:
                  iban: ES912100********051332
                created_at: "2026-10-26T09:30:00Z"
        "400":
          description: |
            Campos obligatorios ausentes o inválidos, datos bancarios
            incompletos para domiciliación, o propiedad con varios puntos de
            suministro sin `supply_point_token`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No existe la persona (DNI), la propiedad, el punto de suministro,
            el tipo de trámite, la tarifa o la forma de pago indicados. Los
            tipos y tarifas inactivos también devuelven `404`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                person:
                  value: {error: Person not found}
                property:
                  value: {error: Property not found}
                supplyPoint:
                  value: {error: Supply point not found}
                procedureType:
                  value: {error: Procedure type not found}
                tariff:
                  value: {error: Tariff not found}
                paymentType:
                  value: {error: Payment type not found}
        "409":
          description: |
            Ya existe una solicitud activa (no cancelada ni finalizada) para la
            misma persona y punto de suministro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractProcedureConflictResponse"
              example:
                error: Contract request already exists
                contract_request_token: "20261026001"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: No se ha podido crear la solicitud (estado por defecto no configurado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Contract procedure could not be created

  /ov/procedures/{contract_token}/upload-sepa-signed/:
    post:
      tags:
        - Trámites
      summary: Subir y archivar el mandato SEPA firmado
      description: |
        Sube el mandato SEPA firmado por el titular de la cuenta y lo archiva
        como prueba de la autorización de domiciliación. El documento debe
        estar firmado por el titular de la cuenta; el sistema central lo
        conserva como justificante.

        El archivo se envía como `multipart/form-data` con dos campos:
        `sepa` (PDF o imagen) e `iban` de la cuenta de domiciliación.

        El `iban` recibido se limpia (sin espacios, en mayúsculas) y debe
        coincidir con el IBAN activo del contrato (`payment.IBAN.iban`); si no
        coincide se devuelve `400`. Responde `404` si el contrato no existe.

        El documento se archiva en el gestor documental del sistema central
        (servicio configurado para contratos, por defecto `hdd`) como documento
        SEPA vinculado a la forma de pago del contrato
        (`GeneralPaymentSepaDocument`). Si el contrato ya tenía un mandato
        archivado, se sustituye por el nuevo. La petición y la respuesta
        (`201`) se mantienen sin cambios.
      operationId: uploadSignedProcedureDocument
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractTokenSepaPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - sepa
                - iban
              properties:
                sepa:
                  type: string
                  format: binary
                  description: Mandato SEPA firmado (PDF o imagen)
                iban:
                  type: string
                  description: IBAN de la cuenta de domiciliación del contrato (se normaliza sin espacios y en mayúsculas)
                  example: ES9121000418450200051332
            example:
              sepa: (binario)
              iban: ES9121000418450200051332
      responses:
        "201":
          description: Mandato SEPA firmado subido y archivado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedMandateUploadResponse"
              example:
                contract_token: CTR-001
                success: true
        "400":
          description: |
            Faltan campos o el archivo no es válido (errores de campo en formato
            Django REST Framework), o el `iban` no coincide con la cuenta
            de domiciliación activa del contrato.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrors"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                fieldErrors:
                  summary: Falta el archivo o su tipo no es válido
                  value:
                    sepa:
                      - This field is required.
                ibanMismatch:
                  summary: IBAN distinto al de la cuenta activa
                  value:
                    error: The IBAN does not match the contract's current active account.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /ov/procedures/{contract_token}/sepa-signed/:
    get:
      tags:
        - Trámites
      summary: Descargar el mandato SEPA firmado archivado
      description: |
        Devuelve el documento del mandato SEPA firmado archivado para la forma
        de pago del contrato. Responde `404` si el contrato no existe o si no
        hay ningún mandato archivado (también si el fichero físico no está
        disponible en el gestor documental).
      operationId: downloadSignedProcedureDocument
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractTokenSepaPath"
      responses:
        "200":
          description: Fichero del mandato SEPA firmado
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Nombre del fichero archivado (disposición `attachment`)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            El contrato no existe o no hay mandato SEPA archivado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                contractNotFound:
                  summary: Contrato inexistente
                  value:
                    error: Contract not found
                documentNotFound:
                  summary: Sin mandato archivado
                  value:
                    error: SEPA document not found

  /ov/procedures/{contract_token}/cancel-direct-debit/:
    post:
      tags:
        - Trámites
      summary: Cancelar la domiciliación (revocación del mandato SEPA)
      description: |
        Revoca el mandato SEPA del contrato y cambia su forma de pago al
        tipo de pago indicado, como respuesta a una solicitud de cancelación
        de domiciliación del usuario.

        Cuerpo JSON con `period` (període de facturació desde el que aplica
        la cancelación, p. ej. `2026-3T`), `role` (rol de quien solicita, p.
        ej. `TITULAR` o `PAGADOR`) y `new_payment_type` (opcional: token del
        nuevo tipo de pago; si falta se usa `BANK_TRANSFER`).

        Flujo: `404` si el contrato no existe; `400` si faltan campos, si el
        contrato no tiene forma de pago o si `new_payment_type` no
        corresponde a un `PaymentType` existente; `500` si el tipo por
        defecte `BANK_TRANSFER` no está en la base de datos.

        Operación **idempotente**: si el contrato ya tiene el tipo de pago
        objetivo no se escribe nada (ni cambio de tipo, ni `ContractLog`, ni
        `ContractObservation`) y se responde `200` con
        `message: "Direct debit already cancelled."`.

        Cuando sí hay cambio, se actualiza `contract.payment.type` y se
        registran una entrada de auditoría `ContractLog` (campo
        `payment_type`, con el token anterior y el nuevo) y una
        `ContractObservation` con el `period` y el `role` solicitados, todo
        dentro de una transacción.
      operationId: cancelDirectDebit
      security:
        - tokenAuth: []
      parameters:
        - $ref: "#/components/parameters/contractTokenCancelPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelDirectDebitRequest"
            example:
              period: "2026-3T"
              role: TITULAR
              new_payment_type: BANK_TRANSFER
      responses:
        "200":
          description: |
            Cancelación aplicada (cambio de tipo de pago + auditoría) o bien
            ya estaba cancelada (respuesta idempotente, sin escrituras).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelDirectDebitResponse"
              examples:
                cancelled:
                  summary: Cancelación aplicada
                  value:
                    contract_token: CTR-001
                    success: true
                    message: Direct debit cancelled successfully.
                alreadyCancelled:
                  summary: Ya estaba cancelada (idempotente, sin escrituras)
                  value:
                    contract_token: CTR-001
                    success: true
                    message: Direct debit already cancelled.
        "400":
          description: |
            Faltan campos (formato Django REST Framework), el contrato no
            tiene forma de pago o `new_payment_type` no existe.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrors"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                fieldErrors:
                  summary: Faltan period o role
                  value:
                    period:
                      - This field is required.
                noPayment:
                  summary: El contrato no tiene forma de pago
                  value:
                    error: Contract has no payment method
                invalidPaymentType:
                  summary: Token de tipo de pago desconocido
                  value:
                    error: Invalid payment type token
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: El tipo de pago por defecto `BANK_TRANSFER` no existe en la base de datos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Default payment type BANK_TRANSFER not found

  /ov/dictionary/contract-statuses/:
    get:
      tags:
        - Diccionarios
      summary: Estados de contrato disponibles
      description: |
        Devuelve los estados de contrato definidos en el PA como pares
        `token`/`name`, ordenados por su `position` de presentación. Permite
        al frontal externo rellenar selectores y traducir tokens sin
        hardcodearlos. No incluye campos de presentación (color, etc.).
      operationId: listContractStatusesDictionary
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Estados de contrato ordenados por `position`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DictionaryItem"
              example:
                - token: "1"
                  name: Activo
                - token: "2"
                  name: Inactivo
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ov/dictionary/payment-types/:
    get:
      tags:
        - Diccionarios
      summary: Formas de pago disponibles
      description: |
        Devuelve las formas de pago definidas en el PA como pares
        `token`/`name`, ordenadas por su `position` de presentación. El
        `token` es el mismo que aceptan los endpoints de facturación
        (p. ej. `exc_payment_type_token`).
      operationId: listPaymentTypesDictionary
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Formas de pago ordenadas por `position`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DictionaryItem"
              example:
                - token: DIRECT_DEBIT
                  name: Domiciliació bancària (SEPA)
                - token: BANK_TRANSFER
                  name: Transferència bancària
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ov/dictionary/invoice-statuses/:
    get:
      tags:
        - Diccionarios
      summary: Estados de factura disponibles
      description: |
        Devuelve los estados de factura definidos en el PA como pares
        `token`/`name`, ordenados por su `position` de presentación. Los
        tokens son los mismos que acepta el filtro `statuses` de
        `/ov/unpayed-invoices/`.
      operationId: listInvoiceStatusesDictionary
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Estados de factura ordenados por `position`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DictionaryItem"
              example:
                - token: "0"
                  name: Pagada
                - token: "-1"
                  name: Vencida
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ov/dictionary/procedure-tariffs/:
    get:
      tags:
        - Diccionarios
      summary: Tarifas activas aplicables a trámites
      description: |
        Devuelve el catálogo de tarifas activas (`PriceRate.is_active`) con su
        coste, ordenado por `name`. Para cada tarifa se resuelve su periodo de
        facturación activo (`billing_range_active`) y sus conceptos:

        - `type_price`: `fixed` si todos los conceptos son importes fijos;
          `variable` si alguno se tarifa por tramos.
        - `price`: suma de los conceptos fijos (importe unitario sin
          impuestos); `null` cuando no hay conceptos fijos.
        - `price_table`: tabla del primer concepto variable (se prioriza
          `price_interval` sobre `price_variable`); `null` si la tarifa es
          fija. `units` indica la dimensión del tramo: `m3` (consumo),
          `dm_met` (calibre del contador) o `dm_con` (diámetro de conexión).
        - `components`: desglose completo de cada concepto con la misma forma
          (`token`, `name`, `type_price`, `price`, `price_table`).

        El frontal externo lo usa para calcular el coste total de un trámite
        antes de cobrar al abonado.
      operationId: listProcedureTariffsDictionary
      security:
        - tokenAuth: []
      responses:
        "200":
          description: Tarifas activas ordenadas por `name`
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcedureTariffItem"
              example:
                - token: TR-001
                  name: Tarifa 2.0TD
                  type_price: variable
                  price: null
                  price_table:
                    units: dm_met
                    stretches:
                      - name: Calibre 13
                        min: 1
                        max: 13
                        price: 45.0
                        proportional_price: null
                      - name: Calibre 20
                        min: 14
                        max: 20
                        price: 78.5
                        proportional_price: null
                  components:
                    - token: LIT-001
                      name: Alta por calibre
                      type_price: variable
                      price: null
                      price_table:
                        units: dm_met
                        stretches:
                          - name: Calibre 13
                            min: 1
                            max: 13
                            price: 45.0
                            proportional_price: null
                - token: TR-BAIL
                  name: Fianza contador
                  type_price: fixed
                  price: 100.0
                  price_table: null
                  components:
                    - token: LIT-002
                      name: Fianza
                      type_price: fixed
                      price: 100.0
                      price_table: null
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Token obtenido vía `POST /auth/login/`.
        Formato de la cabecera: `Authorization: Token <token>`

  parameters:
    contractToken:
      name: contract_token
      in: query
      required: true
      description: Token del contrato (`Contract.token`)
      schema:
        type: string
      example: CTR-001

    invoiceToken:
      name: invoice_token
      in: query
      required: true
      description: Token de la factura (`Invoice.token`) o, en PDF, también `serie_final`
      schema:
        type: string
      example: INV-001

    dni:
      name: dni
      in: query
      required: true
      description: |
        DNI/NIF del titular del contrato (`Contract.holder.token`) o del titular de la
        cuenta de domiciliación (`PersonBank.dni` / `PersonBank.person.token`).
      schema:
        type: string
      example: "12345678A"

    dniOptional:
      name: dni
      in: query
      required: false
      description: |
        DNI/NIF del solicitante. En `/ov/contract/{token}/`, en
        `/ov/contract/by-nic/{nic}/` y en `/ov/contract-detail/` determina las
        banderas `is_account_holder`, `is_holder` e `is_payer` (solo se evalúan
        y se incluyen en la respuesta cuando se envía) y desenmascara el IBAN
        cuando coincide con el titular de la cuenta de domiciliación.
      schema:
        type: string
      example: "12345678A"

    contractStatus:
      name: estado
      in: query
      required: false
      description: |
        Token de estado de contrato (`ContractStatus.token`) por el que filtrar.
        Tokens habituales en los fixtures de referencia: `1` (Alta) y `-1` (Baixa).
        Los tokens reales dependen de la configuración del despliegue.
      schema:
        type: string
      example: "1"

    pageParam:
      name: page
      in: query
      required: false
      description: Número de página (base 1).
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    limitParam:
      name: limit
      in: query
      required: false
      description: |
        Número máximo de contratos por página. El servidor acota el valor al máximo
        configurado aunque se solicite uno mayor.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    dateFrom:
      name: date_from
      in: query
      required: false
      description: Fecha mínima de lectura (inclusive), formato `YYYY-MM-DD`.
      schema:
        type: string
        format: date
      example: "2025-01-01"

    dateTo:
      name: date_to
      in: query
      required: false
      description: Fecha máxima de lectura (inclusive), formato `YYYY-MM-DD`.
      schema:
        type: string
        format: date
      example: "2025-12-31"

    pageSize:
      name: page_size
      in: query
      required: false
      description: Tamaño de página. El servidor acota el valor al máximo indicado aunque se solicite uno mayor.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      example: 50

    contractTokenPath:
      name: token
      in: path
      required: true
      description: Token del contrato (`Contract.token`)
      schema:
        type: string
      example: CTR-001

    nicPath:
      name: nic
      in: path
      required: true
      description: |
        NIC = token del punto de suministro (`SupplyPoint.token`), con una o
        dos barras: formato de dos tramos `[num.puntosub]/[numcliente]`
        (p. ej. `12345/1234`) o de tres tramos
        `[num.puntosub]/[numcliente]/[num.modificacion]` (p. ej.
        `012345/654321/12345678`). El «/» forma parte de la propia ruta.
      schema:
        type: string
        pattern: '^\d+(?:/\d+){1,2}$'
      example: "012345/654321/12345678"

    contractTokenMeterPath:
      name: contract_token
      in: path
      required: true
      description: Token del contrato (`Contract.token`)
      schema:
        type: string
      example: CTR-001

    contractTokenSepaPath:
      name: contract_token
      in: path
      required: true
      description: Token del contrato (`Contract.token`)
      schema:
        type: string
      example: CTR-001

    contractTokenCancelPath:
      name: contract_token
      in: path
      required: true
      description: Token del contrato (`Contract.token`)
      schema:
        type: string
      example: CTR-001

    invoiceTokenPath:
      name: token
      in: path
      required: true
      description: Token de la factura (`Invoice.token`)
      schema:
        type: string
      example: INV-001

    consumptionIdPath:
      name: id
      in: path
      required: true
      description: ID de la lectura (`Reading.id`)
      schema:
        type: integer
      example: 42

    downloadFormat:
      name: format
      in: query
      required: false
      description: |
        Formato del fichero para `GET /ov/consumption/{id}/download/`
        (`pdf` por defecto o `csv`).
      schema:
        type: string
        enum: [pdf, csv]
        default: pdf
      example: pdf

  responses:
    Unauthorized:
      description: Falta o es incorrecto el token de autenticación
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            detail: Las credenciales de autenticación no se proveyeron.

    BadRequest:
      description: Parámetros o datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          examples:
            missingToken:
              summary: Falta contract_token
              value:
                error: Contract token is required
            notFound:
              summary: Contrato no encontrado
              value:
                error: Contract not found

    ValidationErrors:
      description: Errores de validación del cuerpo JSON (formato Django REST Framework)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrors"
          example:
            date_from:
              - La fecha de inicio no puede ser posterior a la final
            reading_ids:
              - ID de lectura desconocido: 999

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Contract not found

    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: "Failed to update billing data: ..."

    TooManyRequests:
      description: Se ha superado el límite de consultas para esta cuenta
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            detail: Solicitud fue regulada (throttled). Expected available in 60 seconds.

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: ov_user
        password:
          type: string
          format: password
          example: "********"

    LoginResponse:
      type: object
      required:
        - username
        - token
      properties:
        username:
          type: string
          example: ov_user
        token:
          type: string
          description: Token para la cabecera Authorization
          example: 7b21d0b21ac28cd8721688b5db7d484adc32101f

    ErrorDetail:
      type: object
      properties:
        detail:
          type: string

    ErrorMessage:
      type: object
      properties:
        error:
          type: string

    ValidationErrors:
      type: object
      additionalProperties: true
      description: Errores de validación por campo (formato Django REST Framework)

    ContractDetail:
      type: object
      properties:
        token:
          type: string
          description: Token del contrato
        status_token:
          type: string
          nullable: true
          description: Token del estado del contrato
        status_name:
          type: string
          nullable: true
          description: Nombre del estado del contrato
        status:
          type: object
          nullable: true
          description: Estado del contrato como objeto, añadido sin retirar los campos legacy
          properties:
            token:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
        holder_token:
          type: string
          nullable: true
          description: NIF/documento del titular
        payment_type:
          type: string
          nullable: true
          description: Token del tipo de pago
        use_type:
          type: string
          nullable: true
          description: Tipo de uso del contrato
        last_invoice_date:
          type: string
          format: date-time
          nullable: true
          description: Fecha de creación de la última factura
        iban:
          type: string
          description: IBAN enmascarado
        supply_point_address:
          type: string
          nullable: true
          description: Dirección del punto de suministro por defecto
        meter_serial_number:
          type: string
          nullable: true
          description: Token del contador
        meter_caliber:
          type: string
          nullable: true
          description: Calibre del contador
        smart_metering:
          type: string
          enum: ["true", "false"]
          description: Indica si el contador tiene telelectura
        registration_date:
          type: string
          nullable: true
          description: Fecha de alta en formato dd/mm/aaaa
        termination_date:
          type: string
          nullable: true
          description: Fecha de baja en formato dd/mm/aaaa (si el contrato está dado de baja)

    BillingData:
      type: object
      properties:
        nif:
          type: string
          description: NIF del titular
        tenant_name:
          type: string
          description: Nombre completo del titular
        supply_point_address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        paper_invoice:
          type: string
          enum: ["true", "false"]
          description: "`true` si recibe factura en papel, `false` si es digital"
        email:
          type: string
        invoice_language:
          type: string
          description: Idioma de factura (configuración del despliegue)
        phone1:
          type: string
        phone2:
          type: string
        payment_type:
          type: string
          nullable: true
          description: Token del tipo de pago
        iban:
          type: string
          description: IBAN enmascarado
        holder_name:
          type: string
          description: Nombre completo del titular
        has_sepa_document:
          type: boolean
          description: |
            `true` si la forma de pago del contrato tiene un mandato SEPA
            firmado archivado (`GeneralPaymentSepaDocument`); `false` si no hay
            mandato o el contrato no tiene forma de pago.

    PersonDataResponse:
      type: object
      description: Datos de contacto de una persona, incluidas sus filas inactivas.
      required:
        - person
        - phones
        - emails
        - addresses
      properties:
        person:
          $ref: "#/components/schemas/PersonSummary"
        phones:
          type: array
          items:
            $ref: "#/components/schemas/PersonPhoneItem"
        emails:
          type: array
          items:
            $ref: "#/components/schemas/PersonEmailItem"
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/PersonAddressItem"

    PersonSummary:
      type: object
      required:
        - token
        - name
        - surname
        - is_juridic
      properties:
        token:
          type: string
          description: DNI/NIF de la persona (`Person.token`)
          example: "12345678A"
        name:
          type: string
          nullable: true
          example: Anna
        surname:
          type: string
          nullable: true
          example: Garcia
        is_juridic:
          type: boolean
          description: Indica si la persona es jurídica (empresa) en lugar de física

    PersonPhoneItem:
      type: object
      required:
        - token
        - phone
        - role
        - is_default
        - is_active
      properties:
        token:
          type: string
          description: Token de la fila `PersonContact`
          nullable: true
        phone:
          type: string
          example: "600123456"
        role:
          type: string
          nullable: true
          description: Rol del contacto (etiqueta libre)
        is_default:
          type: boolean
        is_active:
          type: boolean

    PersonEmailItem:
      type: object
      required:
        - token
        - email
        - role
        - is_default
        - is_active
      properties:
        token:
          type: string
          description: Token de la fila `PersonContact`
          nullable: true
        email:
          type: string
          format: email
          example: anna.garcia@example.com
        role:
          type: string
          nullable: true
          description: Rol del contacto (etiqueta libre)
        is_default:
          type: boolean
        is_active:
          type: boolean

    PersonAddressItem:
      type: object
      description: |
        Dirección de una persona (`PersonAddress`). `address` es `null` cuando
        la fila no tiene dirección asociada; en ese caso los campos de la
        dirección también son `null`.
      required:
        - token
        - address
        - attention_to
        - is_billing
        - is_active
      properties:
        token:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
          description: Dirección completa ya formateada
          example: "C. Major, 123 2-B, Barcelona"
        street:
          type: string
          nullable: true
          example: "C. Major"
        street_number:
          type: string
          nullable: true
          example: "123"
        postal_code:
          type: string
          nullable: true
          example: "08001"
        city:
          type: string
          nullable: true
          example: Barcelona
        floor:
          type: string
          nullable: true
          example: "2"
        door:
          type: string
          nullable: true
          example: B
        stair:
          type: string
          nullable: true
        building:
          type: string
          nullable: true
        attention_to:
          type: string
          nullable: true
          description: Persona o entidad a la que va dirigida la dirección
        is_billing:
          type: boolean
          description: Indica si es la dirección de facturación
        is_active:
          type: boolean
          description: Indica si la dirección está activa (false = histórica)

    ContactData:
      allOf:
        - $ref: "#/components/schemas/BillingData"
        - type: object
          properties:
            holder_address:
              type: string
              nullable: true
              description: Dirección postal del titular del contrato (`PersonAddress` con `is_billing`); `null` si el titular no tiene dirección de envío
              example: "C/ de Mallorca, 45, 2-1, 08013 Barcelona"

    BatchInvoiceDownloadRequest:
      type: object
      required:
        - invoice_tokens
      properties:
        invoice_tokens:
          type: array
          minItems: 1
          description: Fitxes de las facturas a incluir en el ZIP (se desduplican; todas deben pertenecer al contrato y ser definitivas)
          items:
            type: string
          example:
            - "INV-001"
            - "INV-002"

    UpdateBillingDataRequest:
      type: object
      required:
        - paper_invoice
      properties:
        email:
          type: string
          format: email
          nullable: true
        phone1:
          type: string
        phone2:
          type: string
        paper_invoice:
          type: boolean
          description: "`true` para factura en papel, `false` para factura digital"

    UpdateBillingDataResponse:
      type: object
      properties:
        message:
          type: string
        data:
          $ref: "#/components/schemas/BillingData"

    UpdateIbanRequest:
      type: object
